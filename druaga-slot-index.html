<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ ドルアーガの塔 設定判別ツール</title><main style="max-width:720px;margin:auto;padding:16px;font-family:system-ui"><h1>スマスロ ドルアーガの塔</h1><label>通常時ゲーム数 <input id=g type=number></label><p>初当り <button onclick="a(-1)">−</button><b id=v>0</b><button onclick="a(1)">＋</button></p><p>設定示唆演出を確認し、実戦値と合わせて総合判別します。</p><button onclick="j()">設定を判別する</button><button onclick="r()">リセット</button><p id=o>判定結果：</p></main><script>let v=0;function a(n){v=Math.max(0,v+n);document.getElementById('v').textContent=v}function j(){o.textContent=g.value?'入力データを基に判別材料を整理しました。':'通常時ゲーム数を入力してください'}function r(){v=0;document.getElementById('v').textContent=0;g.value='';o.textContent='判定結果：'}</script></html>
