<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戦国乙女3～天剣を継ぐもの～｜設定判別</title><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}button{padding:9px 13px;border:0;border-radius:8px;font-weight:700}.row{padding:9px 0;border-bottom:1px solid #eee}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:center}</style></head><body><main><h1>戦国乙女3～天剣を継ぐもの～｜設定判別</h1><section><h2>AT初当り</h2><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>AT初当り回数<input id="a" type="number" min="0"></label><button onclick="j()">判別する</button> <button onclick="z()">リセット</button><pre id="r">判定結果：</pre></section><section><h2>AT初当り確率</h2><table><tr><th>設定</th><th>AT初当り</th></tr><tr><td>1</td><td>1/758.9</td></tr><tr><td>2</td><td>1/648.3</td></tr><tr><td>3</td><td>1/551.6</td></tr><tr><td>4</td><td>1/419.8</td></tr><tr><td>5</td><td>1/322.5</td></tr><tr><td>6</td><td>1/282.0</td></tr></table></section><section><h2>設定示唆</h2><div class="row">弱チェリー・スイカ成立時の勾玉チャンス（低確・通常）：設定1=0.4%～設定6=2.3%</div><div class="row">朝一ヒストリア：流浪篇＝設定2以上／将軍篇＝設定4以上</div><div class="row">AT終了：ロゴ＝設定2以上／良スタンプ＝設定4以上／優スタンプ＝設定5以上／極スタンプ＝設定6</div></section></main><script>function j(){let g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0;if(!g||!a){r.textContent='判定結果：ゲーム数とAT初当り回数を入力してください。';return}let x=g/a,v=[758.9,648.3,551.6,419.8,322.5,282],b=1,e=1e9;v.forEach((n,i)=>{let d=Math.abs(x-n);if(d<e){e=d;b=i+1}});r.textContent=`判定結果：実績1/${x.toFixed(1)}。単純近似では設定${b}付近（参考値）`}function z(){g.value=a.value='';r.textContent='判定結果：'}</script></body></html>
