<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>異世界かるてっと 設定判別</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#111827}.app{max-width:980px;margin:auto;padding:10px 8px 32px}h1{text-align:center;font-size:20px}.card{background:#fff;border-radius:14px;padding:14px 12px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.mode{display:flex;align-items:center;gap:9px;font-weight:800;margin-bottom:12px}.toggle{width:54px;height:30px;border:0;border-radius:20px;background:#9ca3af;padding:3px}.toggle span{display:block;width:24px;height:24px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:#111827}.toggle.on span{transform:translateX(24px)}.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}.games input{display:block;width:100%;height:46px;margin-top:5px;border:1px solid #d1d5db;border-radius:10px;padding:10px}.row{display:grid;grid-template-columns:1fr 142px;align-items:center;gap:8px;margin-top:9px;font-weight:700}.counter{height:44px;display:grid;grid-template-columns:39px 1fr 39px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden}.counter button{border:0;background:#e5e7eb;font-size:21px;font-weight:800}.counter span{display:flex;align-items:center;justify-content:center}.rate{font-size:12px;color:#6b7280;margin-top:8px}.judge,.reset{width:100%;height:52px;border:0;border-radius:12px;font-size:17px;font-weight:800}.judge{margin-top:14px;background:#111827;color:white}.reset{margin-top:9px;background:#e5e7eb}.result{display:none}.result.show{display:block}.gr{display:grid;grid-template-columns:45px 1fr 50px;gap:7px;align-items:center;margin:9px 0}.bg{height:18px;background:#e5e7eb;border-radius:20px;overflow:hidden}.bar{height:100%;background:#111827}.materials details{border-top:1px solid #eee;padding:12px 0}.materials summary{font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.grid button{min-height:66px;border:1px solid #d1d5db;border-radius:10px;background:#f9fafb;padding:8px;font-weight:700}.grid button.selected{background:#e5e7eb;border-color:#111827}.grid small{color:#6b7280}.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.nums input{width:100%;height:44px;border:1px solid #d1d5db;border-radius:9px;padding:8px}</style></head><body><main class="app"><h1>A-SLOT+ 異世界かるてっと BT<br>設定判別ツール</h1><section class="card"><div class="mode"><span>総ゲーム数で判別</span><button id="mode" class="toggle on"><span></span></button><b id="ml">ON</b></div><div class="games"><label>通常ゲーム数<input id="games" type="number"></label><label>開始ゲーム数<input id="start" type="number" value="0"></label></div><div id="rows"></div><div class="rate" id="rate">出現率：-</div><div class="nums"><label>BIG中 消化G<input id="bg" type="number"></label><label>BIG中 ハズレ目<input id="bm" type="number"></label><label>BT中 消化G<input id="tg" type="number"></label><label>BT中 特殊7枚役<input id="ts" type="number"></label></div><button class="judge" id="judge">設定を判別する</button><button class="reset" id="reset">リセット</button></section><section id="result" class="card result"><h2 id="pred">設定予測</h2><div id="graph"></div></section><section class="card materials"><h2>各種判定材料</h2><details open><summary>サミートロフィー</summary><div class="grid"><button data-min="2">銅トロフィー<br><small>設定2以上濃厚</small></button><button data-min="5">銀トロフィー<br><small>設定5以上濃厚</small></button><button data-min="5">金トロフィー<br><small>設定5以上濃厚</small></button><button data-min="5">キリン柄トロフィー<br><small>設定5以上濃厚</small></button><button data-min="6">虹トロフィー<br><small>設定6濃厚</small></button></div></details><details><summary>BIG・うわのせCHANCE終了画面</summary><div class="grid"><button data-high="1">女子キャラ集合<br><small>高設定示唆［弱］</small></button><button data-high="2">全員集合<br><small>高設定示唆［強］</small></button><button data-min="2">シルクハット出現<br><small>設定2以上濃厚</small></button><button data-min="5">ハムスケ＆デスナイト君<br><small>設定5以上濃厚</small></button></div></details><details><summary>特定の獲得枚数表示</summary><div class="grid"><button data-min="5">Re:0枚 OVER表示<br><small>設定5以上濃厚</small></button><button data-min="2">086枚 OVER表示<br><small>設定2以上濃厚</small></button><button data-min="6">666枚 OVER表示<br><small>設定6濃厚</small></button></div></details></section></main><script>const S=[1,2,5,6],R={first:{1:197.6,2:193.9,5:175.4,6:161.1},bonus:{1:99.9,2:98.1,5:89.1,6:82.1},isekai:{1:107.6,2:106.2,5:97.1,6:89.2},suika:{1:45,2:39.7,5:39,6:37.4}};let c={first:0,bonus:0,isekai:0,suika:0},on=true;const $=x=>document.getElementById(x),N={first:'ボーナス初当り',bonus:'ボーナス合算',isekai:'いせかる目 / 突BT',suika:'スイカ'};$('rows').innerHTML=Object.keys(c).map(k=>`<div class="row"><span>${N[k]}</span><div class="counter"><button data-k="${k}" data-d="-1">−</button><span id="${k}">0</span><button data-k="${k}" data-d="1">＋</button></div></div>`).join('');function G(){return Math.max(0,+$('games').value||0)}function refresh(){$('rate').textContent=Object.keys(c).map(k=>`${N[k]} ${c[k]&&G()?'1/'+(G()/c[k]).toFixed(1):'-'}`).join(' ｜ ')}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;c[k]=Math.max(0,c[k]+ +b.dataset.d);$(k).textContent=c[k];refresh()});$('games').oninput=refresh;$('mode').onclick=()=>{on=!on;$('mode').classList.toggle('on',on);$('ml').textContent=on?'ON':'OFF'};document.querySelectorAll('.materials button').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));function lf(n){let z=0;for(let i=2;i<=n;i++)z+=Math.log(i);return z}function p(n,g,r){if(!g)return 0;let l=g/r;return n?n*Math.log(l)-l-lf(n):-l}function allow(s){let m=1;document.querySelectorAll('.materials button.selected').forEach(b=>{if(b.dataset.min)m=Math.max(m,+b.dataset.min)});return s>=m}function hi(s){let z=0;document.querySelectorAll('[data-high].selected').forEach(b=>z+=+b.dataset.high*(s>=5?.7:s==2?.15:-.2));return z}$('judge').onclick=()=>{let g=G();if(on&&!g)return alert('通常ゲーム数を入力してください');let L={};S.forEach(s=>{if(!allow(s))return L[s]=-Infinity;L[s]=hi(s);if(on&&g)L[s]+=p(c.first,g,R.first[s])+p(c.bonus,g,R.bonus[s])*.85+p(c.isekai,g,R.isekai[s])*.9+p(c.suika,g,R.suika[s])*.65});let v=S.filter(s=>isFinite(L[s])),mx=Math.max(...v.map(s=>L[s])),w={},sum=0;v.forEach(s=>{w[s]=Math.exp(L[s]-mx);sum+=w[s]});S.forEach(s=>w[s]=isFinite(L[s])?w[s]/sum:0);let best=S.reduce((a,b)=>w[a]>=w[b]?a:b);$('pred').textContent=`設定${best} が最有力`;$('graph').innerHTML=S.map(s=>`<div class="gr"><span>設定${s}</span><div class="bg"><div class="bar" style="width:${(w[s]*100).toFixed(1)}%"></div></div><span>${(w[s]*100).toFixed(1)}%</span></div>`).join('');$('result').classList.add('show')};$('reset').onclick=()=>location.reload();refresh();</script></body></html>
