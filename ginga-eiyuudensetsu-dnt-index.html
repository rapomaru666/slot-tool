<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銀河英雄伝説 Die Neue These｜設定判別ツール</title><style>body{font-family:system-ui;margin:auto;max-width:760px;padding:16px;background:#f6f7f9}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}button{padding:8px 12px;border:0;border-radius:8px}input{padding:9px;width:100%;box-sizing:border-box}</style></head><body><main><section class="card"><h1>銀河英雄伝説 Die Neue These</h1><p>機種別設定判別ツール</p></section><section class="card"><label>総ゲーム数<input id="g" type="number" min="0"></label><div class="row">初当り回数 <span><button onclick="a(-1)">−</button><b id="v">0</b><button onclick="a(1)">＋</button></span></div><div class="row">AT・BONUS回数 <span><button onclick="b(-1)">−</button><b id="w">0</b><button onclick="b(1)">＋</button></span></div><button onclick="j()">設定を判別する</button><p id="o">判定結果：</p></section><section class="card"><h2>各種判定材料</h2><p>公表値・実機で確認できる設定差を入力して使用します。未確認の数値は推測で追加しません。</p></section></main><script>let v=0,w=0;function a(n){v=Math.max(0,v+n);document.getElementById('v').textContent=v}function b(n){w=Math.max(0,w+n);document.getElementById('w').textContent=w}function j(){let g=+document.getElementById('g').value||0;document.getElementById('o').textContent=g?'判定対象 '+g+'G':'総ゲーム数を入力してください。'}</script></body></html>
