<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パチスロ頭文字D｜設定判別</title><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}button{padding:9px 13px;border:0;border-radius:8px;font-weight:700}.row{padding:10px 0;border-bottom:1px solid #eee}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:center}.hit{font-weight:700}</style></head><body><main><h1>パチスロ頭文字D｜設定判別</h1><section><b>設定判別ポイント</b><p>AT初当りを記録し、設定1〜6の公表値と比較します。</p><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>AT初当り回数<input id="a" type="number" min="0"></label><button onclick="judge()">判別する</button> <button onclick="reset()">リセット</button><pre id="r">判定結果：</pre></section><section><h2>獲得枚数表示の設定示唆</h2><div class="row">86枚（当日1回目） → 設定2以上濃厚</div><div class="row">86枚（当日3回目以上） → 設定4以上濃厚</div><div class="row">85枚 → 設定5以上濃厚</div></section><section><h2>AT初当り確率</h2><table><tr><th>設定</th><th>初当り</th></tr><tr><td>1</td><td>1/758.9</td></tr><tr><td>2</td><td>1/691.4</td></tr><tr><td>3</td><td>1/626.0</td></tr><tr><td>4</td><td>1/566.4</td></tr><tr><td>5</td><td>1/512.0</td></tr><tr><td>6</td><td>1/464.0</td></tr></table><p>※公開情報の設定差・示唆を参照した補助判定です。確率だけで設定を断定しません。</p></section></main><script>function judge(){const g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0;if(!g){r.textContent='判定結果：ゲーム数を入力してください。';return}const rate=g/a;const vals=[758.9,691.4,626,566.4,512,464];let best=0,err=Infinity;vals.forEach((v,i)=>{const e=Math.abs(rate-v);if(a&&e<err){err=e;best=i+1}});r.textContent=a?`判定結果：実績 ${g/a.toFixed(1)}G/初当り。近似値は設定${best}付近（参考値）`:'判定結果：初当り回数を入力してください。'}function reset(){g.value=a.value='';r.textContent='判定結果：'}</script></body></html>
