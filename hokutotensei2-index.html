<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スマスロ 北斗の拳 転生の章2｜設定判別ツール</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.app{width:min(100%,980px);margin:auto;padding:14px 10px 36px}.header,.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.header h1{margin:0;font-size:clamp(20px,5vw,29px);line-height:1.4;white-space:nowrap}.header p{margin:5px 0 0;color:#6b7280}.mode{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:12px}.toggle{width:54px;height:30px;border:0;border-radius:20px;background:#9ca3af;padding:3px}.toggle i{display:block;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:#111827}.toggle.on i{transform:translateX(24px)}.games{display:grid;grid-template-columns:1fr 1fr;gap:9px}.games label{font-size:13px;font-weight:700}.games input{display:block;width:100%;height:46px;margin-top:5px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;font-size:17px}.row{display:grid;grid-template-columns:minmax(0,1fr) 170px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f3}.row:last-child{border:0}.row>span{font-weight:700;font-size:14px}.counter{height:44px;display:grid;grid-template-columns:43px 1fr 43px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden}.counter button{border:0;background:#e5e7eb;font-size:21px;font-weight:800}.counter b{display:flex;align-items:center;justify-content:center}.primary,.secondary{width:100%;height:50px;border:0;border-radius:11px;font-weight:800;font-size:16px}.primary{background:#111827;color:#fff;margin-top:12px}.secondary{background:#e5e7eb;margin-top:8px}.result h2,.materials h2{margin:0 0 12px;font-size:19px}.result{display:none}.result.visible{display:block}.pred{font-size:21px;font-weight:800;margin-bottom:14px}.barrow{display:grid;grid-template-columns:48px 1fr 48px;gap:7px;align-items:center;margin:9px 0}.bg{height:16px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#111827}.material{border-top:1px solid #eef0f3;padding:11px 0}.material:first-of-type{border-top:0}.material summary{font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.grid button{min-height:52px;border:1px solid #d1d5db;border-radius:10px;background:#f9fafb;font-weight:700}.grid button.selected{border-color:#111827;background:#e5e7eb}@media(max-width:430px){.row{grid-template-columns:minmax(0,1fr) 145px}.counter{width:145px;grid-template-columns:38px 1fr 38px}.games{gap:7px}}</style></head><body><main class="app"><header class="header"><h1>スマスロ 北斗の拳 転生の章2</h1><p>設定判別ツール</p></header><section class="card"><div class="mode">総ゲーム数で判別 <button id="toggle" class="toggle on"><i></i></button><b id="modeLabel">ON</b></div><div class="games"><label>総ゲーム数<input id="g" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start" type="number" min="0" inputmode="numeric"></label></div><div class="row"><span>AT初当たり回数</span><div class="counter"><button onclick="add('at',-1)">−</button><b id="at">0</b><button onclick="add('at',1)">＋</button></div></div><div class="row"><span>天破の刻突入回数</span><div class="counter"><button onclick="add('tenha',-1)">−</button><b id="tenha">0</b><button onclick="add('tenha',1)">＋</button></div></div><div class="row"><span>筐体上部中央ランプ点灯回数</span><div class="counter"><button onclick="add('lamp',-1)">−</button><b id="lamp">0</b><button onclick="add('lamp',1)">＋</button></div></div><button class="primary" onclick="judge()">設定判別</button><button class="secondary" onclick="resetAll()">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><details class="material"><summary>神拳勝舞終了時のトロフィー</summary><div class="grid"><button data-min="2">銅<br><small>設定2以上示唆</small></button><button data-min="3">銀<br><small>設定3以上示唆</small></button><button data-min="4">金<br><small>設定4以上示唆</small></button><button data-min="5">キリン柄<br><small>設定5以上示唆</small></button><button data-min="6">虹<br><small>設定6濃厚</small></button></div></details><details class="material"><summary>当選あべしゾーン</summary><div class="grid"><button>50あべし</button><button>100あべし</button><button>150あべし</button><button>200あべし</button><button>250あべし</button><button>300あべし</button></div></details></section></main><script>const rates={at:[366,357,336.3,298.7,283.2,273.1],tenha:[98,92,86,80,76,72],lamp:[12,12,13,14,15,16]},s={at:0,tenha:0,lamp:0};let total=true;function add(k,d){s[k]=Math.max(0,s[k]+d);document.getElementById(k).textContent=s[k]}function score(g,c,r){if(!g||!c)return 0;const l=g/r;return c*Math.log(l)-l}function judge(){const raw=+document.getElementById('g').value||0,start=+document.getElementById('start').value||0,g=total?raw:Math.max(0,raw-start);if(!g)return alert('判別対象ゲーム数を入力してください。');const x=rates.at.map((r,i)=>score(g,s.at,r)+score(g,s.tenha,rates.tenha[i])+score(g,s.lamp,rates.lamp[i])),m=Math.max(...x),w=x.map(v=>Math.exp(v-m)),t=w.reduce((a,b)=>a+b,0),p=w.map(v=>v/t*100),best=p.indexOf(Math.max(...p))+1;document.getElementById('pred').textContent=`推定設定：設定${best}（判別対象 ${g}G）`;document.getElementById('bars').innerHTML=p.map((v,i)=>`<div class="barrow"><span>設定${i+1}</span><div class="bg"><div class="bar" style="width:${v}%"></div></div><b>${v.toFixed(1)}%</b></div>`).join('');document.getElementById('result').classList.add('visible')}function resetAll(){Object.keys(s).forEach(k=>s[k]=0);Object.keys(s).forEach(k=>document.getElementById(k).textContent='0');document.getElementById('g').value='';document.getElementById('start').value='';document.getElementById('result').classList.remove('visible')}document.getElementById('toggle').onclick=()=>{total=!total;document.getElementById('toggle').classList.toggle('on',total);document.getElementById('modeLabel').textContent=total?'ON':'OFF'};document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});</script></body></html>
