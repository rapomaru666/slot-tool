<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>スマスロ モンキーターンV 設定判別ツール</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.app{width:min(100%,980px);margin:0 auto;padding:18px 12px 40px}.header{text-align:center;margin-bottom:18px}.header h1{margin:0;font-size:clamp(22px,5vw,32px);line-height:1.4;font-weight:800;white-space:nowrap}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.mode-row{display:flex;align-items:center;gap:9px;margin-bottom:14px;font-weight:800}.toggle{width:54px;height:30px;border:0;border-radius:20px;background:#9ca3af;padding:3px;cursor:pointer}.toggle span{display:block;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}.toggle.on{background:#111827}.toggle.on span{transform:translateX(24px)}.games-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.games-pair label{font-size:13px;font-weight:700}.games-pair input{display:block;width:100%;height:48px;margin-top:6px;border:1px solid #d1d5db;border-radius:10px;padding:0 14px;font-size:17px;background:#fff}.bonus-grid{display:grid;gap:10px}.bonus-row{display:grid;grid-template-columns:minmax(0,1fr) 180px;align-items:center;gap:14px}.bonus-row>span{font-size:15px;font-weight:700;white-space:nowrap}.bonus-row.important{background:#f9fafb;border-radius:10px;padding:7px 8px}.counter{width:180px;height:46px;display:grid;grid-template-columns:48px 1fr 48px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden;background:#fff}.counter-btn{border:0;background:#e5e7eb;color:#111827;font-size:22px;font-weight:800;cursor:pointer;touch-action:manipulation}.counter-btn:active{transform:scale(.96)}.counter span{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}.rate-note{font-size:12px;color:#6b7280;margin-top:-4px;margin-bottom:4px}.judge-btn,.reset-btn{width:100%;height:52px;border:0;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer}.judge-btn{background:#111827;color:#fff;margin-top:14px}.reset-btn{background:#e5e7eb;color:#111827;margin-top:10px}.result-card{display:none}.result-card.visible{display:block}.result-card h2,.materials h2{margin:0 0 14px;font-size:20px}.prediction{font-size:22px;font-weight:800;margin-bottom:18px}.graph{display:grid;gap:12px}.graph-row{display:grid;grid-template-columns:55px minmax(0,1fr) 48px;align-items:center;gap:8px}.bar-bg{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{width:0;height:100%;background:#111827;border-radius:999px;transition:width .35s ease}.graph-row span:last-child{text-align:right;font-size:14px;font-weight:700}.materials details{border-top:1px solid #eef0f3;padding:12px 0}.materials details:first-of-type{border-top:0}.materials summary{cursor:pointer;font-weight:800}.material-grid,.material-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.material-grid button,.material-list button{min-height:58px;border:1px solid #d1d5db;border-radius:10px;background:#f9fafb;color:#111827;padding:8px;cursor:pointer;font-weight:700}.material-grid button.selected,.material-list button.selected{border-color:#111827;background:#e5e7eb}.material-grid small,.material-list small{font-weight:500;color:#6b7280}.five-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.five-table th,.five-table td{padding:8px 4px;border-bottom:1px solid #eef0f3;text-align:center}footer{text-align:center;color:#9ca3af;font-size:12px;line-height:1.7;padding-top:4px}@media(max-width:700px){.app{padding:10px 8px 28px}.header{margin-bottom:12px}.header h1{font-size:20px}.card{padding:14px 12px;border-radius:13px}.bonus-row{grid-template-columns:minmax(0,1fr) 160px;gap:8px}.bonus-row>span{font-size:14px}.counter{width:160px;height:44px;grid-template-columns:44px 1fr 44px}.counter-btn{font-size:21px}.graph-row{grid-template-columns:45px minmax(0,1fr) 42px;gap:6px}}@media(max-width:430px){.games-pair{gap:7px}.games-pair input{font-size:16px;padding:0 10px}.bonus-row{grid-template-columns:minmax(0,1fr) 142px}.bonus-row .counter{width:142px;grid-template-columns:39px 1fr 39px}.material-grid,.material-list{grid-template-columns:1fr 1fr}.materials h2{font-size:18px}}
</style></head>
<body><main class="app">
<header class="header"><h1>スマスロ モンキーターンV 設定判別ツール</h1></header>
<section class="card input-card">
<div class="mode-row"><span>総ゲーム数で判別</span><button id="game-mode" class="toggle on" type="button"><span></span></button><b id="mode-label">ON</b></div>
<div class="games-pair"><label>総ゲーム数<input id="games" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start-games" type="number" min="0" inputmode="numeric" value="0"></label></div>
<div class="bonus-grid">
<div class="bonus-row important"><span>AT初当り回数</span><div class="counter"><button class="counter-btn minus" data-target="at">−</button><span id="at-value">0</span><button class="counter-btn plus" data-target="at">＋</button></div></div>
<div class="bonus-row important"><span>5枚役</span><div class="counter"><button class="counter-btn minus" data-target="five">−</button><span id="five-value">0</span><button class="counter-btn plus" data-target="five">＋</button></div></div>
<div class="rate-note" id="five-rate">5枚役 出現率：-</div>
</div>
<button id="judge-btn" class="judge-btn">設定を判別する</button><button id="reset-btn" class="reset-btn">リセット</button>
</section>
<section id="result-section" class="card result-card"><h2>設定予測</h2><div id="prediction-text" class="prediction">-</div><div class="graph">
<div class="graph-row"><span>設定1</span><div class="bar-bg"><div id="setting-bar-1" class="bar"></div></div><span id="setting-percent-1">0%</span></div>
<div class="graph-row"><span>設定2</span><div class="bar-bg"><div id="setting-bar-2" class="bar"></div></div><span id="setting-percent-2">0%</span></div>
<div class="graph-row"><span>設定4</span><div class="bar-bg"><div id="setting-bar-4" class="bar"></div></div><span id="setting-percent-4">0%</span></div>
<div class="graph-row"><span>設定5</span><div class="bar-bg"><div id="setting-bar-5" class="bar"></div></div><span id="setting-percent-5">0%</span></div>
<div class="graph-row"><span>設定6</span><div class="bar-bg"><div id="setting-bar-6" class="bar"></div></div><span id="setting-percent-6">0%</span></div>
</div></section>
<section class="card materials"><h2>各種判定材料</h2>
<details open><summary>トロフィー</summary><div class="material-grid"><button data-min="2">銅<br><small>設定2以上</small></button><button data-min="4">金<br><small>設定4以上</small></button><button data-min="5">ケロット柄<br><small>設定5以上</small></button><button data-min="6">虹<br><small>設定6</small></button></div></details>
<details><summary>AT直撃</summary><div class="material-list"><button data-min="4">弱レア役からAT直撃<br><small>設定4以上</small></button></div></details>
<details><summary>サブ液晶・舟券</summary><div class="material-list"><button data-even="1">榎木「おつかれ」<br><small>偶数設定示唆</small></button><button data-min="4">榎木「これが艇王…」<br><small>設定4以上</small></button><button data-even="1">銀舟券<br><small>偶数設定示唆</small></button><button data-min="4">金舟券<br><small>設定4以上</small></button><button data-min="6">虹舟券<br><small>設定6</small></button></div></details>
<details><summary>特定の獲得枚数表示</summary><div class="material-grid"><button data-min="4">456枚<br><small>設定4以上</small></button><button data-min="5">803枚<br><small>設定5以上</small></button><button data-min="6">666枚<br><small>設定6</small></button></div></details>
<details><summary>5枚役の設定差</summary><table class="five-table"><tr><th>設定</th><th>1</th><th>2</th><th>4</th><th>5</th><th>6</th></tr><tr><td>出現率</td><td>1/38.15</td><td>1/36.86</td><td>1/30.27</td><td>1/24.51</td><td>1/22.53</td></tr></table></details>
</section><footer>スマスロ モンキーターンV 設定判別ツール</footer></main>
<script>
const SETS=[1,2,4,5,6],AT={1:299.8,2:295.5,4:258.8,5:235.7,6:222.9},FIVE={1:38.15,2:36.86,4:30.27,5:24.51,6:22.53};let counts={at:0,five:0},gameMode=true;
const $=id=>document.getElementById(id);
function targetGames(){return Math.max(0,+$('games').value||0)}
function save(){localStorage.setItem('rapomaru-monkey5-ghoul-layout',JSON.stringify({counts,gameMode,games:$('games').value,start:$('start-games').value,materials:[...document.querySelectorAll('.materials button.selected')].map(b=>[...document.querySelectorAll('.materials button')].indexOf(b))}))}
function updateFive(){const g=targetGames();$('five-rate').textContent=counts.five&&g?'5枚役 出現率：1/'+(g/counts.five).toFixed(2):'5枚役 出現率：-'}
document.querySelectorAll('.counter-btn').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.target;counts[k]=Math.max(0,counts[k]+(b.classList.contains('plus')?1:-1));$(k+'-value').textContent=counts[k];updateFive();save()}));
$('game-mode').addEventListener('click',()=>{gameMode=!gameMode;$('game-mode').classList.toggle('on',gameMode);$('mode-label').textContent=gameMode?'ON':'OFF';updateFive();save()});$('games').addEventListener('input',()=>{updateFive();save()});$('start-games').addEventListener('input',()=>{updateFive();save()});
document.querySelectorAll('.materials button').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('selected');save()}));
function logPois(k,l){if(!k)return 0;if(l<=0)return-1e9;let f=0;for(let i=2;i<=k;i++)f+=Math.log(i);return k*Math.log(l)-l-f}function allowed(s){let min=1,even=false;document.querySelectorAll('.materials button.selected').forEach(b=>{if(b.dataset.min)min=Math.max(min,+b.dataset.min);if(b.dataset.even)even=true});if(s<min)return false;if(even&&!([2,4,6].includes(s)))return false;return true}
$('judge-btn').addEventListener('click',()=>{const g=targetGames();if(!g){alert('総ゲーム数を入力してください');return}let logs={};SETS.forEach(s=>{if(!allowed(s)){logs[s]=-Infinity;return}let L=0;if(counts.at)L+=logPois(counts.at,g/AT[s]);if(counts.five)L+=1.35*logPois(counts.five,g/FIVE[s]);logs[s]=L});let valid=SETS.filter(s=>isFinite(logs[s]));if(!valid.length)return;let mx=Math.max(...valid.map(s=>logs[s])),w={},sum=0;valid.forEach(s=>{w[s]=Math.exp(logs[s]-mx);sum+=w[s]});SETS.forEach(s=>w[s]=isFinite(logs[s])?w[s]/sum:0);let best=SETS.reduce((a,b)=>w[a]>=w[b]?a:b);$('prediction-text').textContent='設定'+best+' が最有力（判別対象 '+g+'G）';SETS.forEach(s=>{let p=w[s]*100;$('setting-bar-'+s).style.width=p.toFixed(1)+'%';$('setting-percent-'+s).textContent=p.toFixed(1)+'%'});$('result-section').classList.add('visible');$('result-section').scrollIntoView({behavior:'smooth',block:'center'});save()});
$('reset-btn').addEventListener('click',()=>{counts={at:0,five:0};$('at-value').textContent='0';$('five-value').textContent='0';$('games').value='';$('start-games').value='0';document.querySelectorAll('.materials button').forEach(b=>b.classList.remove('selected'));$('result-section').classList.remove('visible');updateFive();localStorage.removeItem('rapomaru-monkey5-ghoul-layout')});
try{const s=JSON.parse(localStorage.getItem('rapomaru-monkey5-ghoul-layout')||'{}');if(s.counts)counts=s.counts;if(s.gameMode===false)gameMode=false;$('games').value=s.games||'';$('start-games').value=s.start||0;$('at-value').textContent=counts.at||0;$('five-value').textContent=counts.five||0;$('game-mode').classList.toggle('on',gameMode);$('mode-label').textContent=gameMode?'ON':'OFF';(s.materials||[]).forEach(i=>document.querySelectorAll('.materials button')[i]?.classList.add('selected'));updateFive()}catch(e){}
</script></body></html>
