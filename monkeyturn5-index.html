<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スマスロ モンキーターンV｜RAPOMARU設定判別</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1017;color:#f3f5f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:720px;margin:auto;padding:12px 12px 90px}.card{background:#171d27;border:1px solid #293344;border-radius:16px;padding:14px;margin:10px 0}.top{background:linear-gradient(135deg,#172a45,#111923)}h1{font-size:23px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}.sub,.note{color:#aeb8c7;font-size:13px;line-height:1.55}.counter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #29313e}.counter:last-child{border-bottom:0}.name{font-weight:700}.ctrl{display:flex;align-items:center;gap:8px}.ctrl button,.flag{min-width:42px;min-height:42px;border:0;border-radius:11px;background:#2c3748;color:white;font-size:20px;font-weight:800}.num{min-width:38px;text-align:center;font-size:18px;font-weight:800}.games{display:grid;grid-template-columns:1fr auto;gap:8px}.games input{width:100%;background:#0e141d;color:white;border:1px solid #39465a;border-radius:11px;padding:12px;font-size:18px}.games button{border:0;border-radius:11px;padding:0 14px;background:#2c3748;color:#fff;font-weight:800}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.flag{font-size:13px;padding:9px 6px;min-height:48px}.flag.on{background:#f2b705;color:#17120a;box-shadow:0 0 0 2px #ffe27a inset}.judge{position:sticky;bottom:10px;width:100%;border:0;border-radius:14px;padding:15px;background:#e9eef5;color:#111722;font-size:17px;font-weight:900;box-shadow:0 8px 28px #0008}.result{display:none}.result.show{display:block}.rate{font-size:14px;color:#c8d1dd}.bars{margin-top:10px}.barrow{display:grid;grid-template-columns:54px 1fr 55px;gap:8px;align-items:center;margin:9px 0}.track{height:12px;background:#29313e;border-radius:99px;overflow:hidden}.fill{height:100%;background:#e9eef5;border-radius:99px}.pct{text-align:right;font-weight:800}.lead{font-size:22px;font-weight:900;margin:6px 0}.warn{color:#ffd05a;font-weight:800}.reset{width:100%;border:1px solid #3a4658;background:transparent;color:#c9d2df;border-radius:11px;padding:11px;margin-top:9px}.src{font-size:11px;color:#7f8a99;margin-top:8px}
</style></head><body><main class="app">
<section class="card top"><h1>スマスロ モンキーターンV</h1><div class="sub">RAPOMARU 実戦用 設定判別｜設定1・2・4・5・6</div></section>
<section class="card"><h2>基本データ</h2><div class="games"><input id="games" inputmode="numeric" type="number" min="0" placeholder="総ゲーム数"><button onclick="bumpGames(100)">+100G</button></div><div class="counter"><div><div class="name">AT初当り</div><div class="note" id="atRate">現在 0回</div></div><div class="ctrl"><button onclick="add('at',-1)">−</button><span class="num" id="at">0</span><button onclick="add('at',1)">＋</button></div></div></section>
<section class="card"><h2>強い設定示唆</h2><div class="chips">
<button class="flag" data-key="weakDirect" onclick="toggle(this)">弱レア役 AT直撃<br>設定4+</button>
<button class="flag" data-key="bronze" onclick="toggle(this)">銅トロフィー<br>設定2+</button>
<button class="flag" data-key="gold" onclick="toggle(this)">金トロフィー<br>設定4+</button>
<button class="flag" data-key="kerot" onclick="toggle(this)">ケロット柄<br>設定5+</button>
<button class="flag" data-key="rainbow" onclick="toggle(this)">虹トロフィー<br>設定6</button>
<button class="flag" data-key="456" onclick="toggle(this)">456枚表示<br>設定4+</button>
<button class="flag" data-key="803" onclick="toggle(this)">803枚表示<br>設定5+</button>
<button class="flag" data-key="666" onclick="toggle(this)">666枚表示<br>設定6</button>
</div></section>
<section class="card"><h2>サブ液晶・舟券</h2><div class="chips">
<button class="flag" data-key="otsukare" onclick="toggle(this)">榎木「おつかれ」<br>設定2/4/6</button>
<button class="flag" data-key="teiou" onclick="toggle(this)">榎木「これが艇王…」<br>設定4+</button>
<button class="flag" data-key="silver" onclick="toggle(this)">銀舟券<br>設定2/4/6</button>
<button class="flag" data-key="ticketGold" onclick="toggle(this)">金舟券<br>設定4+</button>
<button class="flag" data-key="ticketRainbow" onclick="toggle(this)">虹舟券<br>設定6</button>
</div></section>
<section class="card result" id="result"><h2>判別結果</h2><div class="lead" id="lead"></div><div class="rate" id="summary"></div><div class="bars" id="bars"></div><div class="note" id="constraint"></div></section>
<button class="judge" onclick="judge()">設定を判別する</button>
<button class="reset" onclick="resetAll()">入力をすべてリセット</button>
<div class="src">AT初当り基準: 1/299.8・1/295.5・1/258.8・1/235.7・1/222.9。示唆演出は公開解析値を反映。判別は設定を保証するものではありません。</div>
</main>
<script>
const rates={1:299.8,2:295.5,4:258.8,5:235.7,6:222.9};const settings=[1,2,4,5,6];let state={at:0,flags:{}};
function $(id){return document.getElementById(id)}
function add(k,n){state[k]=Math.max(0,(state[k]||0)+n);$(k).textContent=state[k];updateRate();save()}
function bumpGames(n){$('games').value=Math.max(0,(+$('games').value||0)+n);updateRate();save()}
function toggle(el){const k=el.dataset.key;state.flags[k]=!state.flags[k];el.classList.toggle('on',!!state.flags[k]);save()}
function updateRate(){const g=+$('games').value||0;$('atRate').textContent=state.at?(g?state.at+'回｜実測 1/'+Math.round(g/state.at):state.at+'回'):'現在 0回'}
function allowed(){let a=[...settings],f=state.flags;const min=n=>a=a.filter(x=>x>=n);if(f.weakDirect||f.gold||f['456']||f.teiou||f.ticketGold)min(4);if(f.bronze)min(2);if(f.kerot||f['803'])min(5);if(f.rainbow||f['666']||f.ticketRainbow)a=[6];if(f.otsukare||f.silver)a=a.filter(x=>[2,4,6].includes(x));return a}
function logFact(n){let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s}
function judge(){const g=+$('games').value||0,k=state.at,a=allowed();$('result').classList.add('show');if(!a.length){$('lead').textContent='示唆入力が矛盾しています';$('summary').textContent='選択した示唆を確認してください。';$('bars').innerHTML='';return}let vals=a.map(s=>{if(!g)return{s,l:1};const lam=g/rates[s];return{s,l:Math.exp(k*Math.log(Math.max(lam,1e-12))-lam-logFact(k))}});let total=vals.reduce((z,x)=>z+x.l,0)||1;vals=vals.map(x=>({...x,p:x.l/total*100})).sort((x,y)=>y.p-x.p);const top=vals[0];$('lead').textContent='最有力：設定'+top.s;$('summary').textContent=g?(g+'G／AT '+k+'回（実測 '+(k?'1/'+Math.round(g/k):'初当りなし')+'）'):'ゲーム数未入力：示唆演出のみで判定';$('bars').innerHTML=settings.map(s=>{const x=vals.find(v=>v.s===s),p=x?x.p:0;return '<div class="barrow"><b>設定'+s+'</b><div class="track"><div class="fill" style="width:'+p.toFixed(1)+'%"></div></div><span class="pct">'+(x?p.toFixed(1):'除外')+(x?'%':'')+'</span></div>'}).join('');$('constraint').innerHTML=(a.length<5?'<span class="warn">示唆から候補：設定'+a.join('・')+'</span><br>':'')+'％はAT初当り確率を同条件として比較した相対値。短時間ではブレるため、確定・濃厚示唆を優先。';save();$('result').scrollIntoView({behavior:'smooth',block:'center'})}
function save(){localStorage.setItem('rapomaru-monkey5',JSON.stringify({at:state.at,flags:state.flags,games:$('games').value}))}
function load(){try{const d=JSON.parse(localStorage.getItem('rapomaru-monkey5')||'{}');state.at=d.at||0;state.flags=d.flags||{};$('at').textContent=state.at;$('games').value=d.games||'';document.querySelectorAll('.flag').forEach(el=>el.classList.toggle('on',!!state.flags[el.dataset.key]));updateRate()}catch(e){}}
function resetAll(){state={at:0,flags:{}};$('games').value='';$('at').textContent='0';document.querySelectorAll('.flag').forEach(x=>x.classList.remove('on'));$('result').classList.remove('show');localStorage.removeItem('rapomaru-monkey5');updateRate()}
$('games').addEventListener('input',()=>{updateRate();save()});load();
</script></body></html>
