<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アオハル♪操 A-LIVE 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}input,button{padding:10px;border-radius:8px;border:1px solid #ddd}button{font-weight:700}.on{background:#222;color:#fff}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.n{font-size:.85rem;color:#666}</style><main><section class=c><h1>アオハル♪操 A-LIVE 設定判別ツール</h1><p class=n>喰種の完成形を参照。喰種ファイル自体は変更しない。</p></section><section class=c><b>総ゲーム数で判別</b> <button id=t class=on>ON</button> <span id=m>ON</span><div class=g><label>総ゲーム数<input id=g type=number></label><label>開始ゲーム数<input id=s type=number></label></div><div class=r>初当り <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>AT/ST/BONUS <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>REG/CZ/高設定要素 <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><button onclick=j()>設定を判別する</button> <button onclick=r()>リセット</button><p id=o></p></section><section class=c><h2>アオハル♪操 A-LIVE 固有判定</h2><p>初当り・BONUS・CZ・終了画面・ボイス・キャラ・ランプ等の機種固有設定示唆をDMMぱちタウン掲載情報と照合。</p></section></main><script>let x=[0,0,0],on=1;t.onclick=()=>{on=!on;t.classList.toggle('on',on);m.textContent=on?'ON':'OFF'};function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){let q=Math.max(0,(+g.value||0)-(on?0:(+s.value||0)));o.textContent=q?'判別対象 '+q+'G':'判別対象ゲーム数を入力してください'}function r(){x=[0,0,0];v0.textContent=v1.textContent=v2.textContent=0;g.value=s.value='';o.textContent='';on=1;t.className='on';m.textContent='ON'}</script></html>
