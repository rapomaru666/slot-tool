<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>スロット ソードアート・オンラインⅡ｜設定判別ツール</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.app{width:min(100%,980px);margin:auto;padding:18px 12px 40px}.header{text-align:center;margin-bottom:18px}.header h1{margin:0;font-size:clamp(22px,5vw,32px);font-weight:800}.header p{margin:4px 0;color:#6b7280;font-size:12px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}h2{font-size:20px;margin:0 0 14px}.games-row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-bottom:16px}.games-row input{height:48px;border:1px solid #d1d5db;border-radius:10px;padding:0 14px;font-size:17px}.grid{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 180px;align-items:center;gap:14px}.row>span{font-weight:700}.counter{width:180px;height:46px;display:grid;grid-template-columns:48px 1fr 48px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden}.counter button{border:0;background:#e5e7eb;font-size:22px;font-weight:800}.counter span{display:flex;align-items:center;justify-content:center;font-weight:700}.action{display:grid;gap:10px;margin-bottom:14px}button{font-family:inherit}.judge,.reset{height:52px;border:0;border-radius:12px;font-size:17px;font-weight:800}.judge{background:#111827;color:#fff}.reset{background:#e5e7eb}.result{display:none}.result.show{display:block}.pred{font-size:22px;font-weight:800;margin-bottom:18px}.g{display:grid;gap:12px}.gr{display:grid;grid-template-columns:55px 1fr 48px;gap:8px;align-items:center}.bg{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:#111827}.pct{text-align:right;font-size:14px;font-weight:700}.notice{color:#6b7280;font-size:12px;line-height:1.6}footer{text-align:center;color:#9ca3af;font-size:12px}@media(max-width:700px){.app{padding:10px 8px 28px}.card{padding:14px 12px}.games-row{grid-template-columns:1fr;gap:6px}.row{grid-template-columns:1fr 160px}.counter{width:160px;grid-template-columns:44px 1fr 44px}.gr{grid-template-columns:45px 1fr 42px}}</style></head><body><main class="app"><header class="header"><h1>スロット ソードアート・オンラインⅡ</h1><p>設定判別ツール</p></header><section class="card"><div class="games-row"><b>総ゲーム数</b><input id="g" type="number" min="1" inputmode="numeric" placeholder="数字を入力"></div><div class="grid"><div class="row"><span>CZ初当り</span><div class="counter"><button onclick="c('cz',-1)">−</button><span id="cz">0</span><button onclick="c('cz',1)">＋</button></div></div><div class="row"><span>AT初当り</span><div class="counter"><button onclick="c('at',-1)">−</button><span id="at">0</span><button onclick="c('at',1)">＋</button></div></div><div class="row"><span>確定CZ</span><div class="counter"><button onclick="c('end',-1)">−</button><span id="end">0</span><button onclick="c('end',1)">＋</button></div></div><div class="row"><span>AT直撃</span><div class="counter"><button onclick="c('direct',-1)">−</button><span id="direct">0</span><button onclick="c('direct',1)">＋</button></div></div></div></section><section class="card"><h2>設定示唆</h2><div class="grid"><div class="row"><span>ワイシャツ（設定2以上）</span><div class="counter"><button onclick="c('s2',-1)">−</button><span id="s2">0</span><button onclick="c('s2',1)">＋</button></div></div><div class="row"><span>お風呂（設定3以上）</span><div class="counter"><button onclick="c('s3',-1)">−</button><span id="s3">0</span><button onclick="c('s3',1)">＋</button></div></div><div class="row"><span>水着（設定4以上）</span><div class="counter"><button onclick="c('s4',-1)">−</button><span id="s4">0</span><button onclick="c('s4',1)">＋</button></div></div><div class="row"><span>パジャマ（設定6濃厚）</span><div class="counter"><button onclick="c('s6',-1)">−</button><span id="s6">0</span><button onclick="c('s6',1)">＋</button></div></div></div></section><section class="action"><button class="judge" onclick="judge()">設定を判別する</button><button class="reset" onclick="location.reload()">リセット</button></section><section id="res" class="card result"><h2>設定予測</h2><div id="pred" class="pred">-</div><div id="graph" class="g"></div><p class="notice">※公開されている設定別確率をもとにした参考値です。設定を保証するものではありません。</p></section><footer>スロット ソードアート・オンラインⅡ 設定判別ツール</footer></main><script>const rates=[{cz:238.4,at:386.2},{cz:232.3,at:364.3},{cz:232.7,at:368.1},{cz:218.9,at:326.8},{cz:225.2,at:340.6},{cz:191.7,at:269.6}];let d={cz:0,at:0,end:0,direct:0,s2:0,s3:0,s4:0,s6:0};function c(k,n){d[k]=Math.max(0,d[k]+n);document.getElementById(k).textContent=d[k]}function judge(){let G=+document.getElementById('g').value||0;if(!G){alert('総ゲーム数を入力してください');return}let a=rates.map(r=>Math.max(.0001,Math.exp(-G/r.cz)*(G/r.cz)**d.cz)*Math.max(.0001,Math.exp(-G/r.at)*(G/r.at)**d.at));let max=Math.max(...a),p=a.map(x=>x/max);let min=1;if(d.s2)min=2;if(d.s3)min=3;if(d.s4)min=4;if(d.s6)min=6;p=p.map((x,i)=>i+1<min?0:x);let sum=p.reduce((x,y)=>x+y,0)||1;p=p.map(x=>x/sum*100);document.getElementById('pred').textContent='最有力：設定'+(p.indexOf(Math.max(...p))+1);document.getElementById('graph').innerHTML=p.map((x,i)=>`<div class="gr"><b>設定${i+1}</b><div class="bg"><div class="bar" style="width:${x.toFixed(1)}%"></div></div><span class="pct">${x.toFixed(1)}%</span></div>`).join('');document.getElementById('res').classList.add('show')}</script></body></html>
