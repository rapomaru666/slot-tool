<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロケロット5BT｜設定判別ツール</title><link rel="stylesheet" href="machine-tool-style.css"></head><body><main class="app"><header class="card header"><h1>スマスロケロット5BT</h1><p>設定判別ツール</p></header><section class="card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0"></label><label>開始ゲーム数<input id="start" type="number" min="0"></label></div><div id="metrics"></div><button id="judge" class="primary">設定判別</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><div id="materials"></div></section></main><script>window.MACHINE_CONFIG={metrics:[{name:'BB以上',rates:[232.4,230.8,229.1,218.5,215.6,204.8]},{name:'RB',rates:[350.46,341.33,324.44,299.25,274.21,239.18]}],materials:[{title:'設定示唆',options:['確認なし','RB寄り','高設定示唆','設定4以上濃厚'],note:'BB以上とRBの公開確率を数値判別の中心に使用します。高設定ほどRBが強く、ボーナス合算も優遇されています。'}]};</script><script src="machine-tool.js"></script></body></html>
