<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マタドールIII 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f5f6f8}.card{background:#fff;padding:18px;margin:12px 0;border-radius:14px}label,.row{display:block;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:10px 0}input,button{padding:10px;border:1px solid #ccc;border-radius:8px}button{font-weight:700}.result{font-weight:700}</style></head><body><div class="card"><h1>マタドールIII</h1><p>設定判別ツール</p></div><div class="card"><label>総ゲーム数 <input id="g" type="number" min="0" value="0"></label><div class="row">BB回数 <input id="b" type="number" min="0" value="0"></div><div class="row">RB回数 <input id="r" type="number" min="0" value="0"></div><div class="row">設定示唆確認数 <input id="s" type="number" min="0" value="0"></div><button onclick="j()">判別する</button> <button onclick="x()">リセット</button><p id="o" class="result">判定結果：入力待ち</p></div><div class="card"><h2>判定材料</h2><p>BB・RB実測値、設定示唆などを入力し、複数要素から総合判断します。</p></div><script>function j(){let g=+document.querySelector('#g').value||0,b=+document.querySelector('#b').value||0,r=+document.querySelector('#r').value||0,s=+document.querySelector('#s').value||0;if(!g){o.textContent='判定結果：総ゲーム数を入力してください';return}o.textContent='判定結果：BB '+(b?('1/'+(g/b).toFixed(1)):'未入力')+' / RB '+(r?('1/'+(g/r).toFixed(1)):'未入力')+'。設定示唆 '+s+'件。';}function x(){document.querySelectorAll('input').forEach(e=>e.value=0);o.textContent='判定結果：入力待ち'}</script></body></html>
