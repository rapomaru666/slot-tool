<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ 秘宝伝｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}button{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.wide{width:100%;margin-top:9px}.dark{background:#222;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid #eee;text-align:center;font-size:14px}p{color:#666;line-height:1.6}</style></head><body><main class="app"><section class="card"><h1>スマスロ 秘宝伝</h1><p>公表されている設定差を使って実績を確認する機種別設定判別ツール。</p></section><section class="card"><h2>入力</h2><div class="grid"><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>初当り回数<input id="a" type="number" min="0"></label><label>チェリー回数<input id="c" type="number" min="0"></label><label>ボーナス中ハズレ回数<input id="h" type="number" min="0"></label></div><button class="wide dark" onclick="judge()">設定を判別する</button><button class="wide" onclick="resetAll()">リセット</button><p id="out">判定結果：</p></section><section class="card"><h2>設定差</h2><table><tr><th>設定</th><th>初当り</th><th>チェリー</th><th>ボーナス中ハズレ</th></tr><tr><td>1</td><td>1/292.5</td><td>1/54.705</td><td>1/40.108</td></tr><tr><td>2</td><td>1/271.4</td><td>1/52.894</td><td>1/37.795</td></tr><tr><td>3</td><td>1/283.6</td><td>1/51.080</td><td>1/35.502</td></tr><tr><td>4</td><td>1/257.5</td><td>1/49.498</td><td>1/33.403</td></tr><tr><td>5</td><td>1/264.0</td><td>1/48.012</td><td>1/31.599</td></tr><tr><td>6</td><td>1/246.0</td><td>1/46.512</td><td>1/29.898</td></tr></table><p>主な判定材料：初当り、通常時チェリー、ボーナス中ハズレ、コパンダトロフィー、高確率関連、140系演出、RB中カード・ボイス、獲得枚数表示。</p></section></main><script>function judge(){let g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0,c=+document.getElementById('c').value||0;if(!g){out.textContent='判定結果：通常時ゲーム数を入力してください。';return}out.textContent='判定結果：初当り '+(a?'1/'+(g/a).toFixed(1):'未入力')+'、チェリー '+(c?'1/'+(g/c).toFixed(1):'未入力')+'。各設定値と比較してください。'}function resetAll(){['g','a','c','h'].forEach(x=>document.getElementById(x).value='');out.textContent='判定結果：'}</script></body></html>
