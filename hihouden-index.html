<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ 秘宝伝｜設定判別ツール</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f4f6;margin:0;color:#111827}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h1{text-align:center;font-size:25px}h2{font-size:20px}.row{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;margin:10px 0}.row input{height:44px;border:1px solid #d1d5db;border-radius:9px;padding:0 10px;font-size:16px}.buttons{display:grid;gap:10px}button{height:50px;border:0;border-radius:10px;font-weight:800;font-size:16px;background:#111827;color:#fff}.reset{background:#e5e7eb;color:#111827}.result{display:none}.result.show{display:block}.bar{height:18px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.g{display:grid;grid-template-columns:50px 1fr 55px;gap:8px;align-items:center;margin:9px 0}.notice{font-size:12px;color:#6b7280;line-height:1.6}@media(max-width:600px){.row{grid-template-columns:1fr 125px}}</style></head><body><main class="app"><h1>スマスロ 秘宝伝</h1><div class="card"><h2>実戦データ</h2><div class="row"><b>総ゲーム数</b><input id="g" type="number" min="1" placeholder="G数"></div><div class="row"><b>ボーナス初当り</b><input id="f" type="number" min="0" placeholder="回数"></div><div class="row"><b>通常時チェリー</b><input id="c" type="number" min="0" placeholder="回数"></div><div class="row"><b>ボーナス中ハズレ</b><input id="h" type="number" min="0" placeholder="回数"></div></div><div class="card"><h2>設定示唆</h2><div class="row"><b>設定4以上濃厚</b><input id="s4" type="number" min="0" value="0"></div><div class="row"><b>設定6濃厚</b><input id="s6" type="number" min="0" value="0"></div></div><div class="buttons"><button onclick="judge()">設定を判別する</button><button class="reset" onclick="location.reload()">リセット</button></div><div id="res" class="card result"><h2>設定予測</h2><h2 id="pred">-</h2><div id="graph"></div><p class="notice">初当り、通常時チェリー、ボーナス中ハズレの公開設定差を用いた参考判定です。設定示唆は入力された条件で下位設定を除外します。設定1〜6の6段階。citeturn0search1turn0search3</p></div></main><script>const n=[1,2,3,4,5,6],first=[292.5,271.4,283.6,257.5,264,246],ch=[54.7,52.9,51.1,49.5,48,46.5],miss=[40.1,37.8,35.5,33.4,31.6,29.9];function ppois(x,lam,k){return Math.exp(-lam)*Math.pow(lam,k)}function judge(){let G=+g.value;if(!G){alert('総ゲーム数を入力してください');return}let F=+f.value||0,C=+c.value||0,H=+h.value||0,S4=+s4.value||0,S6=+s6.value||0;let p=n.map((_,i)=>ppois(0,G/first[i]*F)*ppois(0,G/ch[i]*C)*ppois(0,G/miss[i]*H));p=p.map((x,i)=>x*Math.pow(first[0]/first[i],F)*Math.pow(ch[0]/ch[i],C)*Math.pow(miss[0]/miss[i],H));let min=S6?6:S4?4:1;p=p.map((x,i)=>n[i]<min?0:x);let z=p.reduce((a,b)=>a+b,0)||1;p=p.map(x=>x/z*100);let m=p.indexOf(Math.max(...p));pred.textContent='最有力：設定'+n[m];graph.innerHTML=p.map((x,i)=>`<div class="g"><b>設定${n[i]}</b><div class="bar"><div class="fill" style="width:${x.toFixed(1)}%"></div></div><span>${x.toFixed(1)}%</span></div>`).join('');res.classList.add('show')}</script></body></html>
