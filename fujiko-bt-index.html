<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L 不二子BT｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#222}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{padding:9px 13px;border:0;border-radius:9px;font-weight:700}.wide{width:100%;margin-top:10px}.dark{background:#222;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:center;font-size:13px}p{color:#666;line-height:1.6}</style></head><body><main class="app"><section class="card"><h1>L 不二子BT</h1><p>小役・ボーナス・パチンコジャッジ・カードジャッジ・終了画面などを確認する機種別ツール。</p></section><section class="card"><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>プラムA回数<input id="a" type="number" min="0"></label><label>プラムB回数<input id="b" type="number" min="0"></label><label>チェリー回数<input id="c" type="number" min="0"></label><label>BIG回数<input id="d" type="number" min="0"></label><label>REG回数<input id="e" type="number" min="0"></label><button class="wide dark" onclick="j()">設定を判別する</button><button class="wide" onclick="z()">リセット</button><p id="o">判定結果：</p></section><section class="card"><h2>小役確率</h2><table><tr><th>設定</th><th>プラムA</th><th>プラムB</th><th>チェリー</th></tr><tr><td>1</td><td>1/9.3</td><td>1/25.6</td><td>1/53.1</td></tr><tr><td>2</td><td>1/9.1</td><td>1/25.1</td><td>1/51.8</td></tr><tr><td>4</td><td>1/8.9</td><td>1/24.3</td><td>1/49.3</td></tr><tr><td>5</td><td>1/8.7</td><td>1/24.0</td><td>1/48.2</td></tr><tr><td>6</td><td>1/8.6</td><td>1/23.7</td><td>1/46.7</td></tr></table><p>主な設定示唆：キャラ紹介シナリオ、枚数調整成功ボイス、BIG終了画面のスタンプ、パチンコジャッジ、カードジャッジ。</p></section></main><script>function j(){let g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0,b=+document.getElementById('b').value||0,c=+document.getElementById('c').value||0;if(!g){o.textContent='判定結果：通常時ゲーム数を入力してください。';return}o.textContent='実績：プラムA '+(a?'1/'+(g/a).toFixed(1):'未入力')+'、プラムB '+(b?'1/'+(g/b).toFixed(1):'未入力')+'、チェリー '+(c?'1/'+(g/c).toFixed(1):'未入力')+'。'}function z(){['g','a','b','c','d','e'].forEach(x=>document.getElementById(x).value='');o.textContent='判定結果：'}</script></body></html>
