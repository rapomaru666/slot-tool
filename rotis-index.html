<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ローティス｜設定判別ツール</title><link rel="stylesheet" href="machine-tool-style.css"></head><body><main class="app"><header class="card header"><h1>ローティス</h1><p>設定判別ツール</p></header><section class="card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0"></label><label>開始ゲーム数<input id="start" type="number" min="0"></label></div><div id="metrics"></div><button id="judge" class="primary">設定判別</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><div id="materials"></div></section></main><script>window.MACHINE_CONFIG={settings:[1,2,4,5,6],metrics:[{name:'ボーナス初当り',rates:[287.2,281.2,271.8,264.8,260.3]},{name:'リアルチェリーB',rates:[993,885.6,799.2,728.2,668.7]}],materials:[{title:'ボーナス終了時点滅',options:['通常点滅','高速点滅'],note:'設定3は非搭載。'}]};</script><script src="machine-tool.js"></script></body></html>
