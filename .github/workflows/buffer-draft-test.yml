name: Buffer X Publish Now

on:
  push:
    paths:
      - 'x-auto/publish-now-trigger.txt'
  workflow_dispatch:

jobs:
  buffer-publish-now:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish to X now via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python x-auto/scripts/buffer_publish_now.py
