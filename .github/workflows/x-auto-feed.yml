name: RAPOMARU X Auto Feed

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build RSS feed
        run: python x-auto/scripts/build_feed.py

      - name: Commit feed when changed
        run: |
          if git diff --quiet -- x-auto/feed.xml; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "rapomaru-x-auto"
          git config user.email "actions@users.noreply.github.com"
          git add x-auto/feed.xml
          git commit -m "Update X auto-post feed"
          git push
