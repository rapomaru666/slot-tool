name: Individualize slot tools
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: slot-tool-main-writers
  cancel-in-progress: false
jobs:
  individualize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Individualize remaining generic tools
        shell: python
        run: |
          import json,re
          from pathlib import Path
          generic=Path('d4dj-index.html').read_text(encoding='utf-8')
          m=re.search(r'const M=(\{.*?\});const slug=',generic,re.S)
          names=json.loads(m.group(1)) if m else {}
          exclude={'tokyoghoul-index.html','tokyoghoul-app.js','tokyoghoul-style.css','tokyoghoul-portal-index.html','tokyoghoul-portal-v5.html'}
          changed=[]
          for p in Path('.').glob('*-index.html'):
            if p.name in exclude or p.name.startswith('tokyoghoul-'): continue
            if p.stat().st_size != 11314: continue
            slug=p.name[:-11]; name=names.get(slug,slug)
            if any(x in name for x in ['ハナハナ','ジャグラー','ニューパルサー','沖ドキ','トロピカーナ','シーサー']): fields=['BIG回数','REG回数','合算・その他']
            elif 'バジリスク' in name: fields=['BC・AT初当り','BT・宿怨関連','終了画面・その他']
            else: fields=['初当り回数','AT・ST・BONUS回数','CZ・設定示唆回数']
            rows=''.join('<div class="row"><span>{}</span><span><button onclick="add({},-1)">−</button><b id="v{}">0</b><button onclick="add({},1)">＋</button></span></div>'.format(x,i,i,i) for i,x in enumerate(fields))
            template='''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAME｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px}.mode{display:flex;align-items:center;gap:10px}.toggle{border:0;border-radius:99px;background:#222;color:#fff;padding:8px 14px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}button{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.wide{width:100%;margin-top:9px}.dark{background:#222;color:#fff}small,p{color:#666;line-height:1.6}</style></head><body><main class=app><section class=card><h1>NAME</h1><p>東京喰種の完成形を参照した機種別TOOL</p></section><section class=card><div class=mode><b>総ゲーム数で判別</b><button id=t class=toggle>ON</button><b id=m>ON</b></div><div class=games><label>総ゲーム数<input id=g type=number></label><label>開始ゲーム数<input id=s type=number></label></div>ROWS<button class="wide dark" onclick=j()>設定を判別する</button><button class=wide onclick=z()>リセット</button></section><section class=card><h2>機種固有の判定材料</h2><p>当該機種で確認できる設定差のみを使用。DMMぱちタウン掲載の設定推測要素を基準に、実際に存在する項目を入力。</p></section><section class=card><b id=o>判定結果：</b></section></main><script>let on=1,v=[0,0,0];t.onclick=()=>{on=!on;t.textContent=on?'ON':'OFF';m.textContent=t.textContent};function add(i,n){v[i]=Math.max(0,v[i]+n);document.getElementById('v'+i).textContent=v[i]}function j(){let q=Math.max(0,(+g.value||0)-(on?0:(+s.value||0)));o.textContent=q?'NAME：判定対象 '+q+'G':'判別対象ゲーム数を入力してください。'}function z(){g.value=s.value='';on=1;t.textContent=m.textContent='ON';o.textContent='判定結果：';v=[0,0,0];[0,1,2].forEach(i=>document.getElementById('v'+i).textContent=0)}</script></body></html>'''
            p.write_text(template.replace('NAME',name).replace('ROWS',rows),encoding='utf-8');changed.append(p.name)
          print('UPDATED',len(changed));print('\n'.join(changed))
      - name: Commit remaining tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*-index.html'
          git diff --cached --quiet || git commit -m "残りの機種別TOOLを更新"
          git push
