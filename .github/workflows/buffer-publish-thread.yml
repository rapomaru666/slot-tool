name: Buffer X Publish Thread

on:
  schedule:
    # 19:53 starts early and waits; 20:07/20:17 are idempotent backups.
    - cron: '53 10 * * *'
    - cron: '7 11 * * *'
    - cron: '17 11 * * *'
  push:
    paths:
      - 'x-auto/thread-now-trigger.txt'
      - 'x-auto/publish-target.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-x-daily-publish-v3
  cancel-in-progress: false

jobs:
  buffer-publish-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait until 20:00 JST for scheduled runs
        if: github.event_name == 'schedule'
        run: |
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) 11:00:00 UTC" +%s)
          if [ "$now" -lt "$target" ]; then
            sleep $((target - now))
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r x-auto/requirements.txt

      - name: Run X automation tests
        run: python -m unittest -v tests/test_x_auto.py

      - name: Publish tomorrow's X thread via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python x-auto/scripts/buffer_publish_thread.py

      - name: Save publish history
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- x-auto/published.json x-auto/state/)" ]; then
            echo "No publish history change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-auto/published.json x-auto/state/
          git commit -m "Record X publish history"
          git pull --rebase origin main
          git push
