name: Rena First X Post

on:
  push:
    paths:
      - 'x-auto/rena/first-post-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rena-x-first-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Rena account guard
        run: python -m unittest -v tests/test_rena_channel_guard.py

      - name: Publish Rena first X post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python x-auto/rena/publish_first_post.py
