name: Generate Tomorrow X Thread

on:
  schedule:
    # 18:30 JST = 09:30 UTC. Generate before the 20:00 JST publish workflow.
    - cron: '30 9 * * *'
  push:
    paths:
      - 'x-auto/generate-now-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-auto-daily-generate
  cancel-in-progress: false

jobs:
  generate-tomorrow-thread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r x-auto/requirements.txt

      - name: Run X automation tests
        run: python -m unittest -v tests/test_x_auto.py

      - name: Generate tomorrow thread
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f x-auto/generate-target.txt ]; then
            export TARGET_DATE="$(tr -d '[:space:]' < x-auto/generate-target.txt)"
          fi
          python x-auto/scripts/generate_tomorrow_thread.py

      - name: Save generated thread and audit
        run: |
          if [ -z "$(git status --porcelain -- x-auto/thread-*.json x-auto/audit/)" ]; then
            echo "No generated file change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-auto/thread-*.json x-auto/audit/
          git commit -m "Generate tomorrow X thread"
          git pull --rebase origin main
          git push
