name: Audit INDEX quality
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit INDEX files
        shell: python
        run: |
          from pathlib import Path
          files=[]
          bad=[]
          generic=[]
          for p in Path('.').glob('*-index.html'):
              if p.name.startswith('tokyoghoul-'):
                  continue
              text=p.read_text(encoding='utf-8', errors='replace')
              files.append(p)
              if len(text.strip()) < 500:
                  bad.append((p.name,'too-small'))
              # 判定用テンプレートの未置換プレースホルダーだけを検出する。
              if '<h1>NAME</h1>' in text or '</div>ROWS<button' in text:
                  generic.append(p.name)
          print('INDEX_COUNT',len(files))
          print('TOO_SMALL',len(bad))
          print('UNREPLACED_TEMPLATE_FILES',len(generic))
          for x in bad: print('TOO_SMALL',x)
          for x in sorted(generic): print('UNREPLACED',x)
          if bad or generic:
              raise SystemExit(1)
          print('AUDIT_OK')
