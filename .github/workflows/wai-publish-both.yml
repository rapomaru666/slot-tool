name: WAI X + Threads Publish

on:
  push:
    paths:
      - 'x-auto/wai/post.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wai-x-threads-publish
  cancel-in-progress: false

jobs:
  publish-both:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish same post to X and Threads via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_WAI_API_KEY }}
          WAI_X_NAME: wai_wai_69
          WAI_THREADS_NAME: wai_wai_69
        run: python x-auto/scripts/wai_publish_both.py

      - name: Save publish history
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- x-auto/wai/published.json)" ]; then
            echo "No history change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-auto/wai/published.json
          git commit -m "Record WAI X and Threads publish history"
          git pull --rebase origin main
          git push
