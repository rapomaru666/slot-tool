name: Audit INDEX completeness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all 375 master-list entries
        shell: python
        run: |
          import re
          from pathlib import Path
          from datetime import date

          master = Path('SLOT-TOOL-MASTER-LIST-2026-2021.md').read_text(encoding='utf-8')
          machines=[]
          year=None
          for line in master.splitlines():
              m=re.match(r'## (202[1-5])年', line)
              if m:
                  year=m.group(1); continue
              if year and line.strip() and not line.startswith('#'):
                  # Stop/ignore the explanatory bullet notes after the 2021 machine list.
                  if line.startswith('- '): continue
                  if line.startswith('既存登録分'): continue
                  for raw in line.split(' / '):
                      name=raw.strip()
                      if not name or name=='東京喰種': continue
                      machines.append((year,name))

          assert len(machines)==375, f'Expected 375 master-list entries, parsed {len(machines)}'
          print('YEAR_COUNTS', {y:sum(1 for yy,_ in machines if yy==y) for y in ['2025','2024','2023','2022','2021']})
          print('CHECK_TARGET=375')

          # Build an exact title -> INDEX file map from every INDEX in the repository.
          index_map={}
          for p in Path('.').glob('*-index.html'):
              if p.name.startswith('tokyoghoul-'): continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              titles=[]
              for pat in [r'<h1[^>]*>(.*?)</h1>', r'<title[^>]*>(.*?)</title>']:
                  for x in re.findall(pat,text,re.I|re.S):
                      x=re.sub(r'<[^>]+>','',x).strip()
                      x=re.sub(r'\s+',' ',x)
                      x=re.sub(r'｜設定判別ツール$','',x)
                      titles.append(x)
              for t in titles:
                  if t and t not in index_map: index_map[t]=p.name

          # Fallback to the generic name->slug map.
          generic=Path('d4dj-index.html').read_text(encoding='utf-8',errors='ignore')
          mm=re.search(r'const M=(\{.*?\});const slug=',generic,re.S)
          name_map={}
          if mm:
              import json
              name_map=json.loads(mm.group(1))
          slug_by_name={v:f'{k}-index.html' for k,v in name_map.items()}

          incomplete=[]
          for n,(year,name) in enumerate(machines,1):
              path=index_map.get(name) or slug_by_name.get(name)
              if not path or not Path(path).exists():
                  incomplete.append((year,name,'INDEXなし',''))
              elif '作成中....' in Path(path).read_text(encoding='utf-8',errors='ignore'):
                  incomplete.append((year,name,'作成中',path))

          total=len(incomplete)
          out=['# SLOT-TOOL 未完成LIST（2026〜2021）','',f'更新日：{date.today().isoformat()}','',
               '## 🔴 判定ルール','- マスターLISTの375台を全件突合。','- INDEXあり・完成 → 完成。','- INDEXあり・「作成中....」 → 未完成。','- INDEXなし → 未完成。','- 東京喰種は対象外。','']
          for y in ['2025','2024','2023','2022','2021']:
              items=[x for x in incomplete if x[0]==y]
              out += [f'## {y}年',f'**未完成：{len(items)}件**']
              for i,(_,name,reason,path) in enumerate(items,1):
                  out.append(f'{i}. **{name}** — {reason}' + (f' → `{path}`' if path else ''))
              out.append('')
          out += ['## 375台中の未完成件数',f'**{total}件**','', '確認済み：**375/375台**','']
          Path('SLOT-TOOL-INCOMPLETE-LIST-2026-2021.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(f'CHECKED=375/375')
          print(f'INCOMPLETE={total}')
          for x in incomplete: print('INCOMPLETE_ITEM',x)
      - name: Commit audited list
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SLOT-TOOL-INCOMPLETE-LIST-2026-2021.md
          git diff --cached --quiet || git commit -m "375台のINDEX有無を突合して未完成LISTを確定"
          git push