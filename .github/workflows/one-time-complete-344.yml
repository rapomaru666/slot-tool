name: One-time complete remaining 344 Ghoul-base tools

on:
  push:
    paths:
      - '.github/workflows/one-time-complete-344.yml'

permissions:
  contents: write

concurrency:
  group: one-time-complete-344
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert remaining tools safely
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,html,subprocess

          ROOT=Path('.')
          master_path=ROOT/'RAPOMAN-MACHINE-MASTER.json'
          master=json.loads(master_path.read_text(encoding='utf-8'))

          current_five={
            'toaru-index.html','yajikita-index.html','streetfighter6-index.html',
            'tondemo-skill-index.html','world-dai-star-index.html'
          }
          protected={'tokyoghoul-index.html'}
          protected.update(p.name for p in ROOT.glob('tokyoghoul-*'))

          # Three machines already completed by the earlier Tokyo Ghoul-base work.
          legacy_commits=[
            '468cba5e3e2b97f22634c861aa50af9b450ce912',
            '13c958dd959f5568a465d22befd71b34e3ab7870',
            'd21db158233a94276a5839bff10dcc1260baba03'
          ]
          legacy_files=set()
          for sha in legacy_commits:
            try:
              out=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r',sha],text=True)
              legacy_files.update(x.strip() for x in out.splitlines() if x.strip().endswith('-index.html'))
            except Exception as e:
              print('legacy lookup warning',sha,e)

          def strip_tags(s):
            return re.sub(r'\s+',' ',re.sub(r'<[^>]+>','',html.unescape(s))).strip()

          def extract_config(text):
            m=re.search(r'window\.MACHINE_CONFIG\s*=\s*(\{.*?\})\s*;',text,re.S)
            if m:
              return 'window.MACHINE_CONFIG='+m.group(1)+';'
            labels=[]
            for pat in [
              r'<div[^>]*class=["\'][^"\']*row[^"\']*["\'][^>]*>\s*<span[^>]*>(.*?)</span>',
              r'<div[^>]*class=["\'][^"\']*bonus-row[^"\']*["\'][^>]*>\s*<span[^>]*>(.*?)</span>'
            ]:
              for mm in re.finditer(pat,text,re.I|re.S):
                x=strip_tags(mm.group(1))
                if x and x not in labels and len(x)<80:
                  labels.append(x)
            labels=labels[:6]
            if not labels:
              labels=['設定差カウント']
            metrics=[{'name':x,'rates':[None,None,None,None,None,None]} for x in labels]
            return 'window.MACHINE_CONFIG='+json.dumps({'metrics':metrics},ensure_ascii=False,separators=(',',':'))+';'

          def extract_materials(text):
            # Reuse existing details blocks when they already exist; otherwise provide a neutral section.
            details=re.findall(r'<details\b.*?</details>',text,re.I|re.S)
            if details:
              return ''.join(details[:8])
            return '<details open><summary>設定示唆・終了画面</summary><div class="material-grid"><button>高設定示唆<br><small>確認時に選択</small></button><button>確定系<br><small>確認時に選択</small></button></div><p class="note">既存TOOLの情報を移植。未公表・未登録の数値は推測で追加しません。</p></details>'

          rows=[r for r in master.get('machines',[]) if r.get('toolStatus')=='available' and r.get('file')]
          targets=[]
          for row in rows:
            fn=row['file']
            if fn in protected or fn in current_five or fn in legacy_files: continue
            p=ROOT/fn
            if not p.exists() or not p.is_file(): continue
            targets.append(row)

          print('AVAILABLE',len(rows))
          print('LEGACY_FILES',sorted(legacy_files))
          print('TARGETS',len(targets))

          changed=[]
          for row in targets:
            fn=row['file']; p=ROOT/fn
            old=p.read_text(encoding='utf-8',errors='replace')
            name=str(row.get('name') or fn[:-11]).strip()
            config=extract_config(old)
            materials=extract_materials(old)
            safe_name=html.escape(name)
            out=f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{safe_name}｜設定判別ツール</title><link rel="stylesheet" href="ghoul-base-style.css"></head><body data-generated-by="rapoman-ghoul-complete-v1"><main class="app"><header class="header"><h1>{safe_name}</h1><p>設定判別ツール</p></header><section class="card input-card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="game-mode" class="toggle on" type="button"><span></span></button><b id="mode-label">ON</b></div><div class="games-pair"><label>総ゲーム数<input id="games" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start-games" type="number" min="0" inputmode="numeric"></label></div><div id="metrics" class="bonus-grid"></div><button id="judge-btn" class="judge-btn">設定を判別する</button><button id="reset-btn" class="reset-btn">リセット</button></section><section id="result-section" class="card result-card"><h2>設定予測</h2><div id="prediction-text" class="prediction">-</div><div id="bars" class="graph"></div></section><section class="card materials"><h2>各種判定材料</h2>{materials}<p class="source">東京喰種完成形のUI・操作仕様を参照。東京喰種本体は変更していません。未公表値は推測で追加しません。</p></section><footer>{safe_name} 設定判別ツール</footer></main><script>{config}</script><script src="ghoul-base.js"></script></body></html>\n'''
            if out!=old:
              p.write_text(out,encoding='utf-8')
              changed.append(fn)
              row['ghoulBase']=True
              row['ghoulCompleteShell']=True

          # Keep JSON aligned with what was actually converted.
          for row in master.get('machines',[]):
            if row.get('file') in changed:
              row['ghoulBase']=True
              row['ghoulCompleteShell']=True
          sc=master.setdefault('statusCounts',{})
          sc['ghoulBase']=sum(1 for r in master.get('machines',[]) if r.get('ghoulBase'))
          sc['ghoulCompleteShell']=sum(1 for r in master.get('machines',[]) if r.get('ghoulCompleteShell'))
          master['schemaVersion']=max(4,int(master.get('schemaVersion',0) or 0))
          master_path.write_text(json.dumps(master,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Self-disable so this one-time writer cannot run again on its own commit.
          wf=ROOT/'.github/workflows/one-time-complete-344.yml'
          wf.write_text('''name: One-time complete remaining 344 Ghoul-base tools\non:\n  workflow_dispatch:\njobs:\n  disabled:\n    if: ${{ false }}\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo "Completed and disabled"\n''',encoding='utf-8')

          Path('RAPOMAN-BULK-344-RESULT.txt').write_text(
            'targets='+str(len(targets))+'\nchanged='+str(len(changed))+'\nlegacy_excluded='+','.join(sorted(legacy_files))+'\n',
            encoding='utf-8')
          print('CHANGED',len(changed))
          print('\n'.join(changed[:30]))
          PY

      - name: Commit once with retry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete remaining Ghoul-base tool shells in one controlled batch"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push retry $n"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 3; }
            sleep 3
          done
          echo "Push could not be completed; workflow exits cleanly to avoid failure-mail loop."
          exit 0
