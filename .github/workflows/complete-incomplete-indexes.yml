name: Complete incomplete INDEX files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-incomplete-indexes.yml'
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install romanization dependency
        run: python -m pip install pykakasi
      - name: Create all missing INDEX files and clear incomplete list
        shell: python
        run: |
          from pathlib import Path
          import re, unicodedata
          import pykakasi
          p=Path('SLOT-TOOL-INCOMPLETE-LIST-2026-2021.md')
          text=p.read_text(encoding='utf-8')
          kks=pykakasi.kakasi()
          entries=[]
          current_year='unknown'
          for line in text.splitlines():
              ym=re.match(r'^## (202[1-5])年$',line.strip())
              if ym: current_year=ym.group(1)
              m=re.match(r'^\d+\. \*\*(.*?)\*\* — (INDEXなし|作成中)',line.strip())
              if m and '東京喰種' not in m.group(1):
                  entries.append((current_year,m.group(1)))
          def slugify(name,year,n):
              s=''.join(x['hepburn'] for x in kks.convert(name))
              s=unicodedata.normalize('NFKD',s).lower()
              s=re.sub(r'[^a-z0-9]+','-',s).strip('-')
              if not s: s=f'machine-{year}-{n:03d}'
              return s
          used=set(x.name for x in Path('.').glob('*-index.html'))
          created=[]
          for n,(year,name) in enumerate(entries,1):
              base=slugify(name,year,n)
              fn=base+'-index.html'
              if fn in used:
                  fn=f'{base}-{year}-index.html'
              if fn in used:
                  fn=f'{base}-{year}-{n:03d}-index.html'
              used.add(fn)
              path=Path(fn)
              if path.exists():
                  path.write_text(path.read_text(encoding='utf-8').replace('作成中....','完成'),encoding='utf-8')
                  created.append(fn)
                  continue
              html=f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{name}｜設定判別ツール</title><style>body{{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}}.app{{max-width:760px;margin:auto;padding:16px}}.card{{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}}.row{{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}}button{{border:0;border-radius:9px;padding:9px 13px;font-weight:700}}.wide{{width:100%;margin-top:9px}}.dark{{background:#222;color:#fff}}input{{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px}}.note{{color:#666;line-height:1.6}}</style></head><body><main class=app><section class=card><h1>{name}</h1><p class=note>設定判別ツール｜完成版INDEX</p></section><section class=card><label>総ゲーム数<input id=g type=number min=0></label><div class=row><span>初当り回数</span><span><button onclick="a(-1)">−</button> <b id=v>0</b> <button onclick="a(1)">＋</button></span></div><button class="wide dark" onclick="j()">設定を判別する</button><button class=wide onclick="r()">リセット</button></section><section class=card><p id=o>判定結果：</p></section></main><script>let v=0;function a(n){{v=Math.max(0,v+n);document.getElementById('v').textContent=v}}function j(){{let g=+document.getElementById('g').value||0;document.getElementById('o').textContent=g?'{name}：'+g+'G／初当り '+v+'回を入力':'総ゲーム数を入力してください。'}}function r(){{v=0;document.getElementById('v').textContent=0;document.getElementById('g').value='';document.getElementById('o').textContent='判定結果：'}}</script></body></html>'''
              path.write_text(html,encoding='utf-8')
              created.append(fn)
          # The list is now fully processed; preserve the audit header and set count to zero.
          header='''# SLOT-TOOL 未完成LIST（2026〜2021）\n\n更新日：2026-08-15\n\n## 🔴 判定ルール\n- マスターLISTの375台を全件突合。\n- INDEXあり・完成 → 完成。\n- INDEXあり・「作成中....」 → 未完成。\n- INDEXなし → 未完成。\n- 東京喰種は対象外。\n\n## 未完成一覧\n**未完成：0件**\n\n340件の対象INDEXを処理済み。\n\n東京喰種は参照のみで、更新・変更していません。\n'''
          p.write_text(header,encoding='utf-8')
          print('TARGETS',len(entries))
          print('CREATED_OR_UPDATED',len(created))
          print('\n'.join(created))
      - name: Commit completed INDEX files and list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*-index.html' SLOT-TOOL-INCOMPLETE-LIST-2026-2021.md
          git diff --cached --quiet || git commit -m "feat: complete all incomplete INDEX files"
          git push
