<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>押忍！番長4｜設定判別</title><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}button{padding:9px 13px;border:0;border-radius:8px;font-weight:700}.row{padding:9px 0;border-bottom:1px solid #eee}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:center}</style></head><body><main><h1>押忍！番長4｜設定判別</h1><section><h2>初当り合成</h2><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>初当り回数（ボーナス+AT直撃）<input id="a" type="number" min="0"></label><button onclick="j()">判別する</button> <button onclick="z()">リセット</button><pre id="r">判定結果：</pre></section><section><h2>主要設定差</h2><table><tr><th>設定</th><th>初当り</th><th>共通ベル</th><th>AT直撃</th></tr><tr><td>1</td><td>1/259.5</td><td>1/21.8</td><td>1/6411</td></tr><tr><td>2</td><td>1/256.3</td><td>1/21.6</td><td>1/5624</td></tr><tr><td>3</td><td>1/247.6</td><td>1/21.4</td><td>1/4344</td></tr><tr><td>4</td><td>1/236.0</td><td>1/21.2</td><td>1/3053</td></tr><tr><td>5</td><td>—</td><td>—</td><td>—</td></tr><tr><td>6</td><td>1/221.1</td><td>1/20.6</td><td>1/2150</td></tr></table></section><section><h2>設定示唆</h2><div class="row">終了画面：ハンバーグ＝偶数示唆／サファリ＝高設定示唆弱／ショッピング＝高設定示唆強</div><div class="row">富士山＝設定2以上。出現回数に応じて示唆設定が上昇（1回2以上～5回以上6濃厚）</div><div class="row">茶摘み・レースクイーン・温泉＝設定4以上濃厚</div><div class="row">AT中REGのF.K.＝設定6濃厚</div></section></main><script>function j(){let g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0;if(!g||!a){r.textContent='判定結果：ゲーム数と初当り回数を入力してください。';return}let x=g/a,v=[259.5,256.3,247.6,236,228,221.1],b=1,e=1e9;v.forEach((n,i)=>{let d=Math.abs(x-n);if(d<e){e=d;b=i+1}});r.textContent=`判定結果：実績1/${x.toFixed(1)}。単純近似では設定${b}付近（参考値）。確定・濃厚示唆を優先してください。`}function z(){g.value=a.value='';r.textContent='判定結果：'}</script></body></html>
