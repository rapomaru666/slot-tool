<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻雀格闘倶楽部 真｜設定判別</title><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}button{padding:9px 13px;border:0;border-radius:8px;font-weight:700}.row{padding:9px 0;border-bottom:1px solid #eee}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:center}</style></head><body><main><h1>麻雀格闘倶楽部 真｜設定判別</h1><section><h2>初当り・特殊1枚役</h2><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>ボーナス+AT初当り回数<input id="a" type="number" min="0"></label><button onclick="j()">判別する</button> <button onclick="z()">リセット</button><pre id="r">判定結果：</pre></section><section><h2>設定差</h2><table><tr><th>設定</th><th>初当り</th><th>特殊1枚役</th></tr><tr><td>1</td><td>1/329.3</td><td>1/936.2</td></tr><tr><td>2</td><td>1/319.5</td><td>1/819.2</td></tr><tr><td>3</td><td>1/310.3</td><td>1/728.2</td></tr><tr><td>4</td><td>1/290.0</td><td>1/655.4</td></tr><tr><td>5</td><td>1/268.7</td><td>1/595.8</td></tr><tr><td>6</td><td>1/245.5</td><td>1/546.1</td></tr></table></section><section><h2>設定示唆</h2><div class="row">格闘倶楽部BONUS終了：オレンジマン＝偶数設定濃厚／オレンジマン＋修行僧＝設定3・5・6濃厚</div><div class="row">点数結果：実写オレンジマンうつむき＝設定4・6／正座＝設定5・6／寝転がる＝設定6</div><div class="row">四神闘技場終了画面のコナミコマンドでも設定示唆あり</div><div class="row">対局局数：1・3局＝奇数示唆／2・4局＝偶数示唆</div></section></main><script>function j(){let g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0;if(!g||!a){r.textContent='判定結果：ゲーム数と初当り回数を入力してください。';return}let x=g/a,v=[329.3,319.5,310.3,290,268.7,245.5],b=1,e=1e9;v.forEach((n,i)=>{let d=Math.abs(x-n);if(d<e){e=d;b=i+1}});r.textContent=`判定結果：実績1/${x.toFixed(1)}。単純近似では設定${b}付近（参考値）。特殊1枚役・終了画面を優先して総合判定してください。`}function z(){g.value=a.value='';r.textContent='判定結果：'}</script></body></html>
