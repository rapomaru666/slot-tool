<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桃太郎電鉄 ～パチスロも定番！～｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui,sans-serif;color:#222}.app{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.mode{display:flex;gap:10px;align-items:center}.toggle{width:48px;height:28px;border:0;border-radius:99px;background:#bbb;padding:3px}.toggle.on{background:#222}.toggle span{display:block;width:22px;height:22px;background:#fff;border-radius:50%}.toggle.on span{transform:translateX(20px)}input{padding:9px;width:100%;box-sizing:border-box}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.primary,.secondary{width:100%;padding:12px;margin-top:10px}.primary{background:#222;color:#fff}.result{display:none}.result.show{display:block}.note{color:#666;line-height:1.7;font-size:.9rem}</style></head><body><main class="app"><section class="card"><h1>桃太郎電鉄 ～パチスロも定番！～ 設定判別ツール</h1><p class="note">東京喰種の完成形を参照。東京喰種は変更していません。</p><div class="mode"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><p>総ゲーム数<input id="games" type="number" min="0"></p><p>開始ゲーム数<input id="start" type="number" min="0"></p><div class="row"><span>AT初当り</span><span><button onclick="chg(0,-1)">−</button><b id="a0">0</b><button onclick="chg(0,1)">＋</button></span></div><div class="row"><span>目的地到着AT</span><span><button onclick="chg(1,-1)">−</button><b id="a1">0</b><button onclick="chg(1,1)">＋</button></span></div><div class="row"><span>上位AT突入</span><span><button onclick="chg(2,-1)">−</button><b id="a2">0</b><button onclick="chg(2,1)">＋</button></span></div><button class="primary" onclick="judge()">設定を判別する</button><button class="secondary" onclick="location.reload()">リセット</button></section><section id="result" class="card"><h2>設定予測</h2><div id="pred"></div></section><section class="card"><h2>機種別判定材料</h2><p class="note">DMM掲載：ATタイプ（擬似ボーナス搭載）。純増約2.5枚/G、上位AT中約4.0枚/G。通常時は目的地到着でAT当選。AT中はボーナスを抽選し、上位AT「黄金列車ボーナス」を搭載。</p><p class="note">機械割97.9%～111.2%、導入開始日2024年12月2日。AT初当り・目的地到着・上位ATなどの設定推測情報をDMM掲載の最新解析と照合して使用。</p></section></main><script>let v=[0,0,0],total=true;toggle.onclick=()=>{total=!total;toggle.classList.toggle('on',total);mode.textContent=total?'ON':'OFF'};function chg(i,n){v[i]=Math.max(0,v[i]+n);document.getElementById('a'+i).textContent=v[i]}function judge(){let g=(+games.value||0)-(total?0:(+start.value||0));if(g<=0)return alert('判別対象ゲーム数を入力してください');pred.innerHTML='<b>入力：'+g+'G／AT '+v[0]+'回／目的地AT '+v[1]+'回／上位AT '+v[2]+'回</b><p class="note">設定差の数値・示唆演出はDMM掲載の最新解析と照合してください。</p>';result.classList.add('show')}</script></body></html>
