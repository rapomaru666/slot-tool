<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L戦国乙女5 業火を穿つ宿焔の双刃｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d;margin-bottom:14px}.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.counter{display:flex;align-items:center;gap:10px}.counter button,.primary,.secondary{border:0;border-radius:9px;padding:10px 16px;font-weight:700}.counter button{background:#eee;font-size:1.2rem}.counter b{min-width:28px;text-align:center}.primary,.secondary{width:100%;margin-top:10px}.primary{background:#222;color:#fff}.secondary{background:#eee}.result{display:none}.result.show{display:block}.barrow{display:grid;grid-template-columns:55px 1fr 48px;gap:8px;align-items:center;margin:9px 0}.bg{height:12px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:#222}.pred{font-size:1.15rem;font-weight:700}.material{border-top:1px solid #eee;padding:12px 0}.material summary{font-weight:700}.note{font-size:.82rem;color:#666;line-height:1.6}@media(max-width:520px){.games{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="card"><h1>L戦国乙女5 業火を穿つ宿焔の双刃</h1><p>設定判別ツール</p></header><section class="card"><div class="games"><label>総ゲーム数<input id="g" type="number" min="0"></label><label>開始ゲーム数<input id="st" type="number" min="0"></label></div><div class="row"><span>AT初当り</span><div class="counter"><button onclick="add('a',-1)">−</button><b id="a">0</b><button onclick="add('a',1)">＋</button></div></div><div class="row"><span>戦国乙女BONUS直撃</span><div class="counter"><button onclick="add('b',-1)">−</button><b id="b">0</b><button onclick="add('b',1)">＋</button></div></div><button class="primary" onclick="judge()">設定判別</button><button class="secondary" onclick="resetAll()">リセット</button></section><section id="res" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card"><h2>各種判定材料</h2><details class="material"><summary>ボーナス終了画面</summary><p class="note">可＝設定2以上、吉＝設定3以上、良＝設定4以上、優＝設定5以上、極＝設定6の示唆として扱います。</p></details><details class="material"><summary>AT終了時の獲得枚数表示</summary><p class="note">222/333/444/555/666系の特定枚数表示は対応する設定示唆として補助材料にします。</p></details><details class="material"><summary>乙女アタック・巫女ポイント</summary><p class="note">巫女ポイント0pt到達時の乙女アタック当選率など、公開設定差を補助材料として確認します。</p></details></section></main><script>const ar=[359.5,350.8,332.5,302.8,281,262.9],br=[21206.7,15648.9,13143.5,8143.4,6427.6,5502.7];let d={a:0,b:0};function add(k,n){d[k]=Math.max(0,d[k]+n);document.getElementById(k).textContent=d[k]}function judge(){const G=Math.max(0,(+g.value||0)-(+st.value||0));if(!G)return alert('判別対象ゲーム数を入力してください。');const x=ar.map((r,i)=>d.a*Math.log(G/r)-G/r+d.b*Math.log(G/br[i])-G/br[i]),m=Math.max(...x),w=x.map(v=>Math.exp(v-m)),t=w.reduce((a,b)=>a+b,0),p=w.map(v=>v/t*100),best=p.indexOf(Math.max(...p))+1;pred.textContent='推定設定：設定'+best+'（'+G+'G）';bars.innerHTML=p.map((v,i)=>`<div class="barrow"><span>設定${i+1}</span><div class="bg"><div class="bar" style="width:${v.toFixed(1)}%"></div></div><b>${v.toFixed(1)}%</b></div>`).join('');res.classList.add('show')}function resetAll(){d={a:0,b:0};a.textContent=b.textContent='0';g.value=st.value='';res.classList.remove('show')}</script></body></html>
