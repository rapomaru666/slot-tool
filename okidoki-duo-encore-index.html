<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ 沖ドキ！DUO アンコール｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#222}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{padding:9px 13px;border:0;border-radius:9px;font-weight:700}.wide{width:100%;margin-top:10px}.dark{background:#222;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:center;font-size:13px}p{color:#666;line-height:1.6}</style></head><body><main class="app"><section class="card"><h1>スマスロ 沖ドキ！DUO アンコール</h1><p>チャンス役・ボーナス初当り・モード別抽選などの設定差を確認する機種別ツール。</p></section><section class="card"><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>ボーナス初当り回数<input id="b" type="number" min="0"></label><label>チェリー回数<input id="c" type="number" min="0"></label><label>通常A/B中チェリー当選回数<input id="d" type="number" min="0"></label><button class="wide dark" onclick="j()">設定を判別する</button><button class="wide" onclick="z()">リセット</button><p id="o">判定結果：</p></section><section class="card"><h2>設定差</h2><table><tr><th>設定</th><th>チェリー</th><th>通常A/Bチェリー当選</th></tr><tr><td>1</td><td>1/46.8</td><td>1.1%</td></tr><tr><td>2</td><td>1/45.0</td><td>1.2%</td></tr><tr><td>3</td><td>1/43.3</td><td>1.4%</td></tr><tr><td>5</td><td>1/41.7</td><td>1.6%</td></tr><tr><td>6</td><td>1/40.3</td><td>1.7%</td></tr></table><p>設定示唆：ボーナステンパイ音、ボーナス中BGM変化、私バージョンアップ！発生時の示唆など。</p></section></main><script>function j(){let g=+document.getElementById('g').value||0,b=+document.getElementById('b').value||0,c=+document.getElementById('c').value||0;if(!g){o.textContent='判定結果：通常時ゲーム数を入力してください。';return}o.textContent='実績：ボーナス初当り '+(b?'1/'+(g/b).toFixed(1):'未入力')+'、チェリー '+(c?'1/'+(g/c).toFixed(1):'未入力')+'。モード別の当選率と設定示唆も合わせて確認してください。'}function z(){['g','b','c','d'].forEach(x=>document.getElementById(x).value='');o.textContent='判定結果：'}</script></body></html>
