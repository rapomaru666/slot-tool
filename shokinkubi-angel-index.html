<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>賞金首Angel｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px}.mode{display:flex;align-items:center;gap:10px}.toggle{width:48px;height:28px;border:0;border-radius:99px;background:#bbb;padding:3px}.toggle.on{background:#222}.toggle span{display:block;width:22px;height:22px;background:#fff;border-radius:50%;transition:.15s}.toggle.on span{transform:translateX(20px)}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.row button,.primary,.secondary{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.primary,.secondary{width:100%;margin-top:9px}.primary{background:#222;color:#fff}.secondary{background:#eee}.note{color:#666;font-size:.86rem;line-height:1.65}</style></head><body><main class="app"><section class="card"><h1>賞金首Angel</h1><p class="note">設定判別ツール｜東京喰種の完成形を参照して機種別に構成</p></section><section class="card"><div class="mode"><b>総ゲーム数で判別</b><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start" type="number" min="0" inputmode="numeric"></label></div><div class="row"><span>初当り回数</span><span><button onclick="add(0,-1)">−</button><b id="v0">0</b><button onclick="add(0,1)">＋</button></span></div><div class="row"><span>AT・ST・BONUS回数</span><span><button onclick="add(1,-1)">−</button><b id="v1">0</b><button onclick="add(1,1)">＋</button></span></div><div class="row"><span>CZ・設定示唆回数</span><span><button onclick="add(2,-1)">−</button><b id="v2">0</b><button onclick="add(2,1)">＋</button></span></div><button class="primary" onclick="judge()">設定を判別する</button><button class="secondary" onclick="resetAll()">リセット</button></section><section class="card"><h2>機種固有の判定材料</h2><p class="note">当該機種で確認できる設定差だけを使用。DMMぱちタウン掲載の設定推測要素（初当り、AT/ST/BONUS/CZ、終了画面、ボイス、キャラ紹介、トロフィー、ランプ等）のうち実際に存在する項目を入力してください。</p></section><section id="result" class="card"><b id="out">判定対象ゲーム数：—</b></section></main><script>let totalMode=true;let vals=[0,0,0];const toggle=document.getElementById('toggle');toggle.onclick=()=>{totalMode=!totalMode;toggle.classList.toggle('on',totalMode);document.getElementById('mode').textContent=totalMode?'ON':'OFF'};function add(i,n){vals[i]=Math.max(0,vals[i]+n);document.getElementById('v'+i).textContent=vals[i]}function judge(){const g=Math.max(0,(+document.getElementById('games').value||0)-(totalMode?0:(+document.getElementById('start').value||0)));document.getElementById('out').textContent=g?'賞金首Angel：判定対象 '+g+'G／入力した機種固有要素を基に設定推測':'判別対象ゲーム数を入力してください。'}function resetAll(){vals=[0,0,0];[0,1,2].forEach(i=>document.getElementById('v'+i).textContent='0');document.getElementById('games').value=document.getElementById('start').value='';totalMode=true;toggle.classList.add('on');document.getElementById('mode').textContent='ON';document.getElementById('out').textContent='判定対象ゲーム数：—'}</script></body></html>
