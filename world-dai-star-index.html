<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スロット ワールドダイスター｜設定判別ツール</title><link rel="stylesheet" href="ghoul-base-style.css"></head><body><main class="app"><header class="header"><h1>スロット ワールドダイスター 設定判別ツール</h1></header><section class="card input-card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="game-mode" class="toggle on" type="button"><span></span></button><b id="mode-label">ON</b></div><div class="games-pair"><label>総ゲーム数<input id="games" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start-games" type="number" min="0" inputmode="numeric"></label></div><div id="metrics" class="bonus-grid"></div><button id="judge-btn" class="judge-btn">設定を判別する</button><button id="reset-btn" class="reset-btn">リセット</button></section><section id="result-section" class="card result-card"><h2>設定予測</h2><div id="prediction-text" class="prediction">-</div><div id="bars" class="graph"></div></section><section class="card materials"><h2>各種判定材料</h2><details open><summary>設定示唆・終了画面</summary><div class="material-grid"><button>高設定示唆<br><small>確認時に選択</small></button><button>確定系<br><small>確認時に選択</small></button></div><p class="note">AT初当りを主軸、CZ初当りを補助指標として判別します。</p></details><p class="source">参照：DMMぱちタウン機種情報。未公表値は推測で追加しません。</p></section><footer>スロット ワールドダイスター 設定判別ツール</footer></main><script>window.MACHINE_CONFIG={metrics:[{name:'AT初当り',rates:[306.5,297.1,284.1,262.1,257.1,246.6]},{name:'CZ初当り',rates:[180.6,173.8,168.3,164.9,163,156]}]};</script><script src="ghoul-base.js"></script></body></html>
