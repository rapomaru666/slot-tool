<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スカイラブ｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}button{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.wide{width:100%;margin-top:9px}.dark{background:#222;color:#fff}small,p{color:#666;line-height:1.6}</style></head><body><main class="app"><section class="card"><h1>スカイラブ</h1><p>機種固有の設定差を入力して設定推測を行う機種別ツール。</p></section><section class="card"><div><b>総ゲーム数</b><input id="g" type="number" min="0"></div><div class="row"><span>初当り回数</span><span><button onclick="add(0,-1)">−</button><b id="v0">0</b><button onclick="add(0,1)">＋</button></span></div><div class="row"><span>AT・ST・BONUS回数</span><span><button onclick="add(1,-1)">−</button><b id="v1">0</b><button onclick="add(1,1)">＋</button></span></div><div class="row"><span>CZ・終了画面・設定示唆</span><span><button onclick="add(2,-1)">−</button><b id="v2">0</b><button onclick="add(2,1)">＋</button></span></div><button class="wide dark" onclick="judge()">設定を判別する</button><button class="wide" onclick="resetAll()">リセット</button></section><section class="card"><h2>各種判定材料</h2><p>本機の初当り・ボーナス・AT/ST・CZ・終了画面・設定示唆など、実機で確認できる設定差を入力するための項目です。未確認の数値や示唆を推測で追加しません。</p></section><section class="card"><b id="out">判定結果：ゲーム数を入力してください。</b></section></main><script>let v=[0,0,0];function add(i,n){v[i]=Math.max(0,v[i]+n);document.getElementById('v'+i).textContent=v[i]}function judge(){const g=Number(document.getElementById('g').value||0);document.getElementById('out').textContent=g?'スカイラブ：'+g+'Gを対象に入力項目を確認':'ゲーム数を入力してください。'}function resetAll(){v=[0,0,0];document.getElementById('g').value='';document.getElementById('v0').textContent=0;document.getElementById('v1').textContent=0;document.getElementById('v2').textContent=0;document.getElementById('out').textContent='判定結果：ゲーム数を入力してください。'}</script></body></html>
