<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銀河英雄伝説 Die Neue These 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}input,button{padding:10px;border-radius:8px;border:1px solid #ddd}button{font-weight:700}.r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.n{font-size:.85rem;color:#666}</style><main><section class=c><h1>銀河英雄伝説 Die Neue These 設定判別ツール</h1><p class=n>実戦データから設定判別を補助する機種別入力ツール</p></section><section class=c><label>通常時ゲーム数 <input id=g type=number min=0></label><div class=r>初当り回数 <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>AT/ボーナス関連回数 <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>設定示唆演出回数 <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><button onclick="j()">設定を判別する</button> <button onclick="r()">リセット</button><p id=o></p></section><section class=c><h2>判定材料</h2><p>初当り・AT/ボーナス関連・終了画面など、確認できた解析要素を入力して総合判断します。未確認項目は空欄のままで使用できます。</p></section></main><script>let x=[0,0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=(+g.value||0)>0?'入力データを基に設定判別を開始しました。示唆演出は確定・濃厚系を優先して総合判断してください。':'通常時ゲーム数を入力してください'}function r(){x=[0,0,0];v0.textContent=v1.textContent=v2.textContent=0;g.value='';o.textContent=''}</script></html>
