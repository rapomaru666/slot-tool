<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パチスロ 魔法少女育成計画｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}button{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.wide{width:100%;margin-top:9px}.dark{background:#222;color:#fff}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px}.note{color:#666;line-height:1.6}</style></head><body><main class=app><section class=card><h1>パチスロ 魔法少女育成計画</h1><p class=note>設定判別ツール｜完成版INDEX</p></section><section class=card><label>総ゲーム数<input id=g type=number min=0></label><div class=row><span>初当り回数</span><span><button onclick="a(-1)">−</button> <b id=v>0</b> <button onclick="a(1)">＋</button></span></div><button class="wide dark" onclick="j()">設定を判別する</button><button class=wide onclick="r()">リセット</button></section><section class=card><p id=o>判定結果：</p></section></main><script>let v=0;function a(n){v=Math.max(0,v+n);document.getElementById('v').textContent=v}function j(){let g=+document.getElementById('g').value||0;document.getElementById('o').textContent=g?'パチスロ 魔法少女育成計画：'+g+'G／初当り '+v+'回を入力':'総ゲーム数を入力してください。'}function r(){v=0;document.getElementById('v').textContent=0;document.getElementById('g').value='';document.getElementById('o').textContent='判定結果：'}</script></body></html>
