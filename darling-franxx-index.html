<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L ダーリン・イン・ザ・フランキス 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f5f6f8}.card{background:#fff;padding:18px;margin:12px 0;border-radius:14px}label{display:block;margin:12px 0}input,select,button{padding:10px;border:1px solid #ccc;border-radius:8px}button{font-weight:700}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.result{font-size:1.15rem;font-weight:700}</style></head><body><div class="card"><h1>L ダーリン・イン・ザ・フランキス</h1><p>設定判別ツール</p></div><div class="card"><label>総ゲーム数 <input id="g" type="number" min="0" value="0"></label><div class="row">初当り回数 <input id="a" type="number" min="0" value="0"></div><div class="row">CZ回数 <input id="c" type="number" min="0" value="0"></div><div class="row">設定示唆・終了画面の確認数 <input id="s" type="number" min="0" value="0"></div><button onclick="judge()">判別する</button> <button onclick="resetAll()">リセット</button><p id="r" class="result">判定結果：入力待ち</p></div><div class="card"><h2>判定材料</h2><p>初当り、CZ、終了画面・設定示唆など、確認できた実戦データを総合判断するための入力欄です。</p><p>※数値が未入力の項目は判定材料として扱いません。</p></div><script>function judge(){const g=+document.querySelector('#g').value||0,a=+document.querySelector('#a').value||0,c=+document.querySelector('#c').value||0,s=+document.querySelector('#s').value||0;if(!g){r.textContent='判定結果：総ゲーム数を入力してください';return}const rate=a?g/a:null;let t='判定結果：';if(s>0)t+='設定示唆を確認済み。';if(rate)t+=' 初当り実測値 1/'+rate.toFixed(1)+'。';t+=' 複数要素を総合して判断してください。';r.textContent=t}function resetAll(){document.querySelectorAll('input').forEach(x=>x.value=0);r.textContent='判定結果：入力待ち'}</script></body></html>
