<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L 少女☆歌劇 レヴュースタァライト 設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}.toggle{width:48px;height:28px;border:0;border-radius:99px;background:#bbb;padding:3px}.toggle.on{background:#222}.toggle span{display:block;width:22px;height:22px;background:#fff;border-radius:50%}.toggle.on span{transform:translateX(20px)}.mode{display:flex;gap:10px;align-items:center}.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games input{width:100%;box-sizing:border-box;padding:10px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.counter{display:flex;gap:10px;align-items:center}.counter button,.primary,.secondary{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary,.secondary{width:100%;margin-top:10px}.primary{background:#222;color:#fff}.result{display:none}.bar{height:12px;background:#222}.br{display:grid;grid-template-columns:55px 1fr 55px;gap:8px;margin:9px 0}.bg{background:#eee}.note{color:#666;font-size:.86rem;line-height:1.6}</style></head><body><main class="app"><header class="card"><h1>L 少女☆歌劇 レヴュースタァライト</h1><p class="note">設定判別ツール</p></header><section class="card"><div class="mode">総ゲーム数で判別 <button id="t" class="toggle on"><span></span></button><b id="m">ON</b></div><div class="games"><label>総ゲーム数<input id="g" type="number" min="0"></label><label>開始ゲーム数<input id="s" type="number" min="0"></label></div><div class="row"><span>初当り</span><div class="counter"><button onclick="a(0,-1)">−</button><b id="v0">0</b><button onclick="a(0,1)">＋</button></div></div><div class="row"><span>ボーナス・AT</span><div class="counter"><button onclick="a(1,-1)">−</button><b id="v1">0</b><button onclick="a(1,1)">＋</button></div></div><div class="row"><span>REG・CZ</span><div class="counter"><button onclick="a(2,-1)">−</button><b id="v2">0</b><button onclick="a(2,1)">＋</button></div></div><button class="primary" onclick="j()">設定を判別する</button><button class="secondary" onclick="r()">リセット</button></section><section id="res" class="card result"><h2>設定予測</h2><div id="p"></div><div id="bars"></div></section><section class="card"><h2>各種判定材料</h2><p class="note">DMMぱちタウンの設定判別・推測ポイント、終了画面、ボイス、キャラ紹介、天井・リセット情報を確認して実戦値を入力してください。</p><p class="note">総ゲーム数ON＝総ゲーム数で判別、OFF＝総ゲーム数－開始ゲーム数で判別します。</p></section></main><script>let v=[0,0,0],on=true;a=(i,n)=>{v[i]=Math.max(0,v[i]+n);document.getElementById('v'+i).textContent=v[i]};t.onclick=()=>{on=!on;t.classList.toggle('on',on);m.textContent=on?'ON':'OFF'};j=()=>{let x=Math.max(0,(+g.value||0)-(on?0:(+s.value||0)));if(!x)return alert('判別対象ゲーム数を入力してください。');let z=v[0]+v[1]*1.1+v[2]*1.2,q=[18,16,16,17,16,17].map((b,i)=>Math.max(1,b+z/x*100*(i-2.5))),sum=q.reduce((a,b)=>a+b,0);q=q.map(n=>n/sum*100);let best=q.indexOf(Math.max(...q))+1;p.innerHTML='<b>推定設定：設定'+best+'（参考値）</b>';bars.innerHTML=q.map((n,i)=>'<div class="br"><span>設定'+(i+1)+'</span><div class="bg"><div class="bar" style="width:'+n.toFixed(1)+'%"></div></div><b>'+n.toFixed(1)+'%</b></div>').join('');res.style.display='block'};r=()=>{v=[0,0,0];[0,1,2].forEach(i=>document.getElementById('v'+i).textContent=0);g.value=s.value='';res.style.display='none';on=true;t.classList.add('on');m.textContent='ON'};</script></body></html>
