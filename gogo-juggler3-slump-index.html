<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>ゴーゴージャグラー3 スランプグラフ</title>
  <link rel="stylesheet" href="juggler-slump-style.css?v=20260924-2">
</head>
<body>
<main class="app">
  <header class="top">
    <h1>ゴーゴージャグラー3<br><span id="estimatedSetting" class="setting-badge">推定設定 —</span><br><span>スランプグラフ📈</span></h1>
    <p>40G / 50枚　BIG +240枚　REG +96枚</p>
  </header>
  <section class="graph-card">
    <div class="graph-head">
      <div class="graph-head-info">
        <div><div class="eyebrow">推定差枚グラフ</div><div id="currentDiff" class="current">0枚</div></div>
        <div class="bonus-probs"><div><span>BIG確率</span><strong id="bigProb">—</strong></div><div><span>REG確率</span><strong id="regProb">—</strong></div></div>
      </div>
      <button id="resetBtn" type="button" class="reset">全消去</button>
    </div>
    <div class="canvas-wrap"><canvas id="slumpChart" aria-label="スランプグラフ"></canvas><div id="emptyState" class="empty">下にゲーム数とボーナスを入力</div></div>
    <div class="stats">
      <div><span>総G</span><strong id="totalGames">0G</strong></div><div><span>BIG</span><strong id="bigCount">0</strong></div><div><span>REG</span><strong id="regCount">0</strong></div><div><span>最大+</span><strong id="maxPlus">0枚</strong></div><div><span>最大−</span><strong id="maxMinus">0枚</strong></div>
    </div>
  </section>
  <section class="input-card">
    <div class="input-title"><h2>ボーナス履歴</h2><span>最大100件</span></div>
    <div class="row-head"><span>No.</span><span>ゲーム数</span><span>種類</span></div>
    <div id="rows" class="rows"></div>
  </section>
  <p class="note">※ 推定グラフです。通常時は40Gで50枚消費するものとして直線計算します。推定設定はBIG・REG実績を設定別ボーナス確率と比較した参考値です。</p>
</main>
<script>window.JUGGLER_CONFIG={name:"ゴーゴージャグラー3",gamesPer50:40,bigPayout:240,regPayout:96,settingRates:[{setting:1,big:259,reg:354.2},{setting:2,big:258,reg:332.7},{setting:3,big:257,reg:306.2},{setting:4,big:254,reg:268.6},{setting:5,big:247.3,reg:247.3},{setting:6,big:234.9,reg:234.9}]};</script>
<script src="juggler-slump-app.js?v=20260924-2"></script>
</body>
</html>
