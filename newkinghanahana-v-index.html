<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマート沖スロ ニューキングハナハナV｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d;margin-bottom:14px}.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games label{font-weight:700}.games input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.counter{display:flex;align-items:center;gap:10px}.counter button,.primary,.secondary{border:0;border-radius:9px;padding:10px 16px;font-weight:700}.counter button{background:#eee;font-size:1.2rem}.counter b{min-width:28px;text-align:center}.primary,.secondary{width:100%;margin-top:10px}.primary{background:#222;color:#fff}.secondary{background:#eee}.result{display:none}.result.show{display:block}.barrow{display:grid;grid-template-columns:55px 1fr 48px;gap:8px;align-items:center;margin:9px 0}.bg{height:12px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:#222}.pred{font-size:1.15rem;font-weight:700}.material{border-top:1px solid #eee;padding:12px 0}.material summary{font-weight:700}.note{font-size:.82rem;color:#666;line-height:1.6}@media(max-width:520px){.games{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="card"><h1>スマート沖スロ ニューキングハナハナV</h1><p>設定判別ツール</p></header><section class="card"><div class="games"><label>総ゲーム数<input id="g" type="number" min="0"></label><label>開始ゲーム数<input id="st" type="number" min="0"></label></div><div class="row"><span>BIG</span><div class="counter"><button onclick="add('b',-1)">−</button><b id="b">0</b><button onclick="add('b',1)">＋</button></div></div><div class="row"><span>REG</span><div class="counter"><button onclick="add('r',-1)">−</button><b id="r">0</b><button onclick="add('r',1)">＋</button></div></div><button class="primary" onclick="judge()">設定判別</button><button class="secondary" onclick="resetAll()">リセット</button></section><section id="res" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card"><h2>各種判定材料</h2><details class="material"><summary>ボーナス後ハイビスカスランプ</summary><p class="note">ボーナス後の色・点滅パターンは設定推測材料として確認します。</p></details><details class="material"><summary>BT中スイカ・サイドランプ</summary><p class="note">サイドランプ色やスイカ確率など、公開されている設定差を補助材料として扱います。</p></details><p class="note">本機は設定1～4＋設定Vの5段階です。設定Vを最高設定として表示します。</p></section></main><script>const sets=['1','2','3','4','V'],br=[299,291,281,268,253],rr=[496,471,442,409,372];let s={b:0,r:0};function add(k,d){s[k]=Math.max(0,s[k]+d);document.getElementById(k).textContent=s[k]}function judge(){const G=Math.max(0,(+g.value||0)-(+st.value||0));if(!G)return alert('判別対象ゲーム数を入力してください。');const x=br.map((v,i)=>s.b*Math.log(G/v)-G/v+s.r*Math.log(G/rr[i])-G/rr[i]),m=Math.max(...x),w=x.map(v=>Math.exp(v-m)),t=w.reduce((a,b)=>a+b,0),p=w.map(v=>v/t*100),best=p.indexOf(Math.max(...p));pred.textContent='推定設定：設定'+sets[best]+'（'+G+'G）';bars.innerHTML=p.map((v,i)=>`<div class="barrow"><span>設定${sets[i]}</span><div class="bg"><div class="bar" style="width:${v.toFixed(1)}%"></div></div><b>${v.toFixed(1)}%</b></div>`).join('');res.classList.add('show')}function resetAll(){s={b:0,r:0};b.textContent=r.textContent='0';g.value=st.value='';res.classList.remove('show')}</script></body></html>
