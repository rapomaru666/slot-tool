<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ スーパーリオエース2｜設定判別ツール</title><link rel="stylesheet" href="machine-tool-style.css"></head><body><main class="app"><header class="card header"><h1>スマスロ スーパーリオエース2</h1><p>設定判別ツール</p></header><section class="card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0"></label><label>開始ゲーム数<input id="start" type="number" min="0"></label></div><div id="metrics"></div><button id="judge" class="primary">設定判別</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><div id="materials"></div></section></main><script>window.MACHINE_CONFIG={metrics:[{name:'AT初当り',rates:[289.8,281.9,268,238.9,230,219.2]}],materials:[{title:'ボーナス・AT終了画面',options:['確認なし','設定示唆を確認','高設定示唆を確認','確定系を確認'],note:'終了画面などの演出示唆は確認した内容を記録。'}]};</script><script src="machine-tool.js"></script></body></html>
