<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ 化物語｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#222}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{padding:9px 13px;border:0;border-radius:9px;font-weight:700}.wide{width:100%;margin-top:10px}.dark{background:#222;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:center;font-size:13px}p{color:#666;line-height:1.6}</style></head><body><main class="app"><section class="card"><h1>スマスロ 化物語</h1><p>AT初当り・スイカ・AT直撃・CZ・終了画面などの設定差を確認する機種別ツール。</p></section><section class="card"><label>通常時ゲーム数<input id="g" type="number" min="0"></label><label>AT初当り回数<input id="a" type="number" min="0"></label><label>スイカ回数<input id="s" type="number" min="0"></label><label>弱チェリーAT直撃回数<input id="c" type="number" min="0"></label><button class="wide dark" onclick="j()">設定を判別する</button><button class="wide" onclick="z()">リセット</button><p id="o">判定結果：</p></section><section class="card"><h2>公表値</h2><table><tr><th>設定</th><th>AT初当り</th><th>スイカ</th><th>AT中ボーナス</th></tr><tr><td>1</td><td>1/265.1</td><td>1/87.4</td><td>1/2735.7</td></tr><tr><td>2</td><td>1/260.7</td><td>1/85.8</td><td>1/2605.3</td></tr><tr><td>3</td><td>1/252.1</td><td>1/84.9</td><td>1/2396.6</td></tr><tr><td>4</td><td>1/238.8</td><td>1/79.7</td><td>1/2381.5</td></tr><tr><td>5</td><td>1/230.8</td><td>1/74.8</td><td>1/2177.3</td></tr><tr><td>6</td><td>1/219.6</td><td>1/69.9</td><td>1/1938.8</td></tr></table><p>設定示唆：AT終了画面、サミートロフィー、獲得枚数表示、ボーナス確定画面。終了画面には偶奇・高設定・特定設定以上の示唆がある。</p></section></main><script>function j(){let g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0,s=+document.getElementById('s').value||0;if(!g){o.textContent='判定結果：通常時ゲーム数を入力してください。';return}o.textContent='実績：AT初当り '+(a?'1/'+(g/a).toFixed(1):'未入力')+'、スイカ '+(s?'1/'+(g/s).toFixed(1):'未入力')+'。弱チェリー直撃と各種終了画面も合わせて確認してください。'}function z(){['g','a','s','c'].forEach(x=>document.getElementById(x).value='');o.textContent='判定結果：'}</script></body></html>
