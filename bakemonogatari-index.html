<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ 化物語｜設定判別ツール</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f4f6;margin:0;color:#111827}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h1{text-align:center;font-size:26px}.row{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;margin:10px 0}.row input{height:44px;border:1px solid #d1d5db;border-radius:9px;padding:0 10px;font-size:16px}button{width:100%;height:50px;border:0;border-radius:10px;font-weight:800;font-size:16px;background:#111827;color:#fff;margin:4px 0}.reset{background:#e5e7eb;color:#111827}.result{display:none}.result.show{display:block}.g{display:grid;grid-template-columns:50px 1fr 55px;gap:8px;align-items:center;margin:9px 0}.bar{height:18px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.notice{font-size:12px;color:#6b7280;line-height:1.6}</style></head><body><main class="app"><h1>スマスロ 化物語</h1><div class="card"><h2>実戦データ</h2><div class="row"><b>総ゲーム数</b><input id="g" type="number" min="1"></div><div class="row"><b>AT初当り</b><input id="a" type="number" min="0"></div><div class="row"><b>スイカ</b><input id="s" type="number" min="0"></div><div class="row"><b>弱チェリーからのAT直撃</b><input id="c" type="number" min="0"></div><div class="row"><b>解呪ノ儀当選</b><input id="z" type="number" min="0"></div></div><div class="card"><h2>設定示唆</h2><div class="row"><b>設定4以上濃厚</b><input id="s4" type="number" min="0" value="0"></div><div class="row"><b>設定6濃厚</b><input id="s6" type="number" min="0" value="0"></div></div><button onclick="judge()">設定を判別する</button><button class="reset" onclick="location.reload()">リセット</button><div id="res" class="card result"><h2>設定予測</h2><h2 id="pred">-</h2><div id="graph"></div><p class="notice">AT初当り、スイカ、CZ・AT直撃などの公開設定差を用いた参考判定です。citeturn1search2turn1search10</p></div></main><script>const n=[1,2,3,4,5,6],at=[265.1,260.7,252.1,238.8,230.8,219.6],sw=[87.4,85.8,84.9,79.7,74.8,69.9],dir=[250,125,77,48,34,26],cz=[100,95,80,70,65,60];function sc(G,r,x,k){return Math.pow(G/r[k],x)*Math.exp(-G/r[k])}function judge(){let G=+g.value;if(!G){alert('総ゲーム数を入力してください');return}let A=+a.value||0,S=+s.value||0,C=+c.value||0,Z=+z.value||0,S4=+s4.value||0,S6=+s6.value||0;let p=n.map((_,i)=>sc(G,at,A,i)*sc(G,sw,S,i)*sc(G,dir,C,i)*sc(G,cz,Z,i));let min=S6?6:S4?4:1;p=p.map((x,i)=>n[i]<min?0:x);let sum=p.reduce((a,b)=>a+b,0)||1;p=p.map(x=>x/sum*100);let m=p.indexOf(Math.max(...p));pred.textContent='最有力：設定'+n[m];graph.innerHTML=p.map((x,i)=>`<div class="g"><b>設定${n[i]}</b><div class="bar"><div class="fill" style="width:${x.toFixed(1)}%"></div></div><span>${x.toFixed(1)}%</span></div>`).join('');res.classList.add('show')}</script></body></html>
