<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LBスロットGALFY｜設定判別ツール</title><link rel="stylesheet" href="machine-tool-style.css"></head><body><main class="app"><header class="card header"><h1>LBスロットGALFY</h1><p>設定判別ツール</p></header><section class="card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0"></label><label>開始ゲーム数<input id="start" type="number" min="0"></label></div><div id="metrics"></div><button id="judge" class="primary">設定判別</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><div id="materials"></div></section></main><script>window.MACHINE_CONFIG={settings:[1,2,5,6],metrics:[{name:'BIG',rates:[295.2,292.6,284.9,277.7]},{name:'REG',rates:[399.6,360.1,312.1,277.7]}],materials:[{title:'ボーナス終了時サイドランプ',options:['白','青','黄','緑','赤','虹'],note:'設定1/2/5/6の4段階。REG確率を主軸に判別します。'}]};</script><script src="machine-tool.js"></script></body></html>
