<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L 絶対衝激～PLATONIC HEART～ 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}input,button{padding:9px;border:1px solid #ddd;border-radius:8px}.n{color:#666}</style><main><section class=c><h1>L 絶対衝激～PLATONIC HEART～</h1><p class=n>ボーナス・AT確率、スイカ成立時高確移行、ATストック、JAC INボイス、必殺技、ナミちゃんトロフィーを総合判別</p></section><section class=c><label>通常時ゲーム数 <input id=g type=number min=0></label><div class=r>ボーナス初当り <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>AT初当り <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>スイカ成立時の高確移行 <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><div class=r>ボーナス成立時ATストック <span><button onclick="a(3,-1)">−</button><b id=v3>0</b><button onclick="a(3,1)">＋</button></span></div><button onclick="j()">設定を判別する</button><button onclick="r()">リセット</button><p id=o></p></section><section class=c><h2>設定差</h2><p>ボーナス確率：設定1 1/163.0→設定6 1/139.7。AT確率：1/336.3→1/264.7。スイカ成立時の高確移行率は1 19.92%→6 25.78%、ボーナス成立時ATストック当選率は1 0.39%→6 1.95%。JAC IN時ボイス、継続ジャッジの必殺技、ナミちゃんトロフィーも設定示唆。</p></section></main><script>let x=[0,0,0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=(+g.value||0)?'ボーナス・AT確率と追加設定示唆を総合して判別します。':'通常時ゲーム数を入力してください'}function r(){x=[0,0,0,0];for(let i=0;i<4;i++)document.getElementById('v'+i).textContent=0;g.value='';o.textContent=''}</script></html>
