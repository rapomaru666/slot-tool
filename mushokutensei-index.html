<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無職転生 設定判別</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#111827}.app{max-width:760px;margin:auto;padding:10px 8px 30px}h1{text-align:center;font-size:20px}.card{background:#fff;border-radius:14px;padding:14px 12px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.mode{display:flex;align-items:center;gap:9px;font-weight:800}.toggle{width:54px;height:30px;border:0;border-radius:20px;background:#9ca3af;padding:3px}.toggle span{display:block;width:24px;height:24px;background:white;border-radius:50%;transition:.2s}.toggle.on{background:#111827}.toggle.on span{transform:translateX(24px)}input{width:100%;height:46px;border:1px solid #d1d5db;border-radius:10px;padding:9px;font-size:16px}.row{display:grid;grid-template-columns:minmax(0,1fr) 142px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.counter{height:44px;display:grid;grid-template-columns:39px 1fr 39px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden}.counter button{border:0;background:#e5e7eb;font-size:21px;font-weight:800}.counter span{display:flex;align-items:center;justify-content:center;font-weight:800}.judge,.reset{width:100%;height:52px;border:0;border-radius:12px;font-weight:800;font-size:17px}.judge{background:#111827;color:#fff;margin-top:12px}.reset{margin-top:8px}.result{display:none}.result.show{display:block}.gr{display:grid;grid-template-columns:45px 1fr 52px;gap:7px;align-items:center;margin:8px 0}.bg{height:18px;background:#e5e7eb;border-radius:20px;overflow:hidden}.bar{height:100%;background:#111827}.materials details{border-top:1px solid #eee;padding:12px 0}.materials summary{font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.grid button{min-height:62px;border:1px solid #d1d5db;border-radius:10px;background:#f9fafb;padding:7px;font-weight:700}.grid button.selected{background:#e5e7eb;border-color:#111827}.grid small{color:#6b7280}.note{font-size:12px;color:#6b7280;line-height:1.55}</style></head><body><main class="app"><h1>L 無職転生<br>設定判別ツール</h1><section class="card"><div class="mode">数値データで判別 <button id="mode" class="toggle on"><span></span></button><b id="ml">ON</b></div><p><label>通常時ゲーム数<input id="g" type="number" inputmode="numeric" min="0"></label></p><div id="rows"></div><button id="judge" class="judge">設定を判別する</button><button id="reset" class="reset">リセット</button></section><section id="result" class="card result"><h2 id="pred"></h2><div id="graph"></div></section><section class="card materials"><h2>各種判定材料</h2><details open><summary>ボーナス・AT終了画面</summary><div class="grid"><button data-even="1">師弟・白枠<br><small>偶数設定示唆</small></button><button data-high="1">ブエナ村・青枠<br><small>高設定示唆 弱</small></button><button data-high="2">魔大陸・赤枠<br><small>高設定示唆 強</small></button><button data-min="2">デッドエンド・銅枠<br><small>設定2以上濃厚</small></button><button data-min="4">絆・銀枠<br><small>設定4以上濃厚</small></button><button data-min="6">オルステッド・金枠<br><small>設定6濃厚</small></button></div></details><details><summary>CZ 無職チャンス %表示</summary><div class="grid"><button data-min="4">44%表示<br><small>設定4以上濃厚</small></button><button data-min="5">55%表示<br><small>設定5以上濃厚</small></button><button data-min="6">66%表示<br><small>設定6濃厚</small></button></div></details><details><summary>魔術ボーナス ストーリー</summary><div class="grid"><button data-min="2">第1話 無職転生<br><small>設定2以上濃厚</small></button><button data-min="4">第8話 ターニングポイント1<br><small>設定4以上濃厚</small></button><button data-min="6">第21話 ターニングポイント2<br><small>設定6濃厚</small></button></div></details><details><summary>ATセット開始画面</summary><div class="grid"><button data-even="2">ロキシー＆シルフィ＆エリス<br><small>設定2・4・6濃厚＋ストック</small></button><button data-min="4">ヒトガミ<br><small>設定4以上濃厚＋ストック</small></button><button data-min="5">前世の男<br><small>設定5以上濃厚＋ストック</small></button><button data-min="6">オルステッド<br><small>設定6濃厚＋ストック</small></button></div></details><details><summary>獲得枚数表示</summary><div class="grid"><button data-min="2">222枚OVER<br><small>設定2以上濃厚</small></button><button data-even="2">246枚OVER<br><small>設定2・4・6濃厚</small></button><button data-min="3">333枚OVER<br><small>設定3以上濃厚</small></button><button data-min="4">456枚OVER<br><small>設定4以上濃厚</small></button><button data-min="5">555枚OVER<br><small>設定5以上濃厚</small></button><button data-min="6">666枚OVER<br><small>設定6濃厚</small></button></div></details><p class="note">主要数値：ボーナス初当り 1/170→1/147、AT初当り 1/416→1/292、CZ 1/130→1/125、AT中ターニングポイント2 1/2281→1/1324（設定1→6）。</p></section></main><script>const S=[1,2,3,4,5,6],R={bonus:[0,170,168,166,161,156,147],at:[0,416,406,394,361,327,292],cz:[0,130,129,128,127,127,125],tp2:[0,2281,2137,1968,1655,1459,1324]};let c={bonus:0,at:0,cz:0,tp2:0},on=true;const $=x=>document.getElementById(x),N={bonus:'ボーナス初当り',at:'AT初当り',cz:'CZ初当り',tp2:'AT中 ターニングポイント2'};$('rows').innerHTML=Object.keys(c).map(k=>`<div class="row"><b>${N[k]}</b><div class="counter"><button data-k="${k}" data-d="-1">−</button><span id="${k}">0</span><button data-k="${k}" data-d="1">＋</button></div></div>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;c[k]=Math.max(0,c[k]+ +b.dataset.d);$(k).textContent=c[k]});$('mode').onclick=()=>{on=!on;$('mode').classList.toggle('on',on);$('ml').textContent=on?'ON':'OFF'};document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));function lf(n){let z=0;for(let i=2;i<=n;i++)z+=Math.log(i);return z}function p(n,g,r){let l=g/r;return n?n*Math.log(l)-l-lf(n):-l}function allowed(s){let min=1,evenOnly=false;document.querySelectorAll('.selected').forEach(b=>{if(b.dataset.min)min=Math.max(min,+b.dataset.min);if(b.dataset.even==='2')evenOnly=true});return s>=min&&(!evenOnly||s%2===0)}$('judge').onclick=()=>{let g=+$('g').value||0;if(on&&!g)return alert('通常時ゲーム数を入力してください');let L={};S.forEach(s=>{if(!allowed(s))return L[s]=-Infinity;let z=0;if(on){z+=p(c.bonus,g,R.bonus[s]);z+=p(c.at,g,R.at[s]);z+=p(c.cz,g,R.cz[s])*.55;z+=p(c.tp2,g,R.tp2[s])*.7}document.querySelectorAll('[data-high].selected').forEach(b=>z+=+b.dataset.high*(s>=4?.45:-.12));document.querySelectorAll('[data-even="1"].selected').forEach(()=>z+=s%2===0?.35:-.2);L[s]=z});let v=S.filter(s=>isFinite(L[s])),m=Math.max(...v.map(s=>L[s])),w={},sum=0;v.forEach(s=>{w[s]=Math.exp(L[s]-m);sum+=w[s]});S.forEach(s=>w[s]=isFinite(L[s])?w[s]/sum:0);let best=S.reduce((a,b)=>w[a]>=w[b]?a:b);$('pred').textContent=`設定${best} が最有力`;$('graph').innerHTML=S.map(s=>`<div class="gr"><span>設定${s}</span><div class="bg"><div class="bar" style="width:${(w[s]*100).toFixed(1)}%"></div></div><span>${(w[s]*100).toFixed(1)}%</span></div>`).join('');$('result').classList.add('show')};$('reset').onclick=()=>location.reload();</script></body></html>
