<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L 無職転生 設定判別ツール</title><link rel="stylesheet" href="ghoul-base-style.css"><style>.state-title{font-weight:900;font-size:16px;margin:16px 0 8px;padding:8px 10px;background:#f9fafb;border-radius:9px}.counter-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.counter{height:44px;display:grid;grid-template-columns:41px 1fr 41px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden}.counter button{border:0;background:#e5e7eb;font-size:21px;font-weight:800}.counter span{display:flex;align-items:center;justify-content:center;font-weight:800}.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}.games input{width:100%;height:46px;border:1px solid #d1d5db;border-radius:10px;padding:9px;font-size:16px}.rate,.note{font-size:12px;color:#6b7280;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{min-height:62px;border:1px solid #d1d5db;border-radius:10px;background:#f9fafb;font-weight:700}.grid button.selected{background:#e5e7eb;border-color:#111827}.result{display:none}.result.show{display:block}.gr{display:grid;grid-template-columns:48px 1fr 54px;gap:7px;align-items:center;margin:8px 0}.bg{height:18px;background:#e5e7eb;border-radius:20px;overflow:hidden}.bar{height:100%;background:#111827}</style></head><body><main class="app"><header class="header"><h1>L 無職転生 ～異世界行ったら本気だす～</h1><p>設定判別ツール</p></header><section class="card input-card"><div class="mode-row"><span>ゲーム数・回数を設定判別に使用</span><button id="mode" class="toggle on" type="button"><span></span></button><b id="ml">ON</b></div><div class="state-title">ゲーム数</div><div class="games"><label>通常時ゲーム数<input id="normalG" type="number" min="0" inputmode="numeric"></label><label>AT中ゲーム数<input id="atG" type="number" min="0" inputmode="numeric"></label></div><div class="state-title">通常時</div><div id="normalRows"></div><div class="state-title">ヒトガミの空間</div><div id="hitogamiRows"></div><div class="state-title">ヒトガミ非移行時のステージ</div><div id="stageRows"></div><p class="note">※AT終了後2回目のステージ抽選はシーローン王国濃厚のため含めない。</p><div class="state-title">ヒロインチャンス</div><div id="heroRows"></div><div class="state-title">AT中</div><div id="atRows"></div><div id="rates" class="rate">出現率：-</div><button id="judge" class="judge-btn">設定を判別する</button><button id="reset" class="reset-btn">リセット</button></section><section id="result" class="card result"><h2>設定予測</h2><div id="pred" class="prediction">-</div><div id="graph"></div></section><section class="card materials"><h2>各種判定材料</h2><details open><summary>ボーナス・AT終了画面</summary><div class="grid"><button data-even="1">師弟・白枠<br><small>偶数示唆</small></button><button data-high="1">ブエナ村・青枠<br><small>高設定示唆 弱</small></button><button data-high="2">魔大陸・赤枠<br><small>高設定示唆 強</small></button><button data-min="2">デッドエンド・銅枠<br><small>設定2以上</small></button><button data-min="4">絆・銀枠<br><small>設定4以上</small></button><button data-min="6">オルステッド・金枠<br><small>設定6</small></button></div></details><details><summary>CZ 無職チャンス</summary><div class="grid"><button data-min="4">44%</button><button data-min="5">55%</button><button data-min="6">66%</button></div></details><details><summary>獲得枚数</summary><div class="grid"><button data-min="2">222枚OVER</button><button data-evenonly="1">246枚OVER</button><button data-min="3">333枚OVER</button><button data-min="4">444枚OVER</button><button data-min="4">456枚OVER</button><button data-min="5">555枚OVER</button><button data-min="6">666枚OVER</button></div></details></section></main><script>const S=[1,2,3,4,5,6],R={bonus:[0,170,168,166,161,156,147],at:[0,416,406,394,361,327,292],cz:[0,130,129,128,127,127,125],tp2:[0,2281,2137,1968,1655,1459,1324]},P={hit:[0,.318,.322,.327,.347,.366,.410],shi:[0,.0625,.0703,.0781,.0859,.0938,.1094],fore:[0,.176,.177,.178,.181,.183,.187]};let c={bonus:0,at:0,cz:0,hitT:0,hitH:0,stageT:0,shiH:0,heroT:0,foreH:0,tp2:0},on=true;const $=x=>document.getElementById(x),defs={normalRows:[['bonus','ボーナス初当り'],['at','AT初当り'],['cz','CZ初当り']],hitogamiRows:[['hitT','ヒトガミの空間 突入回数'],['hitH','うち本前兆（ボーナス当選）']],stageRows:[['stageT','ステージ抽選回数'],['shiH','シーローン王国 回数']],heroRows:[['heroT','ヒロインチャンス 回数'],['foreH','予見眼 発動回数']],atRows:[['tp2','ターニングポイント2 突入回数']]};function counter(k,n){return `<div class="counter-row"><b>${n}</b><div class="counter"><button data-k="${k}" data-d="-1">−</button><span id="${k}">0</span><button data-k="${k}" data-d="1">＋</button></div></div>`}Object.entries(defs).forEach(([id,a])=>$(id).innerHTML=a.map(x=>counter(...x)).join(''));document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;c[k]=Math.max(0,c[k]+ +b.dataset.d);$(k).textContent=c[k];refresh();save()});function n(id){return +($(id)?.value||0)}function refresh(){let ng=n('normalG'),ag=n('atG');$('rates').textContent=`ボーナス ${ng&&c.bonus?'1/'+(ng/c.bonus).toFixed(1):'-'} ｜ AT ${ng&&c.at?'1/'+(ng/c.at).toFixed(1):'-'} ｜ CZ ${ng&&c.cz?'1/'+(ng/c.cz).toFixed(1):'-'} ｜ TP2 ${ag&&c.tp2?'1/'+(ag/c.tp2).toFixed(1):'-'}`}function lf(x){let z=0;for(let i=2;i<=x;i++)z+=Math.log(i);return z}function pois(k,g,r){let l=g/r;return k?k*Math.log(l)-l-lf(k):-l}function bin(t,h,p){if(!t)return 0;h=Math.min(t,h);return h*Math.log(p)+(t-h)*Math.log(1-p)}function allowed(s){let min=1,even=false;document.querySelectorAll('.materials button.selected').forEach(b=>{if(b.dataset.min)min=Math.max(min,+b.dataset.min);if(b.dataset.evenonly)even=true});return s>=min&&(!even||s%2===0)}function hint(s){let z=0;document.querySelectorAll('[data-high].selected').forEach(b=>z+=+b.dataset.high*(s>=4?.4:-.12));document.querySelectorAll('[data-even="1"].selected').forEach(()=>z+=s%2===0?.3:-.2);return z}$('judge').onclick=()=>{let ng=n('normalG'),ag=n('atG'),L={};S.forEach(s=>{if(!allowed(s))return L[s]=-Infinity;let z=hint(s);if(on){if(ng){z+=.6*pois(c.bonus,ng,R.bonus[s])+pois(c.at,ng,R.at[s])+.35*pois(c.cz,ng,R.cz[s])}if(ag)z+=pois(c.tp2,ag,R.tp2[s]);z+=1.15*bin(c.hitT,c.hitH,P.hit[s])+.9*bin(c.stageT,c.shiH,P.shi[s])+.35*bin(c.heroT,c.foreH,P.fore[s])}L[s]=z});let v=S.filter(s=>isFinite(L[s]));if(!v.length)return alert('選択した示唆が矛盾しています');let m=Math.max(...v.map(s=>L[s])),w={},sum=0;v.forEach(s=>{w[s]=Math.exp(L[s]-m);sum+=w[s]});S.forEach(s=>w[s]=isFinite(L[s])?w[s]/sum:0);let best=S.reduce((a,b)=>w[a]>=w[b]?a:b);$('pred').textContent=`設定${best} が最有力`;$('graph').innerHTML=S.map(s=>`<div class="gr"><span>設定${s}</span><div class="bg"><div class="bar" style="width:${(w[s]*100).toFixed(1)}%"></div></div><span>${(w[s]*100).toFixed(1)}%</span></div>`).join('');$('result').classList.add('show')};$('mode').onclick=()=>{on=!on;$('mode').classList.toggle('on',on);$('ml').textContent=on?'ON':'OFF';save()};document.querySelectorAll('.materials button').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');save()});document.querySelectorAll('input').forEach(e=>e.oninput=()=>{refresh();save()});function save(){localStorage.setItem('mushoku-v4',JSON.stringify({c,on,normalG:$('normalG').value,atG:$('atG').value}))}$('reset').onclick=()=>{localStorage.removeItem('mushoku-v4');location.reload()};try{let s=JSON.parse(localStorage.getItem('mushoku-v4')||'{}');if(s.c)c={...c,...s.c};if(s.on===false)on=false;$('normalG').value=s.normalG||'';$('atG').value=s.atG||'';Object.keys(c).forEach(k=>$(k)&&($(k).textContent=c[k]));$('mode').classList.toggle('on',on);$('ml').textContent=on?'ON':'OFF'}catch(e){}refresh();</script></body></html>
