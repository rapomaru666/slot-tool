ment.getElementById('c').value||0;if(!g){o.textContent='判定結果：通常時ゲーム数を入力してください。';return}o.textContent='実績：ボーナス '+(b?'1/'+(g/b).toFixed(1):'未入力')+'、AT '+(a?'1/'+(g/a).toFixed(1):'未入力')+'。TP2はAT中G数ベースで公表値と比較してください。'}function z(){['g','b','a','c'].forEach(x=>document.getElementById(x).value='');o.textContent='判定結果：'}</script></body></html>
