<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L 無職転生 ～異世界行ったら本気だす～｜設定判別ツール</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f4f6;margin:0;color:#111827}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h1{text-align:center;font-size:24px}.row{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;margin:10px 0}.row input{height:44px;border:1px solid #d1d5db;border-radius:9px;padding:0 10px;font-size:16px}button{width:100%;height:50px;border:0;border-radius:10px;font-weight:800;font-size:16px;background:#111827;color:#fff;margin:4px 0}.reset{background:#e5e7eb;color:#111827}.result{display:none}.result.show{display:block}.g{display:grid;grid-template-columns:50px 1fr 55px;gap:8px;align-items:center;margin:9px 0}.bar{height:18px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.notice{font-size:12px;color:#6b7280;line-height:1.6}@media(max-width:600px){.row{grid-template-columns:1fr 125px}}</style></head><body><main class="app"><h1>L 無職転生<br>～異世界行ったら本気だす～</h1><div class="card"><h2>実戦データ</h2><div class="row"><b>総ゲーム数</b><input id="g" type="number" min="1"></div><div class="row"><b>AT初当り</b><input id="a" type="number" min="0"></div><div class="row"><b>ボーナス</b><input id="b" type="number" min="0"></div><div class="row"><b>ターニングポイント2</b><input id="t" type="number" min="0"></div></div><div class="card"><h2>設定示唆</h2><div class="row"><b>設定4以上濃厚</b><input id="s4" type="number" min="0" value="0"></div><div class="row"><b>設定6濃厚</b><input id="s6" type="number" min="0" value="0"></div></div><button onclick="judge()">設定を判別する</button><button class="reset" onclick="location.reload()">リセット</button><div id="res" class="card result"><h2>設定予測</h2><h2 id="pred">-</h2><div id="graph"></div><p class="notice">AT初当り、ボーナス確率、ターニングポイント2発生率の公開値を利用した参考判定です。citeturn0search2turn0search9</p></div></main><script>const n=[1,2,3,4,5,6],at=[416,406,394,361,327,292],bo=[170,168,166,161,156,147],tp=[2281,2137,1968,1655,1459,1324];function score(G,k,arr,x){return Math.pow(G/arr[k],x)*Math.exp(-G/arr[k])}function judge(){let G=+g.value;if(!G){alert('総ゲーム数を入力してください');return}let A=+a.value||0,B=+b.value||0,T=+t.value||0,S4=+s4.value||0,S6=+s6.value||0;let p=n.map((_,i)=>score(G,i,at,A)*score(G,i,bo,B)*score(G,i,tp,T));let min=S6?6:S4?4:1;p=p.map((x,i)=>n[i]<min?0:x);let z=p.reduce((a,b)=>a+b,0)||1;p=p.map(x=>x/z*100);let m=p.indexOf(Math.max(...p));pred.textContent='最有力：設定'+n[m];graph.innerHTML=p.map((x,i)=>`<div class="g"><b>設定${n[i]}</b><div class="bar"><div class="fill" style="width:${x.toFixed(1)}%"></div></div><span>${x.toFixed(1)}%</span></div>`).join('');res.classList.add('show')}</script></body></html>
