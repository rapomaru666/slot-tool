<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-SLOT+ 異世界かるてっと BT｜設定判別ツール</title><link rel="stylesheet" href="machine-tool-style.css"></head><body><main class="app"><header class="card header"><h1>A-SLOT+ 異世界かるてっと BT</h1><p>設定判別ツール</p></header><section class="card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0"></label><label>開始ゲーム数<input id="start" type="number" min="0"></label></div><div id="metrics"></div><button id="judge" class="primary">設定判別</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><div id="materials"></div></section></main><script>window.MACHINE_CONFIG={settings:[1,2,5,6],metrics:[{name:'ボーナス初当り',rates:[197.6,193.9,175.4,161.1]}],materials:[{title:'小役・BT中',options:['小役確率','BIG中ハズレ','BT中特殊7枚役']},{title:'獲得枚数・キャラ紹介',options:['示唆なし','示唆あり'],note:'設定は1・2・5・6の4段階。'}]};</script><script src="machine-tool.js"></script></body></html>
