<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{padding:9px;width:100%;box-sizing:border-box;margin:5px 0 10px}button{padding:9px;border:0;border-radius:8px;font-weight:700}.on{background:#222;color:#fff}</style><section><h1>防振り</h1><small>東京喰種の完成形を参照した機種別TOOL</small></section><section><b>総ゲーム数で判別</b> <button id=t class=on>ON</button><label>総ゲーム数<input id=g type=number></label><label>開始ゲーム数<input id=s type=number></label><p>初当り <button onclick=a[0]++>＋</button> <b id=a0>0</b>　AT/ST・BONUS <button onclick=a[1]++>＋</button> <b id=a1>0</b>　CZ・その他 <button onclick=a[2]++>＋</button> <b id=a2>0</b></p><button onclick=j()>設定を判別する</button> <button onclick=z()>リセット</button></section><section><b>機種固有判定材料</b><p>当該機種の初当り・CZ・AT/ST・終了画面・ボイス等、DMMぱちタウン掲載の設定推測要素のみ使用。</p></section><pre id=o>判定結果：</pre><script>let on=1,a=[0,0,0];t.onclick=()=>{on=!on;t.textContent=on?'ON':'OFF'};j=()=>o.textContent=`防振り：${Math.max(0,(+g.value||0)-(on?0:(+s.value||0)))}G`;z=()=>{g.value=s.value='';on=1;t.textContent='ON';o.textContent='判定結果：'};</script>
