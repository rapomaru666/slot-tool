<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>L 戦国コレクション6 設定判別ツール</title><link rel="stylesheet" href="sengokucollection6-style.css"></head>
<body><main class="app">
<header class="header"><h1>L 戦国コレクション6 設定判別ツール</h1></header>
<section class="card input-card">
<div class="mode-row"><span>総ゲーム数で判別</span><button id="mode" class="toggle on" type="button"><span></span></button><b id="modeLabel">ON</b></div>
<div class="games-pair"><label>総ゲーム数<input id="games" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start" type="number" min="0" inputmode="numeric"></label></div>
<div class="bonus-grid">
<div class="bonus-row important"><span>AT初当り回数</span><div class="counter"><button class="counter-btn minus" data-target="at">−</button><span id="at-value">0</span><button class="counter-btn plus" data-target="at">＋</button></div></div>
<div class="bonus-row"><span>ロボニャンドライブ</span><div class="counter"><button class="counter-btn minus" data-target="robot">−</button><span id="robot-value">0</span><button class="counter-btn plus" data-target="robot">＋</button></div></div>
<div class="bonus-row"><span>夢幻斬りWONDER</span><div class="counter"><button class="counter-btn minus" data-target="wonder">−</button><span id="wonder-value">0</span><button class="counter-btn plus" data-target="wonder">＋</button></div></div>
<div class="bonus-row"><span>3人のコレクション</span><div class="counter"><button class="counter-btn minus" data-target="three">−</button><span id="three-value">0</span><button class="counter-btn plus" data-target="three">＋</button></div></div>
</div>
<button id="judge" class="judge-btn">設定を判別する</button><button id="reset" class="reset-btn">リセット</button>
</section>
<section id="result" class="card result-card"><h2>設定予測</h2><div id="resultText" class="prediction">-</div><div class="graph"><div id="bars"></div></div></section>
<section class="card materials"><h2>各種判定材料</h2>
<details open><summary>アリストロフィー</summary><div class="material-grid"><button data-min="2">銅<br><small>設定2以上濃厚</small></button><button data-min="3">銀<br><small>設定3以上濃厚</small></button><button data-min="4">金<br><small>設定4以上濃厚</small></button><button data-min="5">クローバー柄<br><small>設定5以上濃厚</small></button><button data-min="6">虹<br><small>設定6濃厚</small></button></div></details>
<details><summary>AT終了画面</summary><div class="material-list"><button data-odd="1">織田信長<br><small>奇数設定示唆</small></button><button data-even="1">小野小町<br><small>偶数設定示唆</small></button><button data-high="1">水着1<br><small>高設定示唆[弱]</small></button><button data-high="2">水着2<br><small>高設定示唆[強]</small></button><button data-min="2">敵武将3人<br><small>設定2以上濃厚</small></button><button data-min="4">信長・光秀・利休・有楽<br><small>設定4以上濃厚</small></button><button data-min="6">しずもん絵<br><small>設定6濃厚</small></button></div></details>
<details><summary>ATセット開始画面・扉絵</summary><div class="material-list"><button data-min="2">上杉謙信<br><small>シナリオ12＋設定2以上濃厚</small></button><button data-min="4">信長＋光秀（水着）<br><small>シナリオ12＋設定4以上濃厚</small></button><button data-min="5">味方キャラ6人<br><small>シナリオ12＋設定5以上濃厚</small></button><button data-min="6">デフォルメキャラ全員<br><small>シナリオ12＋設定6濃厚</small></button></div></details>
<details><summary>特定の獲得枚数表示</summary><div class="material-grid"><button data-min="2">222枚OVER<br><small>設定2以上濃厚</small></button><button data-even="1">246枚OVER<br><small>偶数設定濃厚</small></button><button data-min="4">456枚OVER<br><small>設定4以上濃厚</small></button><button data-min="6">573枚OVER<br><small>設定6濃厚</small></button><button data-min="6">666枚OVER<br><small>設定6濃厚</small></button></div></details>
<details><summary>AT中の7揃い停止形</summary><div class="material-grid"><button data-min="4">4の形<br><small>設定4以上濃厚</small></button><button data-min="6">7の形<br><small>設定6濃厚</small></button></div></details>
<details><summary>夢幻斬りWONDER リザルト</summary><div class="material-grid"><button>白<br><small>デフォルト</small></button><button data-min="2">青<br><small>設定2以上の示唆</small></button><button data-min="2">緑<br><small>設定2以上濃厚</small></button><button data-min="4">赤<br><small>設定4以上濃厚</small></button><button data-min="6">虹<br><small>設定6濃厚</small></button></div></details>
</section><footer>L 戦国コレクション6 設定判別ツール</footer></main><script src="sengokucollection6-app.js"></script></body></html>
