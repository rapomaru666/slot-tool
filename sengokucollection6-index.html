<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>戦国コレクション6｜設定判別ツール</title><link rel="stylesheet" href="sengokucollection6-style.css"></head><body><main class="app"><header><h1>戦国コレクション6｜設定判別ツール</h1></header><section class="card"><div class="games"><label>総ゲーム数<input id="games" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start" type="number" min="0" inputmode="numeric"></label></div><div class="toggle-row"><span>総ゲーム数で判別</span><button id="mode" class="toggle on"><i></i></button><b id="modeLabel">ON</b></div><div class="rows"><div class="row"><span>AT初当り回数</span><div class="counter"><button data-k="at" data-d="-1">−</button><b id="at">0</b><button data-k="at" data-d="1">＋</button></div></div><div class="row"><span>ロボニャンドライブ</span><div class="counter"><button data-k="robot" data-d="-1">−</button><b id="robot">0</b><button data-k="robot" data-d="1">＋</button></div></div><div class="row"><span>夢幻斬りWONDER</span><div class="counter"><button data-k="wonder" data-d="-1">−</button><b id="wonder">0</b><button data-k="wonder" data-d="1">＋</button></div></div></div><button id="judge" class="primary">設定を判別する</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>設定判別結果</h2><div id="resultText" class="resultText">-</div><div id="bars"></div></section><section class="card hints"><h2>各種判定材料</h2><details open><summary>アリストロフィー</summary><div class="choice"><button data-min="2">銅<br><small>設定2以上濃厚</small></button><button data-min="3">銀<br><small>設定3以上濃厚</small></button><button data-min="4">金<br><small>設定4以上濃厚</small></button><button data-min="5">クローバー柄<br><small>設定5以上濃厚</small></button><button data-min="6">虹<br><small>設定6濃厚</small></button></div></details><details><summary>AT終了画面</summary><div class="choice"><button data-odd="1">織田信長<br><small>奇数設定示唆</small></button><button data-even="1">小野小町<br><small>偶数設定示唆</small></button><button data-high="1">水着1<br><small>高設定示唆[弱]</small></button><button data-high="2">水着2<br><small>高設定示唆[強]</small></button><button data-min="2">敵武将3人<br><small>設定2以上濃厚</small></button><button data-min="4">信長・光秀・利休・有楽<br><small>設定4以上濃厚</small></button><button data-min="6">しずもん絵<br><small>設定6濃厚</small></button></div></details><details><summary>ATセット開始画面・扉絵</summary><div class="choice"><button data-min="2">謙信<br><small>シナリオ12＋設定2以上濃厚</small></button><button data-min="4">信長＋光秀（水着）<br><small>シナリオ12＋設定4以上濃厚</small></button><button data-min="5">味方キャラ6人<br><small>シナリオ12＋設定5以上濃厚</small></button><button data-min="6">デフォルメキャラ全員<br><small>シナリオ12＋設定6濃厚</small></button></div></details><details><summary>特定の獲得枚数表示</summary><div class="choice"><button data-min="2">222枚突破!!<br><small>設定2以上濃厚</small></button><button data-even="1">246枚突破!!<br><small>設定2・4・6示唆</small></button><button data-min="4">456枚突破!!<br><small>設定4以上濃厚</small></button><button data-min="6">573枚突破!!<br><small>設定6濃厚</small></button><button data-min="6">666枚突破!!<br><small>設定6濃厚</small></button></div></details><details><summary>AT中の7揃い停止形</summary><div class="choice"><button data-min="4">4の形<br><small>設定4以上濃厚</small></button><button data-min="6">7の形<br><small>設定6濃厚</small></button></div></details><details><summary>夢幻斬りWONDER リザルト</summary><div class="choice"><button>白<br><small>デフォルト</small></button><button data-min="2">青<br><small>設定2以上期待度アップ</small></button><button data-min="2">緑<br><small>設定2以上濃厚</small></button><button data-min="4">赤<br><small>設定4以上濃厚</small></button><button data-min="6">虹<br><small>設定6濃厚</small></button></div></details></section><footer>RAPOMARU SLOT TOOL</footer></main><script src="sengokucollection6-app.js"></script></body></html>
