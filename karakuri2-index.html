<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lパチスロ からくりサーカス2｜設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;line-height:1.7;background:#f6f6f6;color:#222}.app{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0001}h1{font-size:1.35rem}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}label{display:block;font-weight:700;margin:8px 0 4px}input,select,button{font:inherit;box-sizing:border-box}input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}button{border:0;border-radius:9px;padding:11px 16px;cursor:pointer}.judge{width:100%;background:#111;color:#fff;font-weight:700}.reset{width:100%;margin-top:8px;background:#eee}.result{font-size:1.2rem;font-weight:700}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0}.bar{height:10px;background:#ddd;border-radius:99px;overflow:hidden}.fill{height:100%;background:#333}.note{font-size:.82rem;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{display:inline-block;background:#eee;border-radius:999px;padding:2px 8px;margin:2px;font-size:.78rem}</style></head><body><main class="app"><h1>🎪 Lパチスロ からくりサーカス2<br>設定判別ツール</h1><p class="note">2026年7月6日導入・公開解析情報をもとに設定候補を推測します。</p><section class="card"><h2>① 実戦データ</h2><div class="grid"><div><label>総ゲーム数</label><input id="games" type="number" min="0" placeholder="例：5000"></div><div><label>AT初当り回数</label><input id="at" type="number" min="0" value="0"></div><div><label>CZ初当り回数</label><input id="cz" type="number" min="0" value="0"></div><div><label>強チェリー契機のCZ/AT当選回数</label><input id="strong" type="number" min="0" value="0"></div><div><label>強チェリー成立回数</label><input id="strongTotal" type="number" min="0" value="0"></div></div><p class="note">AT/CZ確率：設定1→6で AT 1/519→1/410、CZ 1/342→1/318。強チェリー契機当選率にも設定差があります。</p></section><section class="card"><h2>② AT開始ステージ</h2><div class="grid"><div><label>勝ステージ（偶数示唆）</label><input id="even" type="number" min="0" value="0"></div><div><label>鳴海ステージ（奇数示唆）</label><input id="odd" type="number" min="0" value="0"></div></div></section><section class="card"><h2>③ 獲得枚数表示</h2><select id="coins"><option value="0">なし</option><option value="2">222OVER（設定2以上）</option><option value="24">246OVER（設定2・4・6）</option><option value="4">456OVER（設定4以上）</option><option value="6">666OVER（設定6）</option><option value="20">＋20（設定2以上濃厚）</option><option value="40">＋4（設定4以上濃厚）</option><option value="60">＋6（設定6濃厚）</option></select></section><section class="card"><h2>④ AT終了画面</h2><select id="ending"><option value="0">通常（しろがね）</option><option value="135">最古の四人（奇数＋高設定示唆）</option><option value="246">ルシール＆アンジェリーナ人形（偶数＋高設定示唆）</option><option value="2">歯車（設定2以上濃厚）</option><option value="4">鳴海＆勝（設定4以上濃厚）</option><option value="6">しろがね（笑顔）（設定6濃厚）</option></select></section><section class="card"><h2>⑤ AT終了画面ボイス</h2><select id="voice"><option value="0">未確認</option><option value="2">ルシール：設定2否定</option><option value="3">リーゼロッテ：設定3否定</option><option value="4">鳴海：設定4否定</option><option value="5">勝：設定5否定</option></select></section><section class="card"><button class="judge" onclick="judge()">設定を判別する</button><button class="reset" onclick="location.reload()">リセット</button></section><section id="result" class="card"><h2>設定予測</h2><div id="prediction" class="result">データを入力して判別してください</div><div id="bars"></div><p id="explain" class="note"></p></section><footer class="note">※公開されている設定差・設定示唆を利用した参考値です。設定を断定するものではありません。</footer></main><script>const atRate=[519,504,474,458,430,410],czRate=[342,341,339,339,327,318],strongRate=[.098,.102,.125,.137,.148,.164];function n(id){return Number(document.getElementById(id).value)||0}function judge(){const g=n('games'),at=n('at'),cz=n('cz'),st=n('strong'),stt=n('strongTotal'),even=n('even'),odd=n('odd'),coin=document.getElementById('coins').value,end=document.getElementById('ending').value,voice=document.getElementById('voice').value;let s=[0,0,0,0,0,0];for(let i=0;i<6;i++){let score=0;if(g>0){const pa=Math.exp(-g/atRate[i])*Math.pow(g/atRate[i],at)/Math.max(1,fact(at));const pc=Math.exp(-g/czRate[i])*Math.pow(g/czRate[i],cz)/Math.max(1,fact(cz));score+=Math.log(Math.max(pa,1e-12))+Math.log(Math.max(pc,1e-12));}if(stt>0){const p=strongRate[i];score+=st*Math.log(p)+(stt-st)*Math.log(1-p)}if(even>0||odd>0){const total=even+odd;const pe=[.46,.54,.46,.54,.46,.54][i];score+=even*Math.log(pe)+odd*Math.log(1-pe)}s[i]=score}let max=Math.max(...s);let p=s.map(x=>Math.exp(x-max));const min=Number(coin);const ev=Number(end),vo=Number(voice);for(let i=0;i<6;i++){if(min===2||min===20||min===24&&![1,3,5].includes(i)){}if(min===2||min===20)p[i]*=(i>=1?1:0.001);if(min===4||min===40)p[i]*=(i>=3?1:0.001);if(min===6||min===60)p[i]*=(i===5?1:0.001);if(ev===2)p[i]*=(i>=1?1:0.001);if(ev===4)p[i]*=(i>=3?1:0.001);if(ev===6)p[i]*=(i===5?1:0.001);if(ev===135)p[i]*=([0,2,4].includes(i)?1.5:.6);if(ev===246)p[i]*=([1,3,5].includes(i)?1.5:.6);if(vo>=2&&i===vo-1)p[i]*=0.001}let total=p.reduce((a,b)=>a+b,0)||1;p=p.map(x=>x/total*100);let best=p.indexOf(Math.max(...p));document.getElementById('prediction').textContent='設定'+(best+1)+'が最有力（'+p[best].toFixed(1)+'%）';document.getElementById('bars').innerHTML=p.map((x,i)=>'<div class="row"><span>設定'+(i+1)+'</span><b>'+x.toFixed(1)+'%</b></div><div class="bar"><div class="fill" style="width:'+x+'%"></div></div>').join('');document.getElementById('explain').textContent='AT初当り・CZ初当り・強チェリー契機、AT開始ステージ、獲得枚数表示、終了画面、ボイスを総合して候補を絞っています。'}function fact(x){let r=1;for(let i=2;i<=x;i++)r*=i;if(r>1e100)return 1e100;return r}</script></body></html>
