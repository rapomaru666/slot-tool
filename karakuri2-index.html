<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lパチスロ からくりサーカス2｜設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;line-height:1.7;background:#f6f6f6;color:#222}.app{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0001}h1{font-size:1.35rem}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}button,select,input{font:inherit;box-sizing:border-box}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.counter{display:flex;align-items:center;gap:8px}.counter button{width:48px;font-size:1.2rem}.counter span{min-width:55px;text-align:center;font-weight:700}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{background:#f1f1f1;border:1px solid #ccc}.choice.on{background:#222;color:#fff}.judge{width:100%;background:#111;color:#fff;font-weight:700}.reset{width:100%;margin-top:8px;background:#eee}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0}.bar{height:10px;background:#ddd;border-radius:99px;overflow:hidden}.fill{height:100%;background:#333}.note{font-size:.82rem;color:#666}input{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}</style></head><body><main class="app"><h1>🎪 Lパチスロ からくりサーカス2<br>設定判別ツール</h1><section class="card"><h2>① 通常時データ</h2><label>総ゲーム数</label><input id="games" type="number" min="0" placeholder="例：3000"><div class="counter"><b>AT初当り</b><button onclick="chg('at',-1)">−</button><span id="at">0</span><button onclick="chg('at',1)">＋</button></div><div class="counter"><b>CZ初当り</b><button onclick="chg('cz',-1)">−</button><span id="cz">0</span><button onclick="chg('cz',1)">＋</button></div></section><section class="card"><h2>② 設定示唆</h2><p>AT終了画面</p><div class="choices" id="ending"><button class="choice" data-v="0">しろがね</button><button class="choice" data-v="1">最古の四人</button><button class="choice" data-v="2">ルシール＆アンジェリーナ</button><button class="choice" data-v="3">歯車</button><button class="choice" data-v="4">鳴海＆勝</button><button class="choice" data-v="5">しろがね（笑顔）</button></div><p>AT開始ステージ</p><div class="choices" id="stage"><button class="choice" data-v="0">未確認</button><button class="choice" data-v="1">勝</button><button class="choice" data-v="2">鳴海</button></div><p>踊れ！オリンピア 枚数表示</p><div class="choices" id="coins"><button class="choice" data-v="0">未確認</button><button class="choice" data-v="2">＋20</button><button class="choice" data-v="4">＋4</button><button class="choice" data-v="6">＋6</button></div><p>エンディング中 上部パネル</p><div class="choices" id="panel"><button class="choice" data-v="0">未確認</button><button class="choice" data-v="2">設定2以上示唆</button><button class="choice" data-v="4">設定4以上示唆</button><button class="choice" data-v="6">設定6示唆</button></div></section><section class="card"><button class="judge" onclick="judge()">設定を判別する</button><button class="reset" onclick="location.reload()">リセット</button></section><section class="card"><h2>設定予測</h2><div id="prediction">データを入力して判別してください</div><div id="bars"></div><p class="note">※公開解析情報をもとにした参考値です。設定を断定するものではありません。</p></section></main><script>const s={ending:0,stage:0,coins:0,panel:0};function chg(k,d){const e=document.getElementById(k);e.textContent=Math.max(0,+e.textContent+d)}document.querySelectorAll('.choices').forEach(g=>g.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{g.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');s[g.id]=+b.dataset.v}));function judge(){const g=+document.getElementById('games').value||0,at=+document.getElementById('at').textContent,cz=+document.getElementById('cz').textContent;const ar=[519,504,474,458,430,410],cr=[342,341,339,339,327,318];let p=ar.map((r,i)=>{let x=0;if(g){x-=Math.abs((at?g/at:r)-r)/r*8;x-=Math.abs((cz?g/cz:cr[i])-cr[i])/cr[i]*3}if(s.coins===2&&i===0)x-=50;if(s.coins===4&&i<3)x-=50;if(s.coins===6&&i<5)x-=50;if(s.panel===2&&i===0)x-=50;if(s.panel===4&&i<3)x-=50;if(s.panel===6&&i<5)x-=50;if(s.ending===3&&i===0)x-=50;if(s.ending===4&&i<3)x-=50;if(s.ending===5&&i<5)x-=50;if(s.ending===1&&i%2===1)x+=1;if(s.ending===2&&i%2===0)x+=1;return Math.exp(x)});let t=p.reduce((a,b)=>a+b,0);p=p.map(x=>x/t*100);let best=p.indexOf(Math.max(...p));document.getElementById('prediction').innerHTML='<b>設定'+(best+1)+'が最有力</b>';document.getElementById('bars').innerHTML=p.map((x,i)=>'<div class="row"><span>設定'+(i+1)+'</span><b>'+x.toFixed(1)+'%</b></div><div class="bar"><div class="fill" style="width:'+x+'%"></div></div>').join('')}</script></body></html>
