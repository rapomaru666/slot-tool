<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ネオアイムジャグラーEX 設定判別ツール</title><main style="max-width:720px;margin:auto;padding:16px;font-family:system-ui"><h1>ネオアイムジャグラーEX</h1><label>総ゲーム数 <input id=g type=number></label><p>BIG <button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button>　REG <button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></p><p>合算確率とREG確率、設定示唆要素を総合して判別します。</p><button onclick="j()">設定を判別する</button><button onclick="r()">リセット</button><p id=o>判定結果：</p></main><script>let x=[0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=g.value?'G数 '+g.value+'G／BIG '+x[0]+'／REG '+x[1]+' を判別材料として整理しました。':'総ゲーム数を入力してください'}function r(){x=[0,0];v0.textContent=v1.textContent=0;g.value='';o.textContent='判定結果：'}</script></html>
