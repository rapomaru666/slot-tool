<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パチスロなめ猫 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f5f6f8}.card{background:#fff;padding:18px;margin:12px 0;border-radius:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}input,button{padding:10px;border:1px solid #ccc;border-radius:8px}button{font-weight:700}.result{font-weight:700}</style></head><body><div class="card"><h1>パチスロなめ猫</h1><p>設定判別ツール</p></div><div class="card"><label>総ゲーム数 <input id="g" type="number" min="0" value="0"></label><div class="row">ボーナス初当り <input id="a" type="number" min="0" value="0"></div><div class="row">CZ・AT関連回数 <input id="c" type="number" min="0" value="0"></div><div class="row">設定示唆確認数 <input id="s" type="number" min="0" value="0"></div><button onclick="j()">判別する</button> <button onclick="x()">リセット</button><p id="o" class="result">判定結果：入力待ち</p></div><div class="card"><h2>判定材料</h2><p>初当り、CZ・AT関連、設定示唆などを入力し、実測値を確認します。</p></div><script>function j(){let g=+document.querySelector('#g').value||0,a=+document.querySelector('#a').value||0,c=+document.querySelector('#c').value||0,s=+document.querySelector('#s').value||0;if(!g){o.textContent='判定結果：総ゲーム数を入力してください';return}o.textContent='判定結果：初当り '+(a?'1/'+(g/a).toFixed(1):'未入力')+' / CZ・AT '+c+'回 / 設定示唆 '+s+'件。';}function x(){document.querySelectorAll('input').forEach(e=>e.value=0);o.textContent='判定結果：入力待ち'}</script></body></html>
