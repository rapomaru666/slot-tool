<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アレックス ブライト 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}input,button{padding:9px;border:1px solid #ddd;border-radius:8px}.n{color:#666}</style><main><section class=c><h1>アレックス ブライト</h1><p class=n>羽・REG・チェリー・BIG・REG終了画面を中心に設定を推測</p></section><section class=c><label>総回転数 <input id=g type=number min=0></label><div class=r>羽A/B合算 <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>REG <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>チェリー合算 <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><div class=r>BIG <span><button onclick="a(3,-1)">−</button><b id=v3>0</b><button onclick="a(3,1)">＋</button></span></div><button onclick="j()">設定を判別する</button><button onclick="r()">リセット</button><p id=o></p></section><section class=c><h2>設定差</h2><p>設定1/2/5/6の4段階。羽は設定1 1/13.40、2 1/13.00、5 1/12.60、6 1/12.20。REGは1/428.30→1/312.10、チェリー合算は1/21.10→1/19.70。REG終了画面のアレックス(鳥)は設定6期待度アップ。</p></section></main><script>let x=[0,0,0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=(+g.value||0)?'羽・REG・チェリー・BIGと終了画面を総合して判別します。':'総回転数を入力してください'}function r(){x=[0,0,0,0];for(let i=0;i<4;i++)document.getElementById('v'+i).textContent=0;g.value='';o.textContent=''}</script></html>
