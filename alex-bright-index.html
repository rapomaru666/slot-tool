<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アレックス ブライト｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}button{border:0;border-radius:9px;padding:9px 13px;font-weight:700}.wide{width:100%;margin-top:9px}input{width:100%;box-sizing:border-box;padding:10px;margin-top:6px}</style></head><body><main class="app"><section class="card"><h1>アレックス ブライト</h1><p>機種別設定判別ツール。入力した実績を設定判別材料として整理します。</p></section><section class="card"><label>総ゲーム数<input id="g" type="number" min="0"></label><div class="row">BIG回数<span><button onclick="add(0,-1)">−</button><b id="v0">0</b><button onclick="add(0,1)">＋</button></span></div><div class="row">REG回数<span><button onclick="add(1,-1)">−</button><b id="v1">0</b><button onclick="add(1,1)">＋</button></span></div><div class="row">設定示唆回数<span><button onclick="add(2,-1)">−</button><b id="v2">0</b><button onclick="add(2,1)">＋</button></span></div><button class="wide" onclick="judge()">設定を判別する</button><button class="wide" onclick="resetAll()">リセット</button><p id="o">判定結果：</p></section><section class="card"><h2>各種判定材料</h2><p>公表値・実機で確認できる設定差を入力します。未確認の数値や示唆は推測で追加しません。</p></section></main><script>let v=[0,0,0];function add(i,n){v[i]=Math.max(0,v[i]+n);document.getElementById('v'+i).textContent=v[i]}function judge(){let g=Number(document.getElementById('g').value||0);document.getElementById('o').textContent=g?'判定対象 '+g+'G。入力した判定材料を確認してください。':'総ゲーム数を入力してください。'}function resetAll(){v=[0,0,0];document.getElementById('g').value='';[0,1,2].forEach(i=>document.getElementById('v'+i).textContent=0);document.getElementById('o').textContent='判定結果：'}</script></body></html>
