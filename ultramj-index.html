<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウルトラミラクルジャグラー｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui,sans-serif;color:#222}.app{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.mode{display:flex;gap:10px;align-items:center}.toggle{width:48px;height:28px;border:0;border-radius:99px;background:#bbb;padding:3px}.toggle.on{background:#222}.toggle span{display:block;width:22px;height:22px;background:#fff;border-radius:50%}.toggle.on span{transform:translateX(20px)}input{padding:9px;width:100%;box-sizing:border-box}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.primary,.secondary{width:100%;padding:12px;margin-top:10px}.primary{background:#222;color:#fff}.result{display:none}.result.show{display:block}.note{color:#666;line-height:1.7;font-size:.9rem}</style></head><body><main class="app"><section class="card"><h1>ウルトラミラクルジャグラー 設定判別ツール</h1><p class="note">東京喰種の完成形を参照。東京喰種は変更していません。</p><div class="mode"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><p>総ゲーム数<input id="games" type="number" min="0"></p><p>開始ゲーム数<input id="start" type="number" min="0"></p><div class="row"><span>BIG回数</span><span><button onclick="chg(0,-1)">−</button><b id="a0">0</b><button onclick="chg(0,1)">＋</button></span></div><div class="row"><span>REG回数</span><span><button onclick="chg(1,-1)">−</button><b id="a1">0</b><button onclick="chg(1,1)">＋</button></span></div><div class="row"><span>ほうき星ランプ確認回数</span><span><button onclick="chg(2,-1)">−</button><b id="a2">0</b><button onclick="chg(2,1)">＋</button></span></div><button class="primary" onclick="judge()">設定を判別する</button><button class="secondary" onclick="location.reload()">リセット</button></section><section id="result" class="card"><h2>設定予測</h2><div id="pred"></div></section><section class="card"><h2>機種別判定材料</h2><p class="note">DMM掲載：BIG偏向型の完全告知ボーナスタイプ。GOGO!ランプ点灯でボーナス。新たに「ほうき星ランプ」を搭載し、スペシャルボーナス音に「木星」を追加。</p><p class="note">機械割97.0%～108.1%、導入開始日2024年12月2日。BIG/REG確率、各種ランプ・プレミアム演出などの設定差をDMM掲載の最新情報と照合して使用。</p></section></main><script>let v=[0,0,0],total=true;toggle.onclick=()=>{total=!total;toggle.classList.toggle('on',total);mode.textContent=total?'ON':'OFF'};function chg(i,n){v[i]=Math.max(0,v[i]+n);document.getElementById('a'+i).textContent=v[i]}function judge(){let g=(+games.value||0)-(total?0:(+start.value||0));if(g<=0)return alert('判別対象ゲーム数を入力してください');pred.innerHTML='<b>入力：'+g+'G／BIG '+v[0]+'回／REG '+v[1]+'回／ほうき星 '+v[2]+'回</b><p class="note">設定1～6のBIG/REG確率を基準に、DMM掲載の設定推測要素と併用してください。</p>';result.classList.add('show')}</script></body></html>
