<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>L 東京喰種 設定判別ツール</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}#celebration{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);pointer-events:none}#celebration img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}</style></head><body><iframe id="outer" src="tokyoghoul-portal-index.html" title="L 東京喰種 設定判別ツール"></iframe><div id="celebration"><img id="celebration-img" alt="設定6 おめでとうございます"></div><script>(function(){const outer=document.getElementById('outer'),celebrate=document.getElementById('celebration'),img=document.getElementById('celebration-img');function hook(){try{const od=outer.contentDocument;if(!od)return;const inner=od.getElementById('tool');if(!inner)return;function innerHook(){try{const d=inner.contentDocument;if(!d)return;const b=d.getElementById('judge-btn');if(!b||b.dataset.portalFixHooked)return;b.dataset.portalFixHooked='1';const source=od.querySelector('#celebration img');if(source&&source.src)img.src=source.src;b.addEventListener('click',function(){setTimeout(function(){const p=(d.getElementById('prediction-text')?.textContent||'');const six=d.querySelector('button.selected[data-min="6"]');if(six||/設定6/.test(p)){celebrate.style.display='flex';setTimeout(()=>celebrate.style.display='none',2000)}},100)},false)}catch(e){}}inner.addEventListener('load',innerHook);innerHook()}catch(e){}}outer.addEventListener('load',hook);hook();setInterval(hook,500)})();</script></body></html>
