<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマート沖スロ ダークハイビ｜設定判別ツール</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.app{width:min(100%,980px);margin:auto;padding:18px 12px 40px}.header{text-align:center;margin-bottom:18px}.header h1{margin:0;font-size:clamp(22px,5vw,32px);font-weight:800}.header p{margin:4px 0;color:#6b7280;font-size:12px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}h2{font-size:20px;margin:0 0 14px}.games{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-bottom:16px}.games input{height:48px;border:1px solid #d1d5db;border-radius:10px;padding:0 14px;font-size:17px}.grid{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 180px;align-items:center;gap:14px}.row>span{font-weight:700}.counter{width:180px;height:46px;display:grid;grid-template-columns:48px 1fr 48px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden}.counter button{border:0;background:#e5e7eb;font-size:22px;font-weight:800}.counter span{display:flex;align-items:center;justify-content:center;font-weight:700}.act{display:grid;gap:10px;margin-bottom:14px}button{font-family:inherit}.judge,.reset{height:52px;border:0;border-radius:12px;font-size:17px;font-weight:800}.judge{background:#111827;color:#fff}.reset{background:#e5e7eb}.result{display:none}.result.show{display:block}.pred{font-size:22px;font-weight:800;margin-bottom:18px}.gr{display:grid;grid-template-columns:55px 1fr 48px;gap:8px;align-items:center;margin-bottom:12px}.bg{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:#111827}.pct{text-align:right;font-size:14px;font-weight:700}.notice{color:#6b7280;font-size:12px;line-height:1.6}footer{text-align:center;color:#9ca3af;font-size:12px}@media(max-width:700px){.app{padding:10px 8px 28px}.card{padding:14px 12px}.games{grid-template-columns:1fr;gap:6px}.row{grid-template-columns:1fr 160px}.counter{width:160px;grid-template-columns:44px 1fr 44px}.gr{grid-template-columns:45px 1fr 42px}}</style></head><body><main class="app"><header class="header"><h1>スマート沖スロ ダークハイビ</h1><p>設定判別ツール</p></header><section class="card"><div class="games"><b>総ゲーム数</b><input id="g" type="number" min="1" inputmode="numeric" placeholder="数字を入力"></div><div class="grid"><div class="row"><span>初当り</span><div class="counter"><button onclick="c('first',-1)">−</button><span id="first">0</span><button onclick="c('first',1)">＋</button></div></div><div class="row"><span>BIG</span><div class="counter"><button onclick="c('bb',-1)">−</button><span id="bb">0</span><button onclick="c('bb',1)">＋</button></div></div><div class="row"><span>REG</span><div class="counter"><button onclick="c('rb',-1)">−</button><span id="rb">0</span><button onclick="c('rb',1)">＋</button></div></div></div></section><section class="card"><h2>設定示唆</h2><div class="grid"><div class="row"><span>フェザーランプ 紫（設定4以上濃厚）</span><div class="counter"><button onclick="c('s4',-1)">−</button><span id="s4">0</span><button onclick="c('s4',1)">＋</button></div></div><div class="row"><span>フェザーランプ 虹（設定6濃厚）</span><div class="counter"><button onclick="c('s6',-1)">−</button><span id="s6">0</span><button onclick="c('s6',1)">＋</button></div></div><div class="row"><span>「蛍の光」（設定6濃厚）</span><div class="counter"><button onclick="c('h6',-1)">−</button><span id="h6">0</span><button onclick="c('h6',1)">＋</button></div></div></div></section><section class="act"><button class="judge" onclick="judge()">設定を判別する</button><button class="reset" onclick="location.reload()">リセット</button></section><section id="res" class="card result"><h2>設定予測</h2><div id="pred" class="pred">-</div><div id="graph"></div><p class="notice">※本機は設定1・2・4・5・6の5段階です。公開されている確率をもとにした参考値です。</p></section><footer>スマート沖スロ ダークハイビ 設定判別ツール</footer></main><script>const r=[{f:275.9,b:243,r:320.4},{f:264.8,b:233.1,r:307.9},{f:248.5,b:218.1,r:289.7},{f:234.5,b:199.5,r:270},{f:228.3,b:187.1,r:259.1}],names=[1,2,4,5,6];let d={first:0,bb:0,rb:0,s4:0,s6:0,h6:0};function c(k,n){d[k]=Math.max(0,d[k]+n);document.getElementById(k).textContent=d[k]}function judge(){let G=+document.getElementById('g').value||0;if(!G){alert('総ゲーム数を入力してください');return}let p=r.map(x=>Math.exp(-G/x.f)*(G/x.f)**d.first*Math.exp(-G/x.b)*(G/x.b)**d.bb*Math.exp(-G/x.r)*(G/x.r)**d.rb);let min=1;if(d.s4)min=4;if(d.s6||d.h6)min=6;p=p.map((x,i)=>names[i]<min?0:x);let sum=p.reduce((a,x)=>a+x,0)||1;p=p.map(x=>x/sum*100);let m=p.indexOf(Math.max(...p));document.getElementById('pred').textContent='最有力：設定'+names[m];document.getElementById('graph').innerHTML=p.map((x,i)=>`<div class="gr"><b>設定${names[i]}</b><div class="bg"><div class="bar" style="width:${x.toFixed(1)}%"></div></div><span class="pct">${x.toFixed(1)}%</span></div>`).join('');document.getElementById('res').classList.add('show')}</script></body></html>
