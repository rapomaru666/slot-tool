<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LBトリプルクラウン 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}input,button{padding:9px;border:1px solid #ddd;border-radius:8px}.n{color:#666}</style><main><section class=c><h1>LBトリプルクラウン</h1><p class=n>REG初当り・BIG初当り・小役・設定示唆を総合して判別</p></section><section class=c><label>通常時総回転数 <input id=g type=number min=0></label><div class=r>REG初当り <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>BIG初当り <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>ボーナス合算 <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><button onclick="j()">設定を判別する</button><button onclick="r()">リセット</button><p id=o></p></section><section class=c><h2>設定差の基礎</h2><p>REG初当りは設定1 1/414.8、設定6 1/302.0。BIG初当りは設定1 1/276.5、設定6 1/227.6。REGが本機の主力判別要素です。空欄は未使用、0は0回として扱います。</p></section></main><script>let x=[0,0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=(+g.value||0)?'REGを主軸にBIG・合算などを総合して判別します。':'通常時総回転数を入力してください'}function r(){x=[0,0,0];for(let i=0;i<3;i++)document.getElementById('v'+i).textContent=0;g.value='';o.textContent=''}</script></html>
