<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ バイオハザード RE:3｜設定判別ツール</title><link rel="stylesheet" href="machine-tool-style.css"></head><body><main class="app"><header class="card header"><h1>スマスロ バイオハザード RE:3</h1><p>設定判別ツール</p></header><section class="card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0"></label><label>開始ゲーム数<input id="start" type="number" min="0"></label></div><div id="metrics"></div><button id="judge" class="primary">設定判別</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><div id="materials"></div></section></main><script>window.MACHINE_CONFIG={metrics:[{name:'AT初当り',rates:[null,null,null,null,null,null]},{name:'CZ初当り',rates:[null,null,null,null,null,null]}],materials:[{title:'設定示唆・終了画面',options:['確認なし','設定示唆を確認','高設定示唆を確認','確定系を確認'],note:'数値の未公表部分は判別計算に加算せず、確認した示唆を記録する構成です。'}]};</script><script src="machine-tool.js"></script></body></html>
