<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L 東京喰種 設定判別ツール</title>
  <link rel="stylesheet" href="tokyoghoul-style.css">
</head>
<body>
<main class="app">
  <header class="header"><h1>L 東京喰種 設定判別ツール</h1><p>V1.0</p></header>
  <section class="card input-card"><div class="games-row"><label for="games">総ゲーム数</label><input id="games" type="number" min="1" inputmode="numeric" placeholder="数字を入力"></div><div class="bonus-grid">
<div class="bonus-row important"><span>レミニセンス</span><div class="counter"><button type="button" class="counter-btn minus" data-target="reminiscence">−</button><span id="reminiscence-value">0</span><button type="button" class="counter-btn plus" data-target="reminiscence">＋</button></div></div>
<div class="bonus-row important"><span>大喰いの利世</span><div class="counter"><button type="button" class="counter-btn minus" data-target="rize">−</button><span id="rize-value">0</span><button type="button" class="counter-btn plus" data-target="rize">＋</button></div></div>
<div class="bonus-row"><span>AT初当り</span><div class="counter"><button type="button" class="counter-btn minus" data-target="at">−</button><span id="at-value">0</span><button type="button" class="counter-btn plus" data-target="at">＋</button></div></div>
<div class="bonus-row"><span>EP BONUS</span><div class="counter"><button type="button" class="counter-btn minus" data-target="episode">−</button><span id="episode-value">0</span><button type="button" class="counter-btn plus" data-target="episode">＋</button></div></div>
<div class="bonus-row"><span>AT直撃</span><div class="counter"><button type="button" class="counter-btn minus" data-target="direct">−</button><span id="direct-value">0</span><button type="button" class="counter-btn plus" data-target="direct">＋</button></div></div>
<div class="bonus-row"><span>下段リプレイ</span><div class="counter"><button type="button" class="counter-btn minus" data-target="lowerReplay">−</button><span id="lowerReplay-value">0</span><button type="button" class="counter-btn plus" data-target="lowerReplay">＋</button></div></div>
</div></section>
<section class="card hint-section"><h2>特定挙動</h2><div class="rate-list">
<div class="rate-block"><div class="rate-title">100G以内CZ</div><div class="rate-note">対象回数 / 当選回数</div><div class="rate-counters"><div class="rate-counter"><span>対象</span><div class="counter"><button type="button" class="counter-btn minus" data-target="within100Trials">−</button><span id="within100Trials-value">0</span><button type="button" class="counter-btn plus" data-target="within100Trials">＋</button></div></div><div class="rate-counter"><span>当選</span><div class="counter"><button type="button" class="counter-btn minus" data-target="within100Hits">−</button><span id="within100Hits-value">0</span><button type="button" class="counter-btn plus" data-target="within100Hits">＋</button></div></div></div></div>
<div class="rate-block"><div class="rate-title">AT引き戻し</div><div class="rate-note">AT終了回数 / 引き戻し回数</div><div class="rate-counters"><div class="rate-counter"><span>対象</span><div class="counter"><button type="button" class="counter-btn minus" data-target="pullbackTrials">−</button><span id="pullbackTrials-value">0</span><button type="button" class="counter-btn plus" data-target="pullbackTrials">＋</button></div></div><div class="rate-counter"><span>当選</span><div class="counter"><button type="button" class="counter-btn minus" data-target="pullbackHits">−</button><span id="pullbackHits-value">0</span><button type="button" class="counter-btn plus" data-target="pullbackHits">＋</button></div></div></div></div>
<div class="rate-block"><div class="rate-title">裏AT</div><div class="rate-note">AT初当り回数 / 裏AT回数</div><div class="rate-counters"><div class="rate-counter"><span>対象</span><div class="counter"><button type="button" class="counter-btn minus" data-target="uraTrials">−</button><span id="uraTrials-value">0</span><button type="button" class="counter-btn plus" data-target="uraTrials">＋</button></div></div><div class="rate-counter"><span>当選</span><div class="counter"><button type="button" class="counter-btn minus" data-target="uraHits">−</button><span id="uraHits-value">0</span><button type="button" class="counter-btn plus" data-target="uraHits">＋</button></div></div></div></div>
</div></section>
<section class="action-area"><button id="judge-btn" class="judge-btn">設定を判別する</button><button id="reset-btn" class="reset-btn">リセット</button></section>
<section id="result-section" class="card result-card"><h2>設定予測</h2><div class="prediction" id="prediction-text">-</div><div class="graph"><div class="graph-row"><span class="setting-name">設定1</span><div class="bar-bg"><div id="setting-bar-1" class="bar"></div></div><span id="setting-percent-1" class="percent">0%</span></div><div class="graph-row"><span class="setting-name">設定2</span><div class="bar-bg"><div id="setting-bar-2" class="bar"></div></div><span id="setting-percent-2" class="percent">0%</span></div><div class="graph-row"><span class="setting-name">設定3</span><div class="bar-bg"><div id="setting-bar-3" class="bar"></div></div><span id="setting-percent-3" class="percent">0%</span></div><div class="graph-row"><span class="setting-name">設定4</span><div class="bar-bg"><div id="setting-bar-4" class="bar"></div></div><span id="setting-percent-4" class="percent">0%</span></div><div class="graph-row"><span class="setting-name">設定5</span><div class="bar-bg"><div id="setting-bar-5" class="bar"></div></div><span id="setting-percent-5" class="percent">0%</span></div><div class="graph-row"><span class="setting-name">設定6</span><div class="bar-bg"><div id="setting-bar-6" class="bar"></div></div><span id="setting-percent-6" class="percent">0%</span></div></div><p class="notice">※設定予測は入力された実戦データをもとにした参考値です。</p></section>
<footer>L 東京喰種 設定判別ツール V1.0</footer></main>
<script src="tokyoghoul-app.js"></script>
</body></html>
