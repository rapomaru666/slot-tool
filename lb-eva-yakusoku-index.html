<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LBパチスロ ヱヴァンゲリヲン ～約束の扉～ 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}input,button{padding:9px;border:1px solid #ddd;border-radius:8px}.n{color:#666}</style><main><section class=c><h1>LBパチスロ ヱヴァンゲリヲン ～約束の扉～</h1><p class=n>ボーナス確率・小役・終了画面・REG中キャラ・BT中ムービーを総合して設定を推測</p></section><section class=c><label>総回転数 <input id=g type=number min=0></label><div class=r>赤S-BIG <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>青S-BIG <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>BIG <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><div class=r>REG <span><button onclick="a(3,-1)">−</button><b id=v3>0</b><button onclick="a(3,1)">＋</button></span></div><button onclick="j()">設定を判別する</button><button onclick="r()">リセット</button><p id=o></p></section><section class=c><h2>設定差の基礎</h2><p>BB確率は設定1 1/300.6、設定2 1/290.0、設定3 1/281.3。ボーナス合算も設定1 1/196.8から高設定ほど上昇。ベルなどの小役、REG中キャラ紹介、ボーナス終了画面、BT中プレミアムムービーも判別材料。</p></section></main><script>let x=[0,0,0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=(+g.value||0)?'ボーナス確率・小役・設定示唆を総合して判別します。':'総回転数を入力してください'}function r(){x=[0,0,0,0];for(let i=0;i<4;i++)document.getElementById('v'+i).textContent=0;g.value='';o.textContent=''}</script></html>
