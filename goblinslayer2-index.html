<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ ゴブリンスレイヤーII｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:18px}.header,.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d;margin-bottom:14px}.header h1{font-size:1.35rem;margin:0}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.games input{width:120px;padding:10px;border:1px solid #ddd;border-radius:8px}.counter{display:flex;align-items:center;gap:10px}.counter button,.primary,.secondary{border:0;border-radius:9px;padding:10px 16px;font-weight:700}.counter button{background:#eee;font-size:1.2rem}.counter b{min-width:28px;text-align:center}.primary{width:100%;background:#222;color:#fff;margin-top:14px}.secondary{width:100%;margin-top:8px;background:#eee}.result{display:none}.result.visible{display:block}.barrow{display:grid;grid-template-columns:55px 1fr 48px;gap:8px;align-items:center;margin:9px 0}.bg{height:12px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:#222}.pred{font-size:1.15rem;font-weight:700;margin-bottom:12px}</style></head><body><main class="app"><header class="header"><h1>スマスロ ゴブリンスレイヤーII</h1><p>設定判別ツール</p></header><section class="card"><div class="row games"><span>総ゲーム数</span><input id="g" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="row"><span>AT初当たり</span><div class="counter"><button onclick="add(-1)">−</button><b id="at">0</b><button onclick="add(1)">＋</button></div></div><button class="primary" onclick="judge()">設定判別</button><button class="secondary" onclick="resetAll()">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section></main><script>const rates=[541.6,526.4,506.4,453.2,417.8,402.4];let at=0;function add(d){at=Math.max(0,at+d);document.getElementById('at').textContent=at}function sc(g,c,r){if(!g||!c)return 0;let l=g/r;return c*Math.log(l)-l}function judge(){let g=+document.getElementById('g').value||0;if(!g)return alert('総ゲーム数を入力してください。');let x=rates.map(r=>sc(g,at,r)),m=Math.max(...x),w=x.map(v=>Math.exp(v-m)),t=w.reduce((a,b)=>a+b,0),p=w.map(v=>v/t*100),best=p.indexOf(Math.max(...p))+1;document.getElementById('pred').textContent='推定設定：設定'+best;document.getElementById('bars').innerHTML=p.map((v,i)=>`<div class="barrow"><span>設定${i+1}</span><div class="bg"><div class="bar" style="width:${v}%"></div></div><b>${Math.round(v)}%</b></div>`).join('');document.getElementById('result').classList.add('visible')}function resetAll(){at=0;document.getElementById('at').textContent='0';document.getElementById('g').value='';document.getElementById('result').classList.remove('visible')}</script></body></html>
