<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LBトリプルクラウンセブン｜設定判別ツール</title><style>*{box-sizing:border-box}body{margin:0;background:#050914;color:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:14px 10px 34px}.card{background:#0c1220;border:1px solid #293246;border-radius:16px;padding:15px;margin-bottom:12px}.header{background:linear-gradient(145deg,#21162a,#0c1220)}h1{font-size:clamp(21px,5.5vw,30px);margin:0;white-space:nowrap}.sub{color:#aeb5c2;font-size:12px;margin-top:5px}.mode{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:12px}.toggle{width:52px;height:29px;border:0;border-radius:20px;background:#596274;padding:3px}.toggle i{display:block;width:23px;height:23px;border-radius:50%;background:#fff}.toggle.on{background:#ff3153}.toggle.on i{transform:translateX(23px)}.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}.games label{font-size:12px;font-weight:800}.games input,.num{width:100%;height:44px;margin-top:5px;border:1px solid #3a455b;border-radius:10px;background:#080d17;color:#fff;padding:0 10px;font-size:16px}.row{display:grid;grid-template-columns:1fr 155px;gap:10px;align-items:center;border-top:1px solid #252d3d;padding:10px 0}.row span{font-size:13px;font-weight:700}.counter{height:42px;display:grid;grid-template-columns:40px 1fr 40px;border:1px solid #3a455b;border-radius:9px;overflow:hidden}.counter button{border:0;background:#202838;color:#fff;font-size:20px}.counter b{display:flex;align-items:center;justify-content:center}.btn{width:100%;height:48px;border:0;border-radius:10px;background:#ff3153;color:#fff;font-weight:900;font-size:15px;margin-top:10px}.reset{background:#202838}.result{display:none}.result.show{display:block}.prediction{font-size:20px;font-weight:900;margin-bottom:10px}.barrow{display:grid;grid-template-columns:42px 1fr 55px;gap:7px;align-items:center;margin:8px 0}.bg{height:14px;background:#202838;border-radius:99px;overflow:hidden}.bar{height:100%;background:#ff3153}.material{border-top:1px solid #252d3d;padding:11px 0}.material:first-child{border-top:0}.material summary{font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.grid button{min-height:48px;border:1px solid #3a455b;border-radius:9px;background:#101827;color:#fff;font-weight:700}.grid button.selected{border-color:#ff3153;background:#2a1320}.note{color:#aeb5c2;font-size:11px;line-height:1.6}@media(max-width:430px){.row{grid-template-columns:1fr 140px}.counter{grid-template-columns:36px 1fr 36px}}</style></head><body><main class="app"><section class="card header"><h1>LBトリプルクラウンセブン</h1><div class="sub">設定判別ツール｜2026年4月導入</div></section><section class="card"><div class="mode">総ゲーム数で判別 <button id="toggle" class="toggle on"><i></i></button><b id="ml">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0" inputmode="numeric"></label><label>開始ゲーム数<input id="start" type="number" min="0" inputmode="numeric"></label></div><div class="row"><span>BIG回数</span><div class="counter"><button onclick="add('big',-1)">−</button><b id="big">0</b><button onclick="add('big',1)">＋</button></div></div><div class="row"><span>REG回数</span><div class="counter"><button onclick="add('reg',-1)">−</button><b id="reg">0</b><button onclick="add('reg',1)">＋</button></div></div><div class="row"><span>チェリー回数</span><div class="counter"><button onclick="add('cherry',-1)">−</button><b id="cherry">0</b><button onclick="add('cherry',1)">＋</button></div></div><div class="row"><span>プラム回数</span><div class="counter"><button onclick="add('plum',-1)">−</button><b id="plum">0</b><button onclick="add('plum',1)">＋</button></div></div><button class="btn" onclick="judge()">設定判別</button><button class="btn reset" onclick="resetAll()">リセット</button></section><section id="result" class="card result"><h2>設定予測</h2><div id="prediction" class="prediction">—</div><div id="bars"></div></section><section class="card"><h2>各種判定材料</h2><details class="material"><summary>BIG終了時</summary><div class="grid"><button data-min="2">クラウン＋下パネル<br><small>設定2以上濃厚</small></button><button data-min="5">バットランプ青<br><small>設定5以上濃厚</small></button><button data-min="6">虹Specialトロフィー<br><small>設定6濃厚</small></button><button data-min="3">クラウン点滅<br><small>高設定示唆</small></button></div></details><details class="material"><summary>REG終了時</summary><div class="grid"><button data-min="5">クラウン＋下パネル<br><small>設定5以上濃厚</small></button><button data-min="6">バットランプ青<br><small>設定6濃厚</small></button></div></details><details class="material"><summary>BT中MB入賞時 Specialトロフィー</summary><div class="grid"><button data-odd="1">下→上<br><small>奇数設定示唆</small></button><button data-even="1">上→下<br><small>偶数設定示唆</small></button></div></details><details class="material"><summary>100G以内連チャン時BGM</summary><div class="grid"><button data-min="3">BIG：琉球メドレー<br><small>高設定示唆</small></button><button data-even="1">REG：安里屋ユンタ<br><small>偶数設定示唆</small></button></div></details><p class="note">設定は1・2・5・6の4段階。BIG/REG、チェリー、プラムの設定差を数値判別の中心にし、確定・濃厚示唆は設定予測の補助として使用します。</p></section></main><script>const sets=[1,2,5,6],rate={big:[258,253,230,203.5],reg:[590.4,580,524.3,464.8],cherry:[49.88,48.33,46.12,43.26],plum:[64.63,62.95,59.8,55.54]},s={big:0,reg:0,cherry:0,plum:0};let total=true;function add(k,d){s[k]=Math.max(0,s[k]+d);document.getElementById(k).textContent=s[k]}function ll(g,c,r){return g&&c?c*Math.log(g/r)-g/r:0}function judge(){const a=+games.value||0,b=+start.value||0,g=total?a:Math.max(0,a-b);if(!g)return alert('判別対象ゲーム数を入力してください。');const x=sets.map((_,i)=>ll(g,s.big,rate.big[i])+ll(g,s.reg,rate.reg[i])+ll(g,s.cherry,rate.cherry[i])+ll(g,s.plum,rate.plum[i])),m=Math.max(...x),w=x.map(v=>Math.exp(v-m)),sum=w.reduce((a,b)=>a+b,0),p=w.map(v=>v/sum*100),best=p.indexOf(Math.max(...p));prediction.textContent=`推定設定：設定${sets[best]}（${g}G）`;bars.innerHTML=p.map((v,i)=>`<div class="barrow"><span>設定${sets[i]}</span><div class="bg"><div class="bar" style="width:${v}%"></div></div><b>${v.toFixed(1)}%</b></div>`).join('');result.classList.add('show')}function resetAll(){Object.keys(s).forEach(k=>{s[k]=0;document.getElementById(k).textContent='0'});games.value='';start.value='';result.classList.remove('show')}toggle.onclick=()=>{total=!total;toggle.classList.toggle('on',total);ml.textContent=total?'ON':'OFF'};document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});</script></body></html>
