<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S Lucky海物語｜設定判別</title><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}button{padding:9px 13px;border:0;border-radius:8px;font-weight:700}.row{padding:9px 0;border-bottom:1px solid #eee}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:center}</style></head><body><main><h1>S Lucky海物語｜設定判別</h1><section><h2>ボーナス確率</h2><label>ゲーム数<input id="g" type="number" min="0"></label><label>ボーナス回数<input id="a" type="number" min="0"></label><button onclick="j()">判別する</button> <button onclick="z()">リセット</button><pre id="r">判定結果：</pre></section><section><table><tr><th>設定</th><th>BIG</th><th>REG</th><th>合算</th></tr><tr><td>1</td><td>1/284.9</td><td>1/420.1</td><td>1/169.8</td></tr><tr><td>2</td><td>1/292.6</td><td>1/344.9</td><td>1/158.3</td></tr><tr><td>3</td><td>1/273.1</td><td>1/404.5</td><td>1/163.0</td></tr><tr><td>4</td><td>1/280.1</td><td>1/292.6</td><td>1/143.1</td></tr><tr><td>5</td><td>1/246.4</td><td>1/318.1</td><td>1/138.8</td></tr><tr><td>6</td><td>1/246.4</td><td>1/250.1</td><td>1/124.1</td></tr></table></section><section><h2>設定示唆</h2><div class="row">REG中Lucky図柄停止後の色：青＝奇数示唆／黄＝偶数示唆／緑＝設定4以上期待度アップ／赤＝設定4以上／虹＝設定6濃厚</div><div class="row">BIG中ハズレ：設定4以上</div><div class="row">通常時はベル・チェリー・弱スイカ等に設定差あり。特にベルをカウント。</div></section></main><script>function j(){let g=+document.getElementById('g').value||0,a=+document.getElementById('a').value||0;if(!g||!a){r.textContent='判定結果：ゲーム数とボーナス回数を入力してください。';return}let x=g/a,v=[169.8,158.3,163,143.1,138.8,124.1],b=1,e=1e9;v.forEach((n,i)=>{let d=Math.abs(x-n);if(d<e){e=d;b=i+1}});r.textContent=`判定結果：実績1/${x.toFixed(1)}。単純近似では設定${b}付近（参考値）。REG色・BIG中ハズレ等の示唆を優先して総合判定してください。`}function z(){g.value=a.value='';r.textContent='判定結果：'}</script></body></html>
