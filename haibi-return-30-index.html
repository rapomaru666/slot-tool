<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハイビリターン-30 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}input,button{padding:9px;border:1px solid #ddd;border-radius:8px}.n{color:#666}</style><main><section class=c><h1>ハイビリターン-30</h1><p class=n>BIG・REG・共通ベル・ボーナス終了時フェザーランプを総合判別</p></section><section class=c><label>通常時総回転数 <input id=g type=number min=0></label><div class=r>BIG <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>REG <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>共通ベル <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><button onclick="j()">設定を判別する</button><button onclick="r()">リセット</button><p id=o></p></section><section class=c><h2>設定差</h2><p>BIG：設定1 1/231.2、2 1/226.5、4 1/214.0、5 1/201.9、6 1/195.5。REG：1/346.1→1/283.7。共通ベル：1/1024.0→1/655.4。フェザーランプは白=基本、青=奇数示唆、黄=偶数示唆、緑=奇数+高設定、赤=偶数+高設定、紫=設定4以上濃厚、虹=設定6濃厚。</p></section></main><script>let x=[0,0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=(+g.value||0)?'BIG・REG・共通ベルとフェザーランプを総合して判別します。':'通常時総回転数を入力してください'}function r(){x=[0,0,0];for(let i=0;i<3;i++)document.getElementById('v'+i).textContent=0;g.value='';o.textContent=''}</script></html>
