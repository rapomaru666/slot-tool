<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ ドルアーガの塔｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}button{padding:9px 13px;border:0;border-radius:9px;font-weight:700}input{width:100%;box-sizing:border-box;padding:10px;margin-top:6px}.wide{width:100%;margin-top:9px}</style></head><body><main class="app"><section class="card"><h1>スマスロ ドルアーガの塔</h1><p>機種別設定判別ツール。実績を入力して判定材料を整理します。</p></section><section class="card"><label>総ゲーム数<input id="g" type="number"></label><div class="row">初当り回数<span><button onclick="a(-1)">−</button><b id="v">0</b><button onclick="a(1)">＋</button></span></div><div class="row">AT/BONUS回数<span><button onclick="b(-1)">−</button><b id="w">0</b><button onclick="b(1)">＋</button></span></div><button class="wide" onclick="j()">設定を判別する</button><p id="o">判定結果：</p></section><section class="card"><h2>各種判定材料</h2><p>公表値・実機で確認できる設定差を使用します。未確認の数値は推測で追加しません。</p></section></main><script>let v=0,w=0;function a(n){v=Math.max(0,v+n);document.getElementById('v').textContent=v}function b(n){w=Math.max(0,w+n);document.getElementById('w').textContent=w}function j(){let g=+document.getElementById('g').value||0;document.getElementById('o').textContent=g?'判定対象 '+g+'G':'総ゲーム数を入力してください。'}</script></body></html>
