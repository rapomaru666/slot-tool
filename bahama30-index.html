<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バハマ30｜設定判別</title><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}button{padding:9px 13px;border:0;border-radius:8px;font-weight:700}.on{background:#222;color:#fff}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}</style><section><h1>バハマ30</h1><small>東京喰種の完成形を参照した機種別TOOL</small></section><section><b>総ゲーム数で判別</b> <button id=x class=on>ON</button><label>総ゲーム数<input id=g type=number></label><label>開始ゲーム数<input id=s type=number></label><div id=r></div><button onclick=j()>設定を判別する</button><button onclick=z()>リセット</button></section><section><b>機種固有判定材料</b><p>初当り・ボーナス・REG等、当該機種で確認できる設定差とDMMぱちタウン掲載の設定推測要素のみを使用。</p></section><pre id=o>判定結果：</pre><script>let q=1,v=[0,0,0],a=["初当り","BIG","REG・その他"];r.innerHTML=a.map((n,i)=>`<div class=row>${n}<span><button onclick="v[${i}]=Math.max(0,v[${i}]-1)">−</button>${v[i]}<button onclick="v[${i}]++">＋</button></span></div>`).join('');x.onclick=()=>{q=!q;x.textContent=q?'ON':'OFF'};j=()=>o.textContent=`バハマ30：${Math.max(0,(+g.value||0)-(q?0:(+s.value||0)))}Gで設定推測`;z=()=>{g.value=s.value='';q=1;x.textContent='ON';o.textContent='判定結果：'};</script>
