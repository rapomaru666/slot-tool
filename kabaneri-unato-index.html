<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ 甲鉄城のカバネリ 海門決戦｜設定判別ツール</title><link rel="stylesheet" href="machine-tool-style.css"></head><body><main class="app"><header class="card header"><h1>スマスロ 甲鉄城のカバネリ 海門決戦</h1><p>設定判別ツール</p></header><section class="card"><div class="mode-row"><span>総ゲーム数で判別</span><button id="toggle" class="toggle on"><span></span></button><b id="mode">ON</b></div><div class="games"><label>総ゲーム数<input id="games" type="number" min="0"></label><label>開始ゲーム数<input id="start" type="number" min="0"></label></div><div id="metrics"></div><button id="judge" class="primary">設定判別</button><button id="reset" class="secondary">リセット</button></section><section id="result" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card materials"><h2>各種判定材料</h2><div id="materials"></div></section></main><script>window.MACHINE_CONFIG={metrics:[{name:'ボーナス初当り',rates:[254.2,242.3,239.6,null,null,null]},{name:'ST初当り',rates:[422.5,405.9,398.7,null,null,null]},{name:'下段ベル',rates:[121.1,114.4,112.8,null,null,null]}],materials:[{title:'サミートロフィー',options:['銅：設定2以上','銀：設定3以上','金：設定4以上','キリン柄：設定5以上','虹：設定6濃厚']},{title:'終了画面・ボイス',options:['未確認','示唆あり'],note:'公表値が揃っていない設定の数値は判別計算から除外。'}]};</script><script src="machine-tool.js"></script></body></html>
