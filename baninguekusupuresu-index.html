<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バーニングエクスプレス 設定判別ツール</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f6f7f9}.c{background:#fff;padding:18px;border-radius:14px;margin:12px 0}.r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}input,button{padding:10px;border-radius:8px;border:1px solid #ddd}.n{color:#666;font-size:.9rem}</style><main><section class=c><h1>バーニングエクスプレス 設定判別ツール</h1><p class=n>ボーナス初当り・リールロック合算・設定示唆を入力</p></section><section class=c><label>通常時ゲーム数 <input id=g type=number min=0></label><div class=r>ボーナス初当り <span><button onclick="a(0,-1)">−</button><b id=v0>0</b><button onclick="a(0,1)">＋</button></span></div><div class=r>リールロック <span><button onclick="a(1,-1)">−</button><b id=v1>0</b><button onclick="a(1,1)">＋</button></span></div><div class=r>設定示唆演出 <span><button onclick="a(2,-1)">−</button><b id=v2>0</b><button onclick="a(2,1)">＋</button></span></div><button onclick="j()">設定を判別する</button> <button onclick="r()">リセット</button><p id=o></p></section><section class=c><h2>設定別ボーナス初当り</h2><p>設定1 1/198.60、設定2 1/195.80、設定4 1/186.00、設定5 1/179.40、設定6 1/175.40。</p></section></main><script>let x=[0,0,0];function a(i,n){x[i]=Math.max(0,x[i]+n);document.getElementById('v'+i).textContent=x[i]}function j(){o.textContent=(+g.value||0)?'入力データを基に設定期待度を確認してください。':'通常時ゲーム数を入力してください'}function r(){x=[0,0,0];v0.textContent=v1.textContent=v2.textContent=0;g.value='';o.textContent=''}</script></html>
