<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ バイオハザード ヴィレッジ｜設定判別</title><style>body{max-width:760px;margin:auto;padding:16px;background:#f6f7f9;font-family:system-ui}section{background:#fff;padding:16px;margin:12px 0;border-radius:14px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px}button{padding:9px 13px;border:0;border-radius:8px;font-weight:700}.row{padding:9px 0;border-bottom:1px solid #eee}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:center}</style></head><body><main><h1>スマスロ バイオハザード ヴィレッジ｜設定判別</h1><section><h2>弱チェリー</h2><label>総ゲーム数<input id="g" type="number" min="0"></label><label>弱チェリー回数<input id="c" type="number" min="0"></label><button onclick="j()">判別する</button> <button onclick="z()">リセット</button><pre id="r">判定結果：</pre></section><section><h2>弱チェリー確率</h2><table><tr><th>設定</th><th>確率</th></tr><tr><td>1</td><td>1/98.85</td></tr><tr><td>2</td><td>1/96.66</td></tr><tr><td>3</td><td>1/95.26</td></tr><tr><td>4</td><td>1/90.27</td></tr><tr><td>5</td><td>1/88.68</td></tr><tr><td>6</td><td>1/87.15</td></tr></table></section><section><h2>PZ当選率（低確）</h2><div class="row">スイカ：設定1・2=0.39%／3・4=1.95%／5・6=1.17%</div><div class="row">弱チェリー：設定1・2=1.17%／3・4=1.95%／5・6=3.91%</div><div class="row">弱チャンス目：1・2=12.50%／3・4=15.23%／5・6=18.75%</div></section></main><script>function j(){let g=+document.getElementById('g').value||0,c=+document.getElementById('c').value||0;if(!g||!c){r.textContent='判定結果：ゲーム数と弱チェリー回数を入力してください。';return}let x=g/c,v=[98.85,96.66,95.26,90.27,88.68,87.15],b=1,e=1e9;v.forEach((n,i)=>{let d=Math.abs(x-n);if(d<e){e=d;b=i+1}});r.textContent=`判定結果：弱チェリー実績1/${x.toFixed(2)}。単純近似では設定${b}付近（参考値）`;}function z(){g.value=c.value='';r.textContent='判定結果：'}</script></body></html>
