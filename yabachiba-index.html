<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマスロ ヤバチバ｜設定判別ツール</title><style>body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d;margin-bottom:14px}.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.counter{display:flex;align-items:center;gap:10px}.counter button,.primary,.secondary{border:0;border-radius:9px;padding:10px 16px;font-weight:700}.counter button{background:#eee;font-size:1.2rem}.counter b{min-width:28px;text-align:center}.primary,.secondary{width:100%;margin-top:10px}.primary{background:#222;color:#fff}.secondary{background:#eee}.result{display:none}.result.show{display:block}.barrow{display:grid;grid-template-columns:55px 1fr 48px;gap:8px;align-items:center;margin:9px 0}.bg{height:12px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:#222}.pred{font-size:1.15rem;font-weight:700}.material{border-top:1px solid #eee;padding:12px 0}.material summary{font-weight:700}.note{font-size:.82rem;color:#666;line-height:1.6}@media(max-width:520px){.games{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="card"><h1>スマスロ ヤバチバ</h1><p>設定判別ツール</p></header><section class="card"><div class="games"><label>総ゲーム数<input id="g" type="number" min="0"></label><label>開始ゲーム数<input id="st" type="number" min="0"></label></div><div class="row"><span>ベル集中回数</span><div class="counter"><button onclick="add(-1)">−</button><b id="b">0</b><button onclick="add(1)">＋</button></div></div><button class="primary" onclick="judge()">設定判別</button><button class="secondary" onclick="resetAll()">リセット</button></section><section id="res" class="card result"><h2>判別結果</h2><div id="pred" class="pred">—</div><div id="bars"></div></section><section class="card"><h2>各種判定材料</h2><details class="material"><summary>ベル集中</summary><p class="note">設定1/2/4/5/6のベル集中確率を主要な数値判別材料にします。設定3は公開値の対象外として除外します。</p></details><details class="material"><summary>リールバックランプ</summary><p class="note">ボーナス入賞時のランプ演出は補助材料として確認します。</p></details><details class="material"><summary>トップランプ</summary><p class="note">ボーナス終了時のトップランプは継続期待度を示す要素として、設定示唆とは分けて扱います。</p></details></section></main><script>const sets=[1,2,4,5,6],rate=[7163,6509,3643,2906,1767];let b=0;function add(n){b=Math.max(0,b+n);document.getElementById('b').textContent=b}function judge(){const G=Math.max(0,(+g.value||0)-(+st.value||0));if(!G)return alert('判別対象ゲーム数を入力してください。');const x=rate.map(r=>b*Math.log(G/r)-G/r),m=Math.max(...x),w=x.map(v=>Math.exp(v-m)),t=w.reduce((a,c)=>a+c,0),p=w.map(v=>v/t*100),best=p.indexOf(Math.max(...p));pred.textContent='推定設定：設定'+sets[best]+'（'+G+'G）';bars.innerHTML=p.map((v,i)=>`<div class="barrow"><span>設定${sets[i]}</span><div class="bg"><div class="bar" style="width:${v.toFixed(1)}%"></div></div><b>${v.toFixed(1)}%</b></div>`).join('');res.classList.add('show')}function resetAll(){b=0;document.getElementById('b').textContent='0';g.value=st.value='';res.classList.remove('show')}</script></body></html>
